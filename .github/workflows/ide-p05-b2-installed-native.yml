name: IDE P05 B2 native Windows installed draft references
on:
  pull_request:
    paths:
      - 'ide/app/**'
      - 'ide/docs/IDE_P05_B2_DRAFT_REFERENCE_PORT_20261107.md'
      - '.github/workflows/ide-p05-b2-installed-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  p05-b2-native-draft-reference-installed:
    runs-on: windows-2022
    timeout-minutes: 85
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Prove exact source checkout before installed build
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ine '${{ github.event.pull_request.head.sha || github.sha }}') {
            throw 'DENIED: installed Windows source checkout is not exact pull-request head'
          }
      - name: Validate frontend and Rust host contract
        working-directory: ide/app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Fetch resolved Cargo sources and embed third-party license notices
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform windows-2022
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: installer resolved lock graph differs from reviewed OS evidence' }
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: npm locked install failed' }
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: Cargo locked resolution failed' }
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform windows-2022
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: locked reinstall changed OS dependency graph' }
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: cannot resolve native dependency license sources' }
          python ide/packaging/verify_tauri_minor.py --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: resolved Tauri minor mismatch' }
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha $env:SOURCE_SHA --output ide/app/src-tauri/upstream-notice-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: upstream licenses not retrieved from exact origins' }
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha $env:SOURCE_SHA --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: third-party verification licenses not generated' }
          Write-Host 'P04_UNSIGNED_INSTALLER_LICENSES=ACTUAL_RESOLVED_NOTICES_BUNDLED_NO_RELEASE_APPROVAL'
      - name: Build real default-disabled unsigned Windows NSIS
        working-directory: ide/app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.installed-smoke.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: real installed E2E NSIS build failed' }
      - name: Verify all collected legal bytes against exact unsigned NSIS hash
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $setup=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'DENIED: exact verified NSIS candidate required' }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha $env:SOURCE_SHA --require-upstream --artifact $setup[0].FullName --receipt ide/app/src-tauri/verification-package-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: packaged Windows licenses do not match source and installer hash' }
      - name: Attach unsigned Windows NSIS and matching resolved license bundle
        uses: actions/upload-artifact@v4
        with:
          name: lu-ide-p05-b2-windows-unsigned-verification
          path: |
            ide/app/src-tauri/target/release/bundle/nsis/*setup.exe
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Parse real Windows UI acceptance fixture without executing it
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1').Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw "DENIED: native acceptance fixture has invalid PowerShell: $($errors[0])" }
      - name: Install and interact with actual native WebView and OS picker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $setup=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'DENIED: exactly one native NSIS required' }
          $root=Join-Path $env:RUNNER_TEMP ('lu-ide-wo8-ui-'+$env:GITHUB_RUN_ID)
          $exe=Join-Path $root 'lu-ide-desktop.exe'
          $installed=$false
          $uninstalled=$false
          $uninstaller=$null
          if ((Test-Path -LiteralPath $root) -or (Get-Service LuIdeRecoveryBroker -ErrorAction SilentlyContinue)) {
            throw 'DENIED: native disposable runner already has Lu IDE/service'
          }
          try {
            $setupProcess=Start-Process -FilePath $setup[0].FullName -ArgumentList @('/S',('/D='+$root)) -PassThru -Wait
            if ($setupProcess.ExitCode -ne 0) { throw 'DENIED: native unsigned NSIS install failed' }
            $installed=$true
            if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'DENIED: installed desktop missing' }
            $noticeFile=Join-Path $root 'THIRD_PARTY_LICENSES\inventory.json'
            if (!(Test-Path -LiteralPath $noticeFile -PathType Leaf)) {
              throw 'DENIED: installed NSIS verification package omitted third-party license evidence'
            }
            if (!(Test-Path -LiteralPath (Join-Path $root 'THIRD_PARTY_LICENSES\upstream-fetch.json') -PathType Leaf)) {
              throw 'DENIED: installed NSIS omitted retrieved original upstream license evidence'
            }
            $notice=Get-Content -LiteralPath $noticeFile -Raw | ConvertFrom-Json
            if ($notice.sourceSha -ine '${{ github.event.pull_request.head.sha || github.sha }}' -or
                $notice.releaseApproved -ne $false) {
              throw 'DENIED: installed license source or release status mismatch'
            }
            Write-Host 'P04_NATIVE_WINDOWS_BUNDLED_LICENSE_INVENTORY=PASS'
            $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario Shell
            if (!$?) { throw 'DENIED: OS UI Automation native shell failed' }
            $fixture=Join-Path $env:RUNNER_TEMP ('lu-ide-wo8-fixture-'+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Path $fixture | Out-Null
            [IO.File]::WriteAllText((Join-Path $fixture 'main.rs'),"fn main() { println!(`"wo8`"); }`n")
            $sourcePath=Join-Path $fixture 'main.rs'
            $originalSourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario EditorPersistence -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: native UI editor review/save failed' }
            $newSourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
            if ($newSourceHash -eq $originalSourceHash) { throw 'DENIED: explicit save did not change fixture source' }
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario PersistedRestart -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: native project restart/persistence failed' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash -ne $newSourceHash) {
              throw 'DENIED: reopened fixture source unexpectedly mutated'
            }
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario ExternalConflict -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: real external-source collision did not preserve disk edits and local draft' }
            $currentSource=[IO.File]::ReadAllText($sourcePath)
            if (!$currentSource.Contains('WO8_CONFLICT_EXTERNAL_UPDATE') -or
                $currentSource.Contains('WO8_UNSAVED_LOCAL_DRAFT')) {
              throw 'DENIED: external conflict incorrectly saved IDE draft or lost external edit'
            }
            $draftFixture=Join-Path $env:RUNNER_TEMP ('lu-ide-p05-b2-draft-'+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Path $draftFixture | Out-Null
            [IO.File]::WriteAllText((Join-Path $draftFixture 'main.rs'),"fn main() { println!(`"draft`"); }`n")
            $draftDigest=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $draftFixture 'main.rs')).Hash
            & pwsh -NoProfile -Sta -File 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario DraftBufferReference -FixtureRoot $draftFixture
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: real installed P05 B2 draft/undo clipboard acceptance failed' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $draftFixture 'main.rs')).Hash -ne $draftDigest) {
              throw 'DENIED: P05 B2 clipboard or Undo silently modified disk bytes'
            }
            Write-Host 'P05_B2_INSTALLED_NATIVE_WINDOWS_DRAFT_NO_IMPLICIT_SAVE=PASS'
            $uninstallers=@(Get-ChildItem $root -Filter '*uninstall*.exe' -File)
            if ($uninstallers.Count -ne 1) { throw 'DENIED: installed uninstaller missing' }
            $uninstaller=$uninstallers[0].FullName
            $removal=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
            if ($removal.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'DENIED: uninstall did not remove installed IDE' }
            $uninstalled=$true
            Write-Host 'WO8_NATIVE_INSTALLED_UI_AND_PROJECT=PASS'
            Write-Host 'WO8_NATIVE_PROTECTED_FEATURES=NOT_ACCEPTED'
          } finally {
            if ($installed -and !$uninstalled) {
              Write-Warning 'WO8 native installed test incomplete; cleanup attempted and acceptance not granted'
              if ($uninstaller -and (Test-Path $uninstaller)) {
                try { Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait | Out-Null } catch {}
              }
            }
          }
      - name: Bound result meaning
        shell: pwsh
        run: |
          Write-Host 'Only real unsigned installed desktop/UI/folder and source read accepted.'
          Write-Host 'No signed release, protected tool execution or cross-crash recovery claim.'
