# FIN-04W2-A/B contract and Windows kernel *negative* preflight.
# No installer, SCM service creation, debugger launch or runtime authority.
name: IDE FIN-04W2 broker protocol and native preflight
on:
  pull_request:
    paths:
      - 'ide/supervisor/**'
      - '.github/workflows/ide-fin04w2-preflight-native.yml'
permissions:
  contents: read
concurrency:
  group: ide-fin04w2-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  read-only-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo 'FIN04W2_TEST_SOURCE=EXACT_HEAD'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build and test only default-off broker preflight
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/supervisor/Cargo.toml --features fin04w2-protocol --lib fin04w2 -- --nocapture
          echo 'FIN04W2_BROKER_SHAPE_AND_KERNEL_NEGATIVE_PREFLIGHT=PASS'
          echo 'FIN04W2_SERVICE_EXECUTION_OR_WFP_CONTAINMENT=NOT_TESTED'

  native-windows-scm-identity:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact reviewed source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo 'FIN04W2_NATIVE_SCM_SOURCE=EXACT_HEAD'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Compile distinct debugger SCM broker without LLDB execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo build --manifest-path ide/supervisor/Cargo.toml --features fin04w2-scm --bin windows_fin04w2_debugger_service
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native SCM service binary compilation failed' }
      - name: Start genuine restricted LocalService under SCM and require OS-token acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='LuIdeDebuggerBroker'
          $binary=(Resolve-Path 'ide/supervisor/target/debug/windows_fin04w2_debugger_service.exe').Path
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'DENIED: service executable absent' }
          if ((Get-Item -LiteralPath $binary).Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw 'DENIED: service binary reparse point'
          }
          $expected=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($identity)
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'DENIED: native SCM test requires elevated runner'
          }
          if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
            throw 'DENIED: unexpected pre-existing debugger service'
          }
          $created=$false
          try {
            $scArgs=@('create',$name,'binPath=',$binary,'type=','own',
              'start=','demand','obj=','NT AUTHORITY\LocalService')
            & sc.exe @scArgs | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: new debugger SCM service creation failed' }
            $created=$true
            & sc.exe sidtype $name restricted | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: restricted SID configuration failed' }
            & sc.exe privs $name 'SeChangeNotifyPrivilege/SeImpersonatePrivilege' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: required minimal service privilege setup failed' }
            $sid=@(& sc.exe qsidtype $name 2>&1 | ForEach-Object {[string]$_})
            if ($LASTEXITCODE -ne 0 -or -not (($sid -join ' ') -match 'RESTRICTED')) {
              throw 'DENIED: kernel SCM config does not report restricted service SID'
            }
            & sc.exe start $name | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: restricted SCM process failed to start' }
            $state=$null
            for ($i=0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $state=Get-CimInstance Win32_Service -Filter "Name='$name'"
              if ($state -and $state.State -eq 'Running' -and $state.ProcessId -gt 0) { break }
              if ($state -and $state.State -eq 'Stopped') { break }
            }
            if (!$state -or $state.State -ne 'Running' -or $state.ProcessId -le 0) {
              $why=if ($state) { "state=$($state.State);exit=$($state.ExitCode)" } else { 'service_missing' }
              throw "DENIED: native token/SCM admission rejected ($why)"
            }
            if ($state.StartName -notmatch 'LocalService') {
              throw 'DENIED: SCM token account mismatch'
            }
            if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $expected) {
              throw 'DENIED: service executable changed during native acceptance'
            }
            Write-Host 'FIN04W2_NATIVE_RESTRICTED_LOCAL_SERVICE_TOKEN=PASS'
            Write-Host 'FIN04W2_NATIVE_SCM_RUNNING_AND_SERVICE_SID=PASS'
            Write-Host 'FIN04W2_CHILD_JOB_ACL_WFP_AND_LLDB=NOT_VERIFIED'
          } finally {
            if ($created) {
              & sc.exe stop $name 2>$null | Out-Null
              Start-Sleep -Seconds 2
              & sc.exe delete $name 2>$null | Out-Null
            }
          }
