# FIN-04W2-A/B broker grammar and genuine Windows SCM kernel preflight.
# Disposable hosted-CI SCM installation is NOT creator-authorized desktop installation.
# No LLDB, WFP policy, debuggee process or production debugger authority.
name: IDE FIN-04W2 broker protocol and native preflight
on:
  pull_request:
    paths:
      - 'ide/supervisor/**'
      - 'ide/app/src-tauri/**' # C4 native desktop links existing fixed service
      - '.github/workflows/ide-fin04w2-preflight-native.yml'
permissions:
  contents: read
concurrency:
  group: ide-fin04w2-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  read-only-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo 'FIN04W2_TEST_SOURCE=EXACT_HEAD'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build and test only default-off broker preflight
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/supervisor/Cargo.toml --features fin04w2-protocol --lib fin04w2 -- --nocapture
          echo 'FIN04W2_BROKER_SHAPE_AND_KERNEL_NEGATIVE_PREFLIGHT=PASS'
          echo 'FIN04W2_SERVICE_EXECUTION_OR_WFP_CONTAINMENT=NOT_TESTED'

  native-windows-scm-identity:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact reviewed source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo 'FIN04W2_NATIVE_SCM_SOURCE=EXACT_HEAD'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Compile distinct debugger SCM broker without LLDB execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo build --manifest-path ide/supervisor/Cargo.toml --features fin04w2-scm --bin windows_fin04w2_debugger_service
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native SCM service binary compilation failed' }
      - name: Start genuine restricted LocalService under SCM and require OS-token acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='LuIdeDebuggerBroker'
          $binary=(Resolve-Path 'ide/supervisor/target/debug/windows_fin04w2_debugger_service.exe').Path
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'DENIED: service executable absent' }
          if ((Get-Item -LiteralPath $binary).Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw 'DENIED: service binary reparse point'
          }
          $expected=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($identity)
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'DENIED: native SCM test requires elevated runner'
          }
          if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
            throw 'DENIED: unexpected pre-existing debugger service'
          }
          $created=$false
          try {
            $scArgs=@('create',$name,'binPath=',$binary,'type=','own',
              'start=','demand','obj=','NT AUTHORITY\LocalService')
            & sc.exe @scArgs | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: new debugger SCM service creation failed' }
            $created=$true
            & sc.exe sidtype $name restricted | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: restricted SID configuration failed' }
            & sc.exe privs $name 'SeChangeNotifyPrivilege/SeImpersonatePrivilege' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: required minimal service privilege setup failed' }
            # CI-only install pins the exact service and current native pwsh
            # client hashes and provides a strictly REVIEW-ONLY plan. There
            # is no build receipt, no child Job, no WFP policy and no launch.
            $root=Join-Path $env:ProgramData 'LuIDEDebuggerBroker'
            if (Test-Path -LiteralPath $root) { throw 'DENIED: debugger evidence root already exists' }
            $hostExe=(Get-Process -Id $PID).Path
            $hostHash=(Get-FileHash -LiteralPath $hostExe -Algorithm SHA256).Hash
            $serviceSid='NT SERVICE\LuIdeDebuggerBroker'
            $system='NT AUTHORITY\SYSTEM'
            New-Item -Force -ItemType Directory -Path $root | Out-Null
            $plan=[ordered]@{
              projectId=('ide-' + ('a'*32))
              recipeId='dap_lldb_project'
              sourceHead=('b'*40)
              inputSnapshotSha256=('c'*64)
              manifestSha256=('d'*64)
              toolchainSha256=('e'*64)
              debugTargetBindingSha256=('f'*64)
              runtimeLimitMs=90000
              memoryLimitBytes=536870912
              processLimit=16
              logLimitBytes=65536
              effectClass='debug_inspection_isolated'
            }
            $config=[ordered]@{
              schema='lu.ide.fin04w2.audit.v1'
              serviceName=$name
              endpoint='\\.\pipe\LuIdeDebuggerBroker.v1'
              expectedServiceSha256=$expected.ToLowerInvariant()
              expectedHostSha256=$hostHash.ToLowerInvariant()
              approvedHostExecutable=$hostExe
              approvedHostUserSid=$identity.User.Value
              reviewOnlyPlan=$plan
              reviewOnlyPlanHash=('aa'*32)
              reviewOnlyNonce=('42'*16)
            }
            $cfg=Join-Path $root 'service.json'
            $config|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $cfg -Encoding utf8 -NoNewline
            & icacls.exe $cfg /inheritance:r /grant:r ($system+':F') ($serviceSid+':M') | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: debugger service config DACL' }
            & icacls.exe $root /inheritance:r /grant:r ($system+':(OI)(CI)F') ($serviceSid+':(OI)(CI)M') | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: debugger service evidence DACL' }
            $rootAcl=Get-Acl -LiteralPath $root
            if (!$rootAcl.AreAccessRulesProtected -or
                @($rootAcl.Access|Where-Object {
                  $_.AccessControlType -ne 'Allow' -or
                  $_.IdentityReference.Value -notin @($system,$serviceSid)
                }).Count) {
              throw 'DENIED: debugger evidence has inherited or unknown ACE'
            }
            $sid=@(& sc.exe qsidtype $name 2>&1 | ForEach-Object {[string]$_})
            if ($LASTEXITCODE -ne 0 -or -not (($sid -join ' ') -match 'RESTRICTED')) {
              throw 'DENIED: kernel SCM config does not report restricted service SID'
            }
            & sc.exe start $name | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: restricted SCM process failed to start' }
            $state=$null
            for ($i=0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $state=Get-CimInstance Win32_Service -Filter "Name='$name'"
              if ($state -and $state.State -eq 'Running' -and $state.ProcessId -gt 0) { break }
              if ($state -and $state.State -eq 'Stopped') { break }
            }
            if (!$state -or $state.State -ne 'Running' -or $state.ProcessId -le 0) {
              $why=if ($state) { "state=$($state.State);exit=$($state.ExitCode);nativeStage=$($state.ServiceSpecificExitCode)" } else { 'service_missing' }
              throw "DENIED: native token/SCM admission rejected ($why)"
            }
            if ($state.StartName -notmatch 'LocalService') {
              throw 'DENIED: SCM token account mismatch'
            }
            if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $expected) {
              throw 'DENIED: service executable changed during native acceptance'
            }
            Write-Host 'FIN04W2_NATIVE_RESTRICTED_LOCAL_SERVICE_TOKEN=PASS'
            Write-Host 'FIN04W2_NATIVE_SCM_RUNNING_AND_SERVICE_SID=PASS'
            Write-Host 'FIN04W2_CHILD_JOB_ACL_WFP_AND_LLDB=NOT_VERIFIED'
            # This never sends a runnable DAP/LLDB request. The broker
            # authenticates the real named-pipe client PID, birth timestamp,
            # installed host executable and original user token, then checks
            # only the fixed 92-byte staged review contract.
            $packet=New-Object byte[] 92
            [Text.Encoding]::ASCII.GetBytes('LUFW2A01').CopyTo($packet,0)
            $packet[8]=1; $packet[9]=1
            for ($i=12;$i -lt 44;$i++) { $packet[$i]=170 }
            for ($i=44;$i -lt 76;$i++) { $packet[$i]=255 }
            for ($i=76;$i -lt 92;$i++) { $packet[$i]=66 }
            function Invoke-CiBrokerAudit([byte[]]$value) {
              $client=[System.IO.Pipes.NamedPipeClientStream]::new(
                '.', 'LuIdeDebuggerBroker.v1',
                [System.IO.Pipes.PipeDirection]::InOut,
                [System.IO.Pipes.PipeOptions]::None,
                [Security.Principal.TokenImpersonationLevel]::Impersonation)
              try {
                $client.Connect(5000)
                $client.Write($value,0,$value.Length)
                $client.Flush()
                try { return $client.ReadByte() } catch { return -1 }
              } finally { $client.Dispose() }
            }
            $bad=[byte[]]$packet.Clone()
            $bad[9]=255
            if ((Invoke-CiBrokerAudit $bad) -eq 65) {
              throw 'DENIED: unknown debugger broker method incorrectly accepted'
            }
            foreach ($verb in @(2,3,4,5,6)) {
              $unapproved=[byte[]]$packet.Clone()
              $unapproved[9]=[byte]$verb
              if ((Invoke-CiBrokerAudit $unapproved) -eq 65) {
                throw 'DENIED: valid-shaped executable/control request was incorrectly acknowledged'
              }
            }
            Write-Host 'FIN04W2_NATIVE_UNAUTHORIZED_LAUNCH_AND_CONTROL=DENIED'
            if ((Invoke-CiBrokerAudit $packet) -ne 65) {
              throw 'DENIED: actual Windows kernel client authentication or review grammar absent'
            }
            Write-Host 'FIN04W2_NATIVE_AUTHENTICATED_CLIENT_AND_FIXED_PIPE_ACL=PASS'
            if ((Invoke-CiBrokerAudit $packet) -eq 65) {
              throw 'DENIED: duplicate broker audit packet accepted'
            }
            Write-Host 'FIN04W2_NATIVE_AUDIT_ONLY_REPLAY_DENIAL=PASS'
            Write-Host 'FIN04W2_LIVE_LAUNCH_AND_WFP_EGRESS=NOT_VERIFIED'
          } finally {
            if ($created) {
              & sc.exe stop $name 2>$null | Out-Null
              Start-Sleep -Seconds 2
              & sc.exe delete $name 2>$null | Out-Null
            }
          }
