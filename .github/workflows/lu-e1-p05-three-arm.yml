name: Lu E1-P05 Real Three Arm Execution Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-e1-p05-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frozen-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact E1 source checkout identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'LU_E1_SOURCE_HEAD=%s\n' "$actual"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
      - name: Benchmark scorer contract (no fabricated measurements)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/e1/e1_p05_real_three_arm.py
          python3 -m unittest discover -s benchmarks/e1 -p 'test_e1_p05_*.py' -v
  genuine-native-two-arms:
    needs: frozen-source-contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact E1 source checkout identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'LU_E1_SOURCE_HEAD=%s\n' "$actual"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Build actual Lu utility and reviewed worker runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --example e1_p05_native_task --example e1_reviewed_artifact_worker
      - name: Run same real disposable document/spreadsheet tasks without any model
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          root="$RUNNER_TEMP/e1-p05-native-${RUNNER_OS}"
          python3 benchmarks/e1/e1_p05_real_three_arm.py \
            --native "$GITHUB_WORKSPACE/src-tauri/lu-core/target/debug/examples/e1_p05_native_task${suffix}" \
            --worker "$GITHUB_WORKSPACE/src-tauri/lu-core/target/debug/examples/e1_reviewed_artifact_worker${suffix}" \
            --repeats 2 --source-commit "$(git rev-parse HEAD)" --output-dir "$root"
          python3 benchmarks/e1/verify_e1_p05_raw.py "$root/e1_p05_raw.json" \
            --source-commit "$(git rev-parse HEAD)" --mode native-only --repeats 2
          cat "$root/e1_p05_summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-e1-p05-native-actual-${{ matrix.os }}
          path: ${{ runner.temp }}/e1-p05-native-${{ runner.os }}/
          retention-days: 14
          if-no-files-found: warn
  genuine-qwen-three-arms:
    needs: frozen-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      MODEL_SHA: 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact E1 source checkout identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'LU_E1_SOURCE_HEAD=%s\n' "$actual"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Build real Lu utility and reviewed OS-native artifact worker
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path src-tauri/lu-core/Cargo.toml \
            --example e1_p05_native_task --example e1_reviewed_artifact_worker
      - name: Build pin-verified local llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b12143 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-cpp"
          test "$(git -C "$RUNNER_TEMP/llama-cpp" rev-parse HEAD)" = 2bc46baa9207d098d03741ac394e7faaf1a955b6
          cmake -S "$RUNNER_TEMP/llama-cpp" -B "$RUNNER_TEMP/llama-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --config Release \
            --target llama-server --parallel 3
      - name: SHA-pinned genuine GGUF (never substitute fake text generations)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 \
            https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf \
            -o "$RUNNER_TEMP/e1-p05-qwen.gguf"
          printf '%s  %s\n' "$MODEL_SHA" "$RUNNER_TEMP/e1-p05-qwen.gguf" | sha256sum -c -
      - name: Run actual same-task local model, native utility and reviewed app
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/e1/e1_p05_real_three_arm.py \
            --native "$GITHUB_WORKSPACE/src-tauri/lu-core/target/release/examples/e1_p05_native_task" \
            --worker "$GITHUB_WORKSPACE/src-tauri/lu-core/target/release/examples/e1_reviewed_artifact_worker" \
            --engine "$RUNNER_TEMP/llama-build/bin/llama-server" \
            --model "$RUNNER_TEMP/e1-p05-qwen.gguf" \
            --repeats 2 --source-commit "$(git rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/e1-p05-three-arm-real"
          python3 benchmarks/e1/verify_e1_p05_raw.py \
            "$RUNNER_TEMP/e1-p05-three-arm-real/e1_p05_raw.json" \
            --source-commit "$(git rev-parse HEAD)" --mode three-arm --repeats 2
          cat "$RUNNER_TEMP/e1-p05-three-arm-real/e1_p05_summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Disclose missing genuine measurements rather than fabricate a result
        if: always()
        shell: bash
        run: |
          if test ! -f "$RUNNER_TEMP/e1-p05-three-arm-real/e1_p05_raw.json"; then
            echo "No completed genuine E1-P05 model/native paired results. Acceptance OPEN." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-e1-p05-genuine-qwen-utility-reviewed-app
          path: ${{ runner.temp }}/e1-p05-three-arm-real/
          if-no-files-found: warn
          retention-days: 14
