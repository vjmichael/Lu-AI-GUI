name: Lu CP-DEV-01C offline dependency transport (download only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-cp-dev-offline-cache
  cancel-in-progress: false
jobs:
  collect-exact-offline-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ACCEPTED_SHA: fc0c2e3f5e457c32d66276a84b2ec40d09e60c34
      ACCEPTED_TREE: cef4cf77290e6c6f3bbbfce86dde51aa7f07dd48
      MODEL_SHA: 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_SHA }}
          path: accepted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify accepted source and transport original Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          test "$(git -C accepted rev-parse HEAD)" = "$ACCEPTED_SHA"
          test "$(git -C accepted rev-parse 'HEAD^{tree}')" = "$ACCEPTED_TREE"
          (cd accepted && node scripts/verify-source-tree.mjs)
          git -C accepted bundle create "$RUNNER_TEMP/source/LuCore-fc0c2e3f.bundle" HEAD
          git -C accepted bundle verify "$RUNNER_TEMP/source/LuCore-fc0c2e3f.bundle"
          (cd "$RUNNER_TEMP/source" && sha256sum LuCore-fc0c2e3f.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: lu-cp-dev-exact-source-fc0c2e3f
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Fetch locked Rust and npm archives, verify every digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependencies" "$RUNNER_TEMP/transport-evidence"
          python3 infra/scripts/lu-dev-offline-collect.py --repo accepted --out "$RUNNER_TEMP/dependencies" --cargo-home "$RUNNER_TEMP/offline-cargo" 2>&1 | tee "$RUNNER_TEMP/transport-evidence/dependencies.log"
      - uses: actions/upload-artifact@v4
        with:
          name: lu-cp-dev-locked-dependencies-fc0c2e3f
          path: ${{ runner.temp }}/dependencies/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Fetch and verify only the accepted public GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model"
          model="$RUNNER_TEMP/model/Qwen3-0.6B.Q4_K_M.gguf"
          curl -fL --proto '=https' --proto-redir '=https' --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 600 --max-filesize 1000000000 https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf -o "$model.part"
          printf '%s  %s\n' "$MODEL_SHA" "$model.part" | sha256sum -c -
          mv "$model.part" "$model"
          (cd "$RUNNER_TEMP/model" && sha256sum Qwen3-0.6B.Q4_K_M.gguf > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: lu-cp-dev-pinned-qwen3-0.6b-fc0c2e3f
          path: ${{ runner.temp }}/model/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-cp-dev-transport-evidence-fc0c2e3f
          path: ${{ runner.temp }}/transport-evidence/
          if-no-files-found: ignore
          retention-days: 14
