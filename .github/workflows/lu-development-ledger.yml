name: Lu development ledger refresh

# Metadata-only maintenance. Never builds or merges untrusted PR source.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lu-development-ledger.yml'
      - 'scripts/lu-ledger.mjs'
      - 'scripts/lu-ledger.test.mjs'
      - 'docs/LU_OPEN_PR_GRAPH.json'
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write

concurrency:
  group: lu-main-development-ledger
  cancel-in-progress: false

jobs:
  verify-on-source-change:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify snapshot generator tests
        run: node --test scripts/lu-ledger.test.mjs
      - name: Confirm committed ledger and graph agree
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const g=JSON.parse(fs.readFileSync("docs/LU_OPEN_PR_GRAPH.json")); if(g.schema!==1 || g.openCount!==g.pullRequests.length) process.exit(1); fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"lu-pr-fixture.json"), JSON.stringify(g.pullRequests.map(p=>({number:p.number,title:p.title,draft:p.draft,head:p.head,base:p.base}))));'
          node scripts/lu-ledger.mjs --check --fixture "$RUNNER_TEMP/lu-pr-fixture.json" --graph docs/LU_OPEN_PR_GRAPH.json

  refresh:
    if: github.repository == 'vjmichael/Lu-AI-GUI' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative main ledger
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test snapshot integrity and drift detection
        run: node --test scripts/lu-ledger.test.mjs
      - name: Refresh only active-PR metadata block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/lu-ledger.mjs --update --graph docs/LU_OPEN_PR_GRAPH.json
      - name: Commit metadata-only refresh if needed
        shell: bash
        run: |
          if git diff --quiet -- docs/LU_DEVELOPMENT_LEDGER.md docs/LU_OPEN_PR_GRAPH.json; then
            echo "No change in open Lu PR metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/LU_DEVELOPMENT_LEDGER.md docs/LU_OPEN_PR_GRAPH.json
          git commit -m "docs(ledger): refresh open PR snapshot [skip ci]"
          git push origin HEAD:main
