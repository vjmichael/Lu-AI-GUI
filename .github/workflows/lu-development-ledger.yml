name: Lu development ledger refresh

# Metadata-only maintenance. Never builds or merges untrusted PR source.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write

concurrency:
  group: lu-main-development-ledger
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'vjmichael/Lu-AI-GUI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative main ledger
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test snapshot integrity and drift detection
        run: node --test scripts/lu-ledger.test.mjs
      - name: Refresh only active-PR metadata block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/lu-ledger.mjs --update
      - name: Commit metadata-only refresh if needed
        shell: bash
        run: |
          if git diff --quiet -- docs/LU_DEVELOPMENT_LEDGER.md; then
            echo "No change in open Lu PR metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/LU_DEVELOPMENT_LEDGER.md
          git commit -m "docs(ledger): refresh open PR snapshot [skip ci]"
          git push origin HEAD:main
