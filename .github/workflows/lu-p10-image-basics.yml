name: Lu P10 Basic Image Tool Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
      - run: node --test lu-desktop/tests/p10-image-boundary.test.mjs lu-desktop/tests/image-workspace-effects.test.mjs lu-desktop/tests/image-workspace-history.test.mjs
  native:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml native_image_revision::tests
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml native_image_revision_history::tests
