name: Lu P10 Basic Image Tool Acceptance
on:
  push:
    branches:
      - lu/p10-image-boundary-20261107
  pull_request:
    paths:
      - 'src-tauri/lu-core/src/native_image_revision.rs'
      - 'src-tauri/lu-core/src/native_image_revision_history.rs'
      - 'lu-desktop/src-tauri/src/image_workspace_desktop.rs'
      - 'lu-desktop/tests/image-workspace-*'
      - 'lu-desktop/tests/p10-image-boundary.test.mjs'
      - 'docs/LU_AI_TOOL_DESIGN_PRINCIPLES_20261107.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
      - run: node --test lu-desktop/tests/p10-image-boundary.test.mjs lu-desktop/tests/image-workspace-effects.test.mjs lu-desktop/tests/image-workspace-history.test.mjs
  native:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml native_image_revision::tests
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml native_image_revision_history::tests
