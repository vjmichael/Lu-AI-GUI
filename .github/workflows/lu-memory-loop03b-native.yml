name: Lu MEMORY-LOOP-03B Source-Verified Procedure, Belief and CCM Native Acceptance
on:
  workflow_dispatch:
    inputs:
      run_real_qwen:
        description: 'Run pinned real small-Qwen 03C comparison after native host-fixture checks'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lu-memory-loop03b-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-memory:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head and frozen full Git source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p memory-loop03b-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs 2>&1 | tee memory-loop03b-evidence/source-lock.log
          printf 'SOURCE_SHA=%s\nOS=%s\n' "$EXPECTED_SHA" "$RUNNER_OS" > memory-loop03b-evidence/source.txt
      - name: Pure standalone host state classification (not Tauri acceptance)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lu-memory-loop03b-host"
          if test "$RUNNER_OS" = "Windows"; then bin="$bin.exe"; fi
          rustc --edition=2021 --test lu-desktop/src-tauri/src/memory_loop03b_policy.rs -o "$bin" 2>&1 | tee memory-loop03b-evidence/policy-compile.log
          "$bin" --nocapture 2>&1 | tee memory-loop03b-evidence/policy-tests.log
          grep -Fq 'test result: ok. 7 passed; 0 failed;' memory-loop03b-evidence/policy-tests.log
      - name: Historical-source contracts (not installed proof)
        shell: bash
        run: |
          set -euo pipefail
          node --test lu-desktop/tests/memory-loop03b-source.test.mjs 2>&1 | tee memory-loop03b-evidence/source-contracts.log
          grep -Fq '# pass 11' memory-loop03b-evidence/source-contracts.log
          grep -Fq '# fail 0' memory-loop03b-evidence/source-contracts.log
      - name: Real Linux Tauri dependency libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf ffmpeg
      - name: Windows test-only nonengine runtime fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'NOT_AN_ENGINE_CI_PLACEHOLDER' -NoNewline
          }
      - name: Linux real reviewed Git and FFprobe OS binary admission
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git_bin="$(command -v git)"
          probe_bin="$(command -v ffprobe)"
          test -x "$git_bin" && test -x "$probe_bin"
          printf 'LU_MEMORY_LOOP03C_GIT=%s\nLU_MEMORY_LOOP03C_FFPROBE=%s\n' "$git_bin" "$probe_bin" >> "$GITHUB_ENV"
          git --version
          ffprobe -version | sed -n '1p'
      - name: Windows real reviewed Git and FFprobe OS binary admission
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $git=(Get-Command git.exe -ErrorAction Stop).Source
          $ff=(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)
          if (-not $ff) {
            choco install ffmpeg --yes --no-progress
            $pathCandidate=Join-Path $env:ChocolateyInstall 'bin\ffprobe.exe'
            if (Test-Path -LiteralPath $pathCandidate) { $ff=Get-Item $pathCandidate }
          }
          if (-not $ff) { throw 'Real FFprobe executable unavailable' }
          $probe=$ff.FullName
          if (-not $probe) { $probe=$ff.Source }
          if (-not (Test-Path -LiteralPath $git) -or -not (Test-Path -LiteralPath $probe)) {
            throw 'Real OS executable missing'
          }
          "LU_MEMORY_LOOP03C_GIT=$git" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LU_MEMORY_LOOP03C_FFPROBE=$probe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $git --version
          & $probe -version | Select-Object -First 1
      - name: Real React bundle and static interaction checks
        shell: bash
        run: |
          set -euo pipefail
          pushd lu-desktop
          npm ci --no-audit --no-fund
          npm run build
          npm run check
          popd
      - name: Genuine lu-core independent receipt tampering tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib journal::independent_outcome_tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/core-oracle-tests.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_verified_procedures::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/core-procedures.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_belief_revision::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/core-beliefs.log
      - name: Real Tauri source-bound GGUF ingress, beliefs and CCM integration
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib memory_loop03b_policy::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/desktop-policy.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib memory_loop03b_context::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/desktop-context.log
          grep -Fq 'test result: ok. 7 passed; 0 failed;' memory-loop03b-evidence/desktop-context.log
          cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml 2>&1 | tee memory-loop03b-evidence/desktop-compile.log
      - name: MEMORY-LOOP-03C actual native ANSF fixture and grader regressions
        shell: bash
        run: |
          set -euo pipefail
          export LU_MEMORY_LOOP03C_NATIVE_FIXTURE_PATH="$GITHUB_WORKSPACE/memory-loop03b-evidence/memory03c-native-corpus.json"
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib memory_loop03c_actual_original_ansf_host_capsule_corpus -- --nocapture \
            2>&1 | tee memory-loop03b-evidence/memory03c-native-corpus-test.log
          test -s memory-loop03b-evidence/memory03c-native-corpus.json
          # G4: Native Git observation is a test-only OS subprocess, not a Lu
          # approved worker; the actual ANSF, continuity and journal paths run.
          export LU_MEMORY_LOOP03C_POSITIVE_FIXTURE_PATH="$GITHUB_WORKSPACE/memory-loop03b-evidence/memory03c-positive-git-corpus.json"
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib \
            memory_loop03c_positive_direct_git_ansf_journal_and_correction_corpus -- --nocapture \
            2>&1 | tee memory-loop03b-evidence/memory03c-positive-native-git-test.log
          test -s memory-loop03b-evidence/memory03c-positive-git-corpus.json
          export LU_MEMORY_LOOP03C_REVIEWED_FIXTURE_PATH="$GITHUB_WORKSPACE/memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json"
          # G5: the EXISTING protected reviewed-app model->native registry
          # launches real OS Git+FFprobe, independently checks source bytes,
          # enforces fresh human consent on changed HEAD and reconciles SQLite.
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib \
            memory_loop03c_reviewed_git_ffprobe_changed_source_and_exclusive_restart \
            -- --ignored --nocapture \
            2>&1 | tee memory-loop03b-evidence/memory03c-reviewed-worker-native.log
          test -s memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json
          python3 -m unittest discover -s benchmarks/e1 -p test_memory_loop03c_reviewed_workers.py -v \
            2>&1 | tee memory-loop03b-evidence/memory03c-reviewed-worker-parser-tests.log
          python3 -m unittest discover -s benchmarks/e1 -p test_memory_loop03c_real_qwen_comprehension.py -v \
            2>&1 | tee memory-loop03b-evidence/memory03c-grader-tests.log
          python3 -m unittest discover -s benchmarks/e1 -p test_memory_loop03c_positive_git.py -v \
            2>&1 | tee memory-loop03b-evidence/memory03c-positive-grader-tests.log
          python3 benchmarks/e1/memory_loop03c_real_qwen_comprehension.py \
            --fixture memory-loop03b-evidence/memory03c-native-corpus.json \
            --positive-fixture memory-loop03b-evidence/memory03c-positive-git-corpus.json \
            --reviewed-fixture memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json \
            --output memory-loop03b-evidence/memory03c-fixture-validation-only.json \
            --validate-fixture-only
          echo '03C G5 uses real protected reviewed native Git/FFprobe workers, new human authority, changed-source CCM and journal recovery; the test-generated model calls are SCRIPTED, not GGUF, and escape-capable kernel custody remains unproven.' >> "$GITHUB_STEP_SUMMARY"
      - name: MEMORY-LOOP-03C optional pinned real Qwen source-only vs host-classified benchmark
        if: runner.os == 'Linux' && inputs.run_real_qwen
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b12143 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/memory03c-llama-cpp"
          actual="$(git -C "$RUNNER_TEMP/memory03c-llama-cpp" rev-parse HEAD)"
          test "$actual" = 2bc46baa9207d098d03741ac394e7faaf1a955b6
          cmake -S "$RUNNER_TEMP/memory03c-llama-cpp" -B "$RUNNER_TEMP/memory03c-llama-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/memory03c-llama-build" --target llama-server --parallel 3
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 \
            https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf \
            -o "$RUNNER_TEMP/memory03c-qwen.gguf"
          printf '%s  %s\n' 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d "$RUNNER_TEMP/memory03c-qwen.gguf" | sha256sum -c -
          python3 benchmarks/e1/memory_loop03c_real_qwen_comprehension.py \
            --engine "$RUNNER_TEMP/memory03c-llama-build/bin/llama-server" \
            --model "$RUNNER_TEMP/memory03c-qwen.gguf" \
            --fixture memory-loop03b-evidence/memory03c-native-corpus.json \
            --positive-fixture memory-loop03b-evidence/memory03c-positive-git-corpus.json \
            --reviewed-fixture memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json \
            --output memory-loop03b-evidence/memory03c-real-qwen-comparison.json \
            --repetitions 2 \
            2>&1 | tee memory-loop03b-evidence/memory03c-real-qwen-comparison.log
          echo '03C Qwen comparison uses a genuine pinned sub-1B GGUF, not target Qwen3.8 27B, and includes native reviewed Lu Git/FFprobe source observations; installed Lu and escape-capable kernel custody remain OPEN.' >> "$GITHUB_STEP_SUMMARY"
      - name: Unaccepted operational requirements
        if: always()
        shell: bash
        run: |
          echo '03B source and native checks do NOT demonstrate installed Lu, real loaded Qwen3.8 27B behavior, current Git/media source freshness, positive Win32 Job/Linux cgroup-v2 custody, automated replay or per-step effect authorization. Those are separate OPEN gates.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-memory-loop03b-native-${{ matrix.os }}
          path: memory-loop03b-evidence/
          if-no-files-found: warn
          retention-days: 14
