name: IDE WO8 signed installed protected build and LLDB acceptance (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed WO8 candidate source SHA
        required: true
        type: string
      candidate_run_id:
        description: Existing WO7 signed-candidate artifact workflow run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  signed-protected-native-e2e:
    runs-on: windows-2022
    timeout-minutes: 105
    environment: lu-ide-native-e2e
    steps:
      - name: Validate exact source and candidate locator
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:SOURCE_SHA -notmatch '^[a-fA-F0-9]{40}$' -or
              $env:ARTIFACT_RUN -notmatch '^[0-9]{1,20}$') {
            throw 'DENIED: exact SHA and numeric signed candidate run required'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: lu-ide-wo7-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify original signed release candidate and source SHA
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $head=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ine $env:SOURCE_SHA) {
            throw 'DENIED: checked-out exact source SHA differs'
          }
          python ide/packaging/verify_wo7_candidate.py --manifest candidate/wo7-release.manifest.json --artifact-root candidate --source-sha $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native Authenticode signed candidate verification failed' }
      - name: Install signed app and exercise real protected UI consent and native workers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $manifest=Get-Content candidate/wo7-release.manifest.json -Raw | ConvertFrom-Json
          $base=(Resolve-Path candidate).Path
          $installer=Join-Path $base $manifest.installer.path
          $root=Join-Path $env:ProgramFiles 'Lu IDE'
          $exe=Join-Path $root 'lu-ide-desktop.exe'
          if ((Test-Path $root) -or (Get-Service LuIdeRecoveryBroker -ErrorAction SilentlyContinue)) {
            throw 'DENIED: protected installed test requires clean native host'
          }
          $installed=$false
          $uninstalled=$false
          try {
            $install=Start-Process $installer -ArgumentList '/S' -PassThru -Wait
            if ($install.ExitCode -ne 0) { throw 'DENIED: real signed NSIS install failed' }
            $installed=$true
            if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'DENIED: signed desktop not installed' }
            if ((Get-FileHash -Algorithm SHA256 $exe).Hash -ine $manifest.desktop.sha256) {
              throw 'DENIED: installed native desktop not identical to pinned candidate'
            }
            $fixture=Join-Path $env:RUNNER_TEMP ('wo8-protected-'+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory (Join-Path $fixture 'src') -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $fixture 'Cargo.toml') -Encoding utf8 -Value @(
              '[package]','name = "wo8_native_smoke"','version = "0.1.0"','edition = "2021"'
            )
            [IO.File]::WriteAllText((Join-Path $fixture 'src/main.rs'),"fn main() { println!(`"installed`"); }`n")
            # Folder chooser and source open require a root file the UI can select.
            Copy-Item (Join-Path $fixture 'src/main.rs') (Join-Path $fixture 'main.rs')
            & cargo generate-lockfile --manifest-path (Join-Path $fixture 'Cargo.toml') --offline
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: fixed offline fixture manifest unavailable' }
            & git -C $fixture init | Out-Null
            & git -C $fixture -c user.name='WO8 disposable fixture' -c user.email='wo8@localhost.invalid' add .
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: fixture git add failed' }
            & git -C $fixture -c user.name='WO8 disposable fixture' -c user.email='wo8@localhost.invalid' commit -m 'fixed native acceptance fixture' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: fixture git commit failed' }
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $manifest.desktop.sha256 -Scenario ProtectedBuildDebug -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: actual GUI consent and protected OS receipts incomplete' }
            $remover=@(Get-ChildItem $root -File -Filter '*uninstall*.exe')
            if ($remover.Count -ne 1) { throw 'DENIED: no single installed uninstaller' }
            $uninstall=Start-Process $remover[0].FullName -ArgumentList '/S' -PassThru -Wait
            if ($uninstall.ExitCode -ne 0 -or (Get-Service LuIdeRecoveryBroker -ErrorAction SilentlyContinue) -or (Test-Path $exe)) {
              throw 'DENIED: protected service/process uninstall unverified'
            }
            $uninstalled=$true
            Write-Host 'WO8_SIGNED_INSTALLED_PROTECTED_CARGO_AND_LLDB_UI=PASS'
            Write-Host 'WO8_CRASH_CANCEL_AND_RECONCILIATION=NOT_TESTED'
          } finally {
            if ($installed -and !$uninstalled) {
              Write-Warning 'WO8 native protected acceptance did not finish; release cannot be approved'
            }
          }
      - name: Evidence limits
        shell: pwsh
        run: |
          Write-Host 'This run verifies real signed installed GUI consent/build/debug and uninstall only.'
          Write-Host 'Source swaps, cancellation races, host/service crash recovery and release approval remain separate gates.'
