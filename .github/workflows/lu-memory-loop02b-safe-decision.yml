name: Lu MEMORY-LOOP-02B Host Safe Decision Native Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-memory-loop02b-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  decision-policy:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source SHA and frozen source lock
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs
          mkdir -p memory-loop02b-evidence
          printf 'SOURCE_SHA=%s\nOS=%s\n' "$EXPECTED_SHA" "$RUNNER_OS" > memory-loop02b-evidence/source.txt
      - name: Run native Rust pure host policy, no desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lu-host-safe-decision-tests"
          if test "$RUNNER_OS" = "Windows"; then out="$out.exe"; fi
          rustc --edition=2021 --test lu-desktop/src-tauri/src/host_safe_continuation.rs -o "$out" 2>&1 | tee memory-loop02b-evidence/policy-compiler.log
          "$out" --nocapture 2>&1 | tee memory-loop02b-evidence/policy-native-tests.log
          grep -Fq 'test result: ok. 6 passed; 0 failed;' memory-loop02b-evidence/policy-native-tests.log
      - name: Nonexecuting and original-source contract guards
        shell: bash
        run: |
          set -euo pipefail
          node --test lu-desktop/tests/memory-loop02b-host-safe-decision.test.mjs 2>&1 | tee memory-loop02b-evidence/source-contracts.log
          grep -Fq '# pass 8' memory-loop02b-evidence/source-contracts.log
          grep -Fq '# fail 0' memory-loop02b-evidence/source-contracts.log
      - name: Install genuine Linux Tauri libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf
      - name: Windows non-engine build fixture (never inference evidence)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'NOT_AN_ENGINE_CI_PLACEHOLDER' -NoNewline
          }
      - name: Build actual desktop React assets and TypeScript checks
        shell: bash
        run: |
          set -euo pipefail
          pushd lu-desktop
          npm ci --no-audit --no-fund
          npm run build
          npm run check
          popd
      - name: Real native desktop SQLite reopening, tamper and host next decision
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib agent_verified_feedback::tests -- --nocapture 2>&1 | tee memory-loop02b-evidence/native-sqlite-feedback.log
          grep -Fq 'test result: ok. 3 passed; 0 failed;' memory-loop02b-evidence/native-sqlite-feedback.log
          cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml 2>&1 | tee memory-loop02b-evidence/native-desktop-compile.log
      - name: Scope of positive results
        if: always()
        shell: bash
        run: |
          echo 'MEMORY-LOOP-02B tests deterministic host classification, original SQLite reconstruction and desktop typecheck. Real Qwen 3.8 27B, installed Windows NSIS, Job/cgroup escaped descendant custody and fresh tool-authorized multi-step execution remain separate open gates.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-memory-loop02b-native-${{ matrix.os }}
          path: memory-loop02b-evidence/
          if-no-files-found: warn
          retention-days: 14
