name: Lu M4 Verified Procedural Memory Native Acceptance
on:
  push:
    branches: ['lu/m4-verified-procedural-memory-20261107']
    paths:
      - 'src-tauri/lu-core/**'
      - 'source-tree.lock.json'
      - '.github/workflows/lu-m4-verified-memory.yml'
  pull_request:
    paths:
      - 'src-tauri/lu-core/**'
      - 'source-tree.lock.json'
      - '.github/workflows/lu-m4-verified-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-m4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
  native-m4:
    needs: frozen-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Verify no source-tree drift
        run: node scripts/verify-source-tree.mjs
      - name: Real native ANSF procedural-memory promotion and invalidation regressions
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_verified_procedures::tests -- --nocapture
      - name: Existing ANSF source revisions and checkpoint receipt regressions
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib continuity::tests -- --nocapture
