name: Lu M4 Verified Procedural Memory Native Acceptance
on:
  push:
    branches: ['lu/m4-verified-procedural-memory-20261107']
    paths:
      - 'src-tauri/lu-core/**'
      - 'source-tree.lock.json'
      - '.github/workflows/lu-m4-verified-memory.yml'
  pull_request:
    paths:
      - 'src-tauri/lu-core/**'
      - '.github/workflows/lu-m4-verified-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-m4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
  native-m4:
    needs: frozen-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Verify no source-tree drift
        run: node scripts/verify-source-tree.mjs
      - name: Real native ANSF procedural-memory promotion and invalidation regressions
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_verified_procedures::tests -- --nocapture
      - name: M4 belief revision, supersession and independently verified source state
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_belief_revision::tests -- --nocapture
      - name: Genuine desktop ANSF journal restart and scoped source tests (no WebView mocks)
        run: cargo test --manifest-path lu-desktop/tests/native-chat/Cargo.toml m4_real_book_restart_integration -- --nocapture
      - name: Parse actual M4 physical-Windows acceptance PowerShell (not running an installation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath 'scripts/m4-windows-installed-memory-acceptance.ps1').Path,
            [ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){
            foreach($err in $errors){Write-Error $err.Message}
            exit 1
          }
      - name: Existing ANSF source revisions and checkpoint receipt regressions
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib continuity::tests -- --nocapture

  actual-local-gguf-m4:
    needs: frozen-source
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MODEL_SHA: 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Verify real original-source model acceptance code
        run: |
          node scripts/verify-source-tree.mjs
          python3 -m py_compile benchmarks/memory/m4_real_local_model.py
          cargo build --release --locked --manifest-path src-tauri/lu-core/Cargo.toml --example m4_belief_model_proof
      - name: Compile pinned local CPU llama.cpp (no mock inference)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b12143 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-cpp"
          actual="$(git -C "$RUNNER_TEMP/llama-cpp" rev-parse HEAD)"
          test "$(printf '%s' "$actual" | cut -c 1-7)" = 2bc46ba
          cmake -S "$RUNNER_TEMP/llama-cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --config Release --target llama-server --parallel 3
      - name: Download pinned real local answer GGUF and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf -o "$RUNNER_TEMP/qwen.gguf"
          printf '%s  %s\n' "$MODEL_SHA" "$RUNNER_TEMP/qwen.gguf" | sha256sum -c -
      - name: Execute real Lu ANSF claim projection, SQLite restart and Qwen GGUF responses
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/memory/m4_real_local_model.py \
            --native "$GITHUB_WORKSPACE/src-tauri/lu-core/target/release/examples/m4_belief_model_proof" \
            --engine "$RUNNER_TEMP/llama-build/bin/llama-server" \
            --model "$RUNNER_TEMP/qwen.gguf" \
            --output /tmp/lu-m4-native-real-model
      - name: Publish genuine outputs or report absent evidence
        if: always()
        shell: bash
        run: |
          if test -f /tmp/lu-m4-native-real-model/results.json; then
            python3 -m json.tool /tmp/lu-m4-native-real-model/results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed genuine local-model evidence; this gate is OPEN." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-m4-real-model-native-ansf-evidence
          path: /tmp/lu-m4-native-real-model/
          if-no-files-found: warn
          retention-days: 14
