name: Lu MEMORY-LOOP-02 Verified Outcome Native Feedback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-memory-loop02-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-feedback:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025,ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs
          mkdir -p memory-loop02-evidence
          printf 'HEAD=%s\nOS=%s\n' "$EXPECTED_SHA" "$RUNNER_OS" > memory-loop02-evidence/provenance.txt
      - name: Original ANSF source and no-replay architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test lu-desktop/tests/memory-loop02-verified-feedback.test.mjs \
            2>&1 | tee memory-loop02-evidence/node-feedback.log
          grep -Fq '# pass 11' memory-loop02-evidence/node-feedback.log
          grep -Fq '# fail 0' memory-loop02-evidence/node-feedback.log
      - name: Provision Linux system dependencies for real Tauri native tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libssl-dev patchelf
      - name: Provision Windows non-engine compilation fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'NOT_AN_ENGINE_CI_PLACEHOLDER' -NoNewline
          }
      - name: Build real React desktop prerequisites for Tauri library tests
        shell: bash
        run: |
          set -euo pipefail
          pushd lu-desktop
          npm ci --no-audit --no-fund
          npm run build
          npm run check
          popd
      - name: Build and run real local ANSF SQLite and independent effect feedback tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
            --lib agent_verified_feedback::tests -- --nocapture \
            2>&1 | tee memory-loop02-evidence/native-feedback.log
          grep -Fq 'test result: ok. 3 passed; 0 failed;' \
            memory-loop02-evidence/native-feedback.log
      - name: Exact native desktop compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
            2>&1 | tee memory-loop02-evidence/desktop-compile.log
      - name: Read-only feedback acceptance boundaries
        shell: bash
        run: |
          echo 'Lu MEMORY-LOOP-02 tests indexed original ANSF chat, native TaskStore + independently verified EffectJournal source, restart and OS custody distinctions. It does NOT pass current-source freshness, fresh tool authority, Linux delegated-cgroup/Windows Job installed acceptance, genuine loaded Qwen comprehension or NSIS physical PC install.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-memory-loop02-native-${{ matrix.os }}
          path: memory-loop02-evidence/
          retention-days: 14
          if-no-files-found: warn
