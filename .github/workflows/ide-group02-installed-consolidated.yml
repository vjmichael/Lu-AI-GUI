# Group 2 — one exact-SHA Windows NSIS / Linux Debian real installed group.
# Real active-editor dirty state status, plus exact native tab as alternate witness.
# Fail-closed three-attempt exact-origin license source transport retry.
# Native AT-SPI deep source-workspace tab traversal; no acceptance relaxation.
# Exact React conflict alert and unsaved-tab accessible names for native Linux acceptance.
# WebKitGTK: confirm exact active project via named native Edit action, not plain status paragraph.
# GTK CWD native chooser determinism and exact file-row identity at real installed gate.
# Repair exact Gtk native chooser order: parent navigation before bounded row matching.
# Group2 boundary repair: verify OS catalog identity via samefile (Windows)
# and never treat GTK unverified typeahead as directory selection (Linux).
# Reuse native OS and security gates; add independently verified user-data retention.
name: IDE Group 2 consolidated native installed editor and data preservation (NOT release)
on:
  push:
    branches: [ide/group02-installed-acceptance-20261110]
    paths:
      - '.github/workflows/ide-group02-installed-consolidated.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ide-group02-installed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-installed-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact source checkout for native installed package
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Prove scoped successor graph and hostile drift denial before native build
        run: |
          python ide/packaging/test_ide056_successor_lock.py
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform ubuntu-24.04 --ide05-successor
      - name: Check real GTK folder-selection and Group 2 read-only data witness
        run: |
          python3 ide/app/fixtures/test_gtk_chooser_confirmation_policy.py
          python3 ide/packaging/test_upstream_notice_receipt.py
          bash -n ide/app/fixtures/Test-Wo8InstalledDeb.sh
          python3 -m py_compile ide/app/fixtures/group02_user_data_preservation.py
          test -f ide/app/fixtures/group02_user_data_preservation.py
          grep -F 'IDE_G02_NATIVE_UNINSTALL_PRESERVED_CATALOG_AND_SOURCE=PASS' ide/app/fixtures/group02_user_data_preservation.py
          grep -F 'group02_catalog_prepared=1' ide/app/fixtures/Test-Wo8InstalledDeb.sh
      - name: Install native Linux Tauri and graphical acceptance prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            xvfb xauth xdotool dbus-x11 x11-utils at-spi2-core python3-pyatspi openbox
      - name: Fetch resolved Cargo sources before collecting license notices
        run: |
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
      - name: Build frontend and real native Linux Debian package
        working-directory: ide/app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          python ../packaging/verify_p06_candidate_lock.py --repo-root ../.. --platform ubuntu-24.04 --ide05-successor
          npm ci --ignore-scripts --no-audit --no-fund
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          python ../packaging/verify_p06_candidate_lock.py --repo-root ../.. --platform ubuntu-24.04 --ide05-successor
          python ../packaging/verify_tauri_minor.py --repo-root ../..
          python ../packaging/upstream_notice_receipt.py --repo-root ../.. --source-sha '${{ github.sha }}' --output src-tauri/upstream-notice-receipt.json
          python ../packaging/collect_verification_licenses.py --repo-root ../.. --output src-tauri/verification-notices --source-sha '${{ github.sha }}' --upstream-receipt src-tauri/upstream-notice-receipt.json
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.wo8.linux.conf.json --bundles deb
      - name: Verify legal bytes and bind inventory to real Debian package digest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          [[ "${#packages[@]}" -eq 1 ]] || { echo "DENIED: only one Debian package accepted"; exit 2; }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha "$SOURCE_SHA" --require-upstream --artifact "${packages[0]}" --receipt ide/app/src-tauri/verification-package-receipt.json
      - name: Attach unsigned Debian and matching resolved dependency licenses
        uses: actions/upload-artifact@v4
        with:
          name: lu-ide-p04-linux-unsigned-verification
          path: |
            ide/app/src-tauri/target/release/bundle/deb/*.deb
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Prove actual native Debian installer failure and restore previous version
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          [[ "${#packages[@]}" -eq 1 ]] || { echo 'DENIED: native dpkg test requires one exact unsigned package'; exit 2; }
          bash ide/app/fixtures/Test-P04UnsignedDebBrokenUpgrade.sh "${packages[0]}"
      - name: Real Debian installation GTK/X11 window and package removal
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          [[ "${#packages[@]}" -eq 1 ]] || { echo 'DENIED: unexpected Linux .deb count'; exit 2; }
          if ! dpkg-deb --contents "${packages[0]}" | grep -F '/THIRD_PARTY_LICENSES/inventory.json' >/dev/null; then
            echo 'DENIED: actual Debian package omitted third-party license inventory' >&2
            exit 2
          fi
          dpkg-deb --contents "${packages[0]}" | grep -F '/THIRD_PARTY_LICENSES/upstream-fetch.json' >/dev/null || { echo 'DENIED: retrieved upstream licenses missing from real Debian package' >&2; exit 2; }
          echo 'P04_NATIVE_DEBIAN_BUNDLED_LICENSE_INVENTORY=PASS'
          bash ide/app/fixtures/Test-Wo8InstalledDeb.sh "${packages[0]}" "$(git rev-parse HEAD)"
      - name: Evidence meaning
        run: |
          echo "Native Linux installed Debian GUI window and uninstall only."
          echo "Not a protected Cargo/debugger, saved editing or release acceptance."

  installed-unsigned-native-ui:
    runs-on: windows-2022
    timeout-minutes: 85
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Prove exact source checkout before installed build
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ine '${{ github.sha }}') {
            throw 'DENIED: installed Windows source checkout is not exact pull-request head'
          }
      - name: Prove scoped successor graph and hostile drift denial before native build
        shell: pwsh
        run: |
          python ide/packaging/test_ide056_successor_lock.py
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: successor lock hostile tests failed' }
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform windows-2022 --ide05-successor
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: successor lock review not proven' }
      - name: Parse bounded Windows post-navigation accessibility recovery before package build
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1').Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw "DENIED: invalid native UIA recovery fixture: $($errors[0])" }
          python -m py_compile ide/app/fixtures/group02_user_data_preservation.py
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: Group 2 user-data witness invalid Python' }
          python ide/packaging/test_upstream_notice_receipt.py
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: exact-origin upstream notice retry contract failed' }
      - name: Validate frontend and Rust host contract
        working-directory: ide/app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Fetch resolved Cargo sources and embed third-party license notices
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform windows-2022 --ide05-successor
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: installer resolved lock graph differs from reviewed OS evidence' }
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: npm locked install failed' }
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: Cargo locked resolution failed' }
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform windows-2022 --ide05-successor
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: locked reinstall changed OS dependency graph' }
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: cannot resolve native dependency license sources' }
          python ide/packaging/verify_tauri_minor.py --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: resolved Tauri minor mismatch' }
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha $env:SOURCE_SHA --output ide/app/src-tauri/upstream-notice-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: upstream licenses not retrieved from exact origins' }
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha $env:SOURCE_SHA --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: third-party verification licenses not generated' }
          Write-Host 'P04_UNSIGNED_INSTALLER_LICENSES=ACTUAL_RESOLVED_NOTICES_BUNDLED_NO_RELEASE_APPROVAL'
      - name: Build real default-disabled unsigned Windows NSIS
        working-directory: ide/app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.installed-smoke.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: real installed E2E NSIS build failed' }
      - name: Verify all collected legal bytes against exact unsigned NSIS hash
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $setup=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'DENIED: exact verified NSIS candidate required' }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha $env:SOURCE_SHA --require-upstream --artifact $setup[0].FullName --receipt ide/app/src-tauri/verification-package-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: packaged Windows licenses do not match source and installer hash' }
      - name: Attach unsigned Windows NSIS and matching resolved license bundle
        uses: actions/upload-artifact@v4
        with:
          name: lu-ide-p04-windows-unsigned-verification
          path: |
            ide/app/src-tauri/target/release/bundle/nsis/*setup.exe
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Parse real Windows UI acceptance fixture without executing it
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1').Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw "DENIED: native acceptance fixture has invalid PowerShell: $($errors[0])" }
      - name: Install and interact with actual native WebView and OS picker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $setup=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'DENIED: exactly one native NSIS required' }
          $root=Join-Path $env:RUNNER_TEMP ('lu-ide-wo8-ui-'+$env:GITHUB_RUN_ID)
          $exe=Join-Path $root 'lu-ide-desktop.exe'
          $installed=$false
          $uninstalled=$false
          $uninstaller=$null
          if ((Test-Path -LiteralPath $root) -or (Get-Service LuIdeRecoveryBroker -ErrorAction SilentlyContinue)) {
            throw 'DENIED: native disposable runner already has Lu IDE/service'
          }
          try {
            $setupProcess=Start-Process -FilePath $setup[0].FullName -ArgumentList @('/S',('/D='+$root)) -PassThru -Wait
            if ($setupProcess.ExitCode -ne 0) { throw 'DENIED: native unsigned NSIS install failed' }
            $installed=$true
            if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'DENIED: installed desktop missing' }
            $noticeFile=Join-Path $root 'THIRD_PARTY_LICENSES\inventory.json'
            if (!(Test-Path -LiteralPath $noticeFile -PathType Leaf)) {
              throw 'DENIED: installed NSIS verification package omitted third-party license evidence'
            }
            if (!(Test-Path -LiteralPath (Join-Path $root 'THIRD_PARTY_LICENSES\upstream-fetch.json') -PathType Leaf)) {
              throw 'DENIED: installed NSIS omitted retrieved original upstream license evidence'
            }
            $notice=Get-Content -LiteralPath $noticeFile -Raw | ConvertFrom-Json
            if ($notice.sourceSha -ine '${{ github.sha }}' -or
                $notice.releaseApproved -ne $false) {
              throw 'DENIED: installed license source or release status mismatch'
            }
            Write-Host 'P04_NATIVE_WINDOWS_BUNDLED_LICENSE_INVENTORY=PASS'
            $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario Shell
            if (!$?) { throw 'DENIED: OS UI Automation native shell failed' }
            $fixture=Join-Path $env:RUNNER_TEMP ('lu-ide-wo8-fixture-'+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Path $fixture | Out-Null
            [IO.File]::WriteAllText((Join-Path $fixture 'main.rs'),"fn main() { println!(`"wo8`"); }`n")
            $sourcePath=Join-Path $fixture 'main.rs'
            $originalSourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario EditorPersistence -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: native UI editor review/save failed' }
            $newSourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
            if ($newSourceHash -eq $originalSourceHash) { throw 'DENIED: explicit save did not change fixture source' }
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario Dev035JobsReadOnly -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: real installed Windows Jobs discovery/lifecycle UX failed' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash -ne $newSourceHash) {
              throw 'DENIED: installed Jobs inspection modified source'
            }
            # DEV-04.5 negative installed acceptance: real disabled OS UIA
            # project-debug control, zero spawned workers or SCM admission.
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario Dev045ProjectDebuggerDenied -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: default unsigned NSIS exposed project debugger execution' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash -ne $newSourceHash) {
              throw 'DENIED: installed project debugger denial mutated source'
            }
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario PersistedRestart -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: native project restart/persistence failed' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash -ne $newSourceHash) {
              throw 'DENIED: reopened fixture source unexpectedly mutated'
            }
            & 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1' -InstalledExecutable $exe -ExpectedSha256 $sha -Scenario ExternalConflict -FixtureRoot $fixture
            if (!$?) { throw 'DENIED: real external-source collision did not preserve disk edits and local draft' }
            $currentSource=[IO.File]::ReadAllText($sourcePath)
            if (!$currentSource.Contains('WO8_CONFLICT_EXTERNAL_UPDATE') -or
                $currentSource.Contains('WO8_UNSAVED_LOCAL_DRAFT')) {
              throw 'DENIED: external conflict incorrectly saved IDE draft or lost external edit'
            }
            # Verify the native catalog was actually written for exactly this
            # disposable project. Keep read-only hashes until native uninstall.
            python ide/app/fixtures/group02_user_data_preservation.py before $fixture
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: real Windows project catalog/fixture identity not verified' }
            $uninstallers=@(Get-ChildItem $root -Filter '*uninstall*.exe' -File)
            if ($uninstallers.Count -ne 1) { throw 'DENIED: installed uninstaller missing' }
            $uninstaller=$uninstallers[0].FullName
            $removal=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
            if ($removal.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'DENIED: uninstall did not remove installed IDE' }
            $uninstalled=$true
            python ide/app/fixtures/group02_user_data_preservation.py after $fixture
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: Windows uninstall lost native catalog or changed project source' }
            Write-Host 'WO8_NATIVE_INSTALLED_UI_AND_PROJECT=PASS'
            Write-Host 'IDE_G02_WINDOWS_NATIVE_UNINSTALL_USER_DATA_PRESERVED=PASS'
            Write-Host 'WO8_NATIVE_PROTECTED_FEATURES=NOT_ACCEPTED'
          } finally {
            if ($installed -and !$uninstalled) {
              Write-Warning 'WO8 native installed test incomplete; cleanup attempted and acceptance not granted'
              if ($uninstaller -and (Test-Path $uninstaller)) {
                try { Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait | Out-Null } catch {}
              }
            }
          }
      - name: Bound result meaning
        shell: pwsh
        run: |
          Write-Host 'Only real unsigned installed desktop/UI/folder and source read accepted.'
          Write-Host 'No signed release, protected tool execution or cross-crash recovery claim.'
