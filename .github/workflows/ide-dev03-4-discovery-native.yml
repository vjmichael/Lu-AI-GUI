name: IDE DEV03.4 bounded test discovery
on:
  push:
    branches: [ide/dev03-4-bounded-test-discovery-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev03-4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed-test-discovery:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Linux Tauri build headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev
      - name: Exact source discovery and UI validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test ide/app/tests/conventional_tests.test.mjs
      - name: Native real registered-project regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/host/Cargo.toml --test conventional_tests --locked
          cargo check --manifest-path ide/app/src-tauri/Cargo.toml --all-targets --locked
      - name: State the separate acceptance gates
        run: echo "Read-only discovery does not establish real protected test execution or installed GUI acceptance"
