          export LU_IDE_D3_LINUX_SYMBOLIZER_SHA256="$(sha256sum /usr/lib/llvm-18/bin/llvm-symbolizer | cut -d' ' -f1)"
          test "${#LU_IDE_D3_LINUX_SYMBOLIZER_SHA256}" = 64
          cargo build --manifest-path ide/sandbox/Cargo.toml --bin linux_cgroup_prepare --bin linux_delegated_ci_wo6_build_host
          cargo build --manifest-path ide/supervisor/Cargo.toml --features 'linux-worker,dap-transport,dev045d3-ci-oracle' --example wo6_linux_native_build_acceptance
      - name: Real isolated Cargo check, test and cancellation with kernel receipts
        shell: bash
        run: |
          set -euo pipefail
          host="$(realpath ide/sandbox/target/debug/linux_delegated_ci_wo6_build_host)"
          for mode in --check --test --build --project-debug --project-debug-cancel --cancel; do
            rc=0
            sudo /usr/bin/systemd-run --wait --collect --pipe \
              --unit=lu-ide-delegated \
              --property=Type=exec \
              --property=User=runner \
              --property=Group=runner \
              --property='Delegate=cpu memory pids' \
              --property=DelegateSubgroup=lu-ide-host \
              "$host" "$mode" || rc=$?
            if [[ "$rc" -ne 0 ]]; then
              echo 'DENIED: actual delegated Linux Cargo OS evidence failed'
              sudo systemctl show lu-ide-delegated.service --no-pager --property=Result,ExecMainStatus,Delegate,DelegateSubgroup || true
              sudo journalctl -u lu-ide-delegated.service --no-pager -n 40 --output=cat || true
              exit "$rc"
            fi
            echo "PASS: genuine delegated Linux Cargo $mode, journal restart"
          done
      - name: Scope
        run: echo "Native OS check/test/cancel fixture only; installed desktop and release toolchain acceptance remain independent."

# This workflow provides real isolated kernel acceptance only.
# Native GUI human dialogs, signed artifact provenance, and installed
# action/restart acceptance remain independently REQUIRED and OPEN.

  # Group 4C genuine first-party LLVM DebuggerThread owner / one-use step,
  # distinct from the basic DAP/SCM and Linux protected jobs above. A compiled
  # disposable CI worker does not count as physical installed human consent.
  windows-pinned-llvm18-native:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Require exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Compile protected host owner-event records and test negative cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $features='dap-transport,protected-recovery-service,dev045d5-ci-event-owner'
          cargo test --manifest-path ide/supervisor/Cargo.toml --features $features --lib windows_event_owner
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: owner-event parser/nonce/replay tests failed' }
          cargo check --manifest-path ide/supervisor/Cargo.toml --features $features --example wo6_native_dap_acceptance
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: real Windows host owner-event compile failed' }
          cargo check --release --manifest-path ide/supervisor/Cargo.toml --features 'dap-transport,protected-recovery-service'
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: Windows regular release compile regressed' }
      - name: Compile real source-pinned LLVM18 DebuggerThread and produce hashed owner binary
        shell: pwsh
        run: |
          & ide/llvm18_owner/Build-PinnedOwnerWindows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: modified LLVM18 LLDB Windows build failed' }
      - name: Stage exact reviewed offline Windows SDK and MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./ide/supervisor/fixtures/New-PinnedWindowsToolchain.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'dev045d5-offline-msvc') -LockPath (Join-Path $env:RUNNER_TEMP 'dev045d5-msvc-lock.json') -RustVersion '1.99.1' -SdkVersion '10.0.26100.0' -VsVersionPrefix '17.14.' -MsvcVersionPrefix '14.44.'
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: independent offline Cargo/SDK bundle failed' }
      - name: Real SCM/AppContainer owner stop, PE/PDB, cancellation and journal restart
        shell: pwsh
        run: |
          & ide/llvm18_owner/Test-PinnedOwnerWindows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native protected stop/owner/journal acceptance failed' }
      - name: Preserve binary source and offline compiler lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev045d5-windows-native-locks
          path: |
            ${{ runner.temp }}/lu-owner-llvm18-lock.json
            ${{ runner.temp }}/dev045d5-msvc-lock.json
          if-no-files-found: ignore
      - name: No installed or release acceptance inferred
        if: always()
        shell: bash
        run: |
          echo 'DEV045D5_SIGNED_RELEASE=NOT_ACCEPTED'
          echo 'DEV045D5_OS_COMPILATION=REQUIRES_EXACT_HEAD_JOB_LOGS'
