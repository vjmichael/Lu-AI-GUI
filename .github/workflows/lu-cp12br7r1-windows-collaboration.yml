name: Lu CP-12B-R7-R1 Windows collaboration — exact-source qualification

# CP-10: only the exact source-locked, self-path and commit-message candidate.
# No broad push trigger, manual installed pass or automatic model download.
on:
  workflow_dispatch:
    inputs:
      include_desktop_source_check:
        description: 'Also compile the Windows desktop source (not an installed GUI acceptance)'
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: lu-cp12br7r1-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows-native-protocol:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify immutable workflow source and user-facing consent boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Checkout SHA differs from workflow SHA' }
          node scripts/verify-source-tree.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source lock mismatch' }
          node --test lu-desktop/tests/cp12b-local-diagnostic-exchange.test.mjs lu-desktop/tests/cp12br7-windows-stage-eval.test.mjs lu-desktop/tests/cp12br7r1-physical-acceptance-contract.test.mjs lu-desktop/tests/cp12br7r1-gh-ci-contract.test.mjs lu-desktop/tests/cp07-08-ux-r1-basic-copy.test.mjs lu-desktop/tests/cp07-08-ux-r2-no-modes.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'UI/protocol authority contract failed' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/cp12br7r1-windows-installed-acceptance.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Installed acceptance runner contains PowerShell syntax errors' }
      - name: Real Windows kernel named-pipe and stage protocol v1/v2/v3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --manifest-path scripts/cp12br2-windows-transport-check/Cargo.toml --features windows_dx_eval -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows native collaboration test failed' }
      - name: Windows default-off regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --manifest-path scripts/cp12br2-windows-transport-check/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Default-off Windows transport regression failed' }
      - name: State exact qualification boundary
        shell: pwsh
        run: |
          "Verified Git checkout: $env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'Native Windows transport and consent contracts only: no installed GUI, independent GGUF inference, separate-account account creation or physical-PC acceptance was executed.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
  windows-desktop-source-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_desktop_source_check }}
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact source and compile frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          node scripts/verify-source-tree.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source lock mismatch' }
          Push-Location lu-desktop
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Locked npm dependency restoration failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Frontend verification failed' }
          } finally { Pop-Location }
      - name: Type-check feature-enabled Windows desktop without misrepresenting an installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = 'lu-desktop/src-tauri/tauri.conf.json'
          $original = [IO.File]::ReadAllBytes((Resolve-Path $config).Path)
          try {
            # These exact native inference resources are NOT bundled into CI.
            # Resource override is for compilation only; do not publish a binary from it.
            $value = Get-Content -Raw -LiteralPath $config | ConvertFrom-Json
            $value.bundle.resources = @{}
            $value | ConvertTo-Json -Depth 40 | Set-Content -LiteralPath $config -Encoding utf8
            cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --features windows_dx_eval --jobs 2
            if ($LASTEXITCODE -ne 0) { throw 'Windows native desktop source check failed' }
          } finally {
            [IO.File]::WriteAllBytes((Resolve-Path $config).Path, $original)
          }
          node scripts/verify-source-tree.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Exact source was not restored' }
          'Windows desktop source type-check only; no packaged native resources or installed two-model GUI acceptance.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append


  # CP-10-R4-R2: reuse previously PASS original R4-R1 native test jobs
  # under the already-reviewed C12 exact branch/path/message admission.
  # Existing Windows transport/default-off and UI compile jobs above remain.
  # No generic new workflow trigger, automatic tool grant or release claim.
  r4-r2-source-lock:
    # Inherit the ORIGINAL exact-message gate and Windows evidence; never
    # manufacture a third relaxed admission for the extended test group.
    needs: [windows-native-protocol, windows-desktop-source-check]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/lu/cp10-consolidated-ux-20261120' && needs.windows-native-protocol.result == 'success' && needs.windows-desktop-source-check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact immutable source and only the one-shot acceptance trigger
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs
          node --test lu-desktop/tests/p03-ai-ops.test.mjs lu-desktop/tests/perf01-p4-interactive-priority.test.mjs
          echo "CP-10-R4-R2_SOURCE=$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Source-only regression checks do not certify runtime or installed behavior." >> "$GITHUB_STEP_SUMMARY"

  r4-r2-frontend-ui:
    needs: r4-r2-source-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Compile actual production scanner harness used by UI tests
        shell: bash
        run: cargo build --locked --manifest-path lu-desktop/tests/native-file-scan/Cargo.toml
      - name: Genuine frontend source compile, UI contracts, and full UI regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd lu-desktop
          npm ci --no-audit --no-fund
          npm run build
          npm run check
          npm run test:ui
      - name: Ensure source inventory survived test execution
        shell: bash
        run: node scripts/verify-source-tree.mjs

  r4-r2-native-core:
    needs: r4-r2-source-lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Real native scheduler guardian, foreground, custody and refusal tests
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_background_scheduler -- --nocapture
      - name: Real native P03 user-request-bound tool recommendation tests
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ai_operations -- --nocapture
      - name: Native workspace protected read turn and traversal refusal
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_workspace_read_turn -- --nocapture
      - name: Native workspace quarantine and changed-root safety
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test workspace_quarantine -- --nocapture
      - name: Re-verify source on each independent native OS
        run: node scripts/verify-source-tree.mjs

  r4-r2-desktop-windows:
    needs: r4-r2-source-lock
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build actual React UI for native desktop compilation
        shell: pwsh
        working-directory: lu-desktop
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'React compilation failed'}
          npm run check
          if($LASTEXITCODE -ne 0){throw 'React contracts failed'}
      - name: Disable ONLY packaging of absent development engines for test compilation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/verify-source-tree.mjs
          if($LASTEXITCODE -ne 0){throw 'Preflight source mismatch'}
          $p='lu-desktop/src-tauri/tauri.conf.json'
          $cfg=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          $cfg.bundle.resources=@{}
          $cfg | ConvertTo-Json -Depth 50 | Set-Content -LiteralPath $p -Encoding utf8
          Write-Host 'COMPILER_ONLY_NOT_INSTALLED_NOT_GGUF_NOT_NSIS'
      - name: Real Windows native foreground/background queue scheduling tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib generation_queue::tests -- --nocapture
          if($LASTEXITCODE -ne 0){throw 'Native generation queue tests failed'}
      - name: Windows current-turn classifier tests (no model grant)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib turn_coordinator::tests -- --nocapture
          if($LASTEXITCODE -ne 0){throw 'Desktop turn coordinator tests failed'}
