name: Lu E1-P06A Typed Third-Party Adapter Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-e1-p06-adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
  real-native-preflight:
    needs: frozen-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Check and run real host executable, current-turn and digest preflight tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e1-p06-native-evidence
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_app_adapter::tests -- --nocapture 2>&1 | tee e1-p06-native-evidence/p06-preflight.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_app_admission::tests -- --nocapture 2>&1 | tee e1-p06-native-evidence/p01-admission.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_app_catalog::tests -- --nocapture 2>&1 | tee e1-p06-native-evidence/p02-catalog.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-e1-p06-typed-preflight-${{ matrix.os }}
          path: e1-p06-native-evidence/
          retention-days: 14
          if-no-files-found: warn
