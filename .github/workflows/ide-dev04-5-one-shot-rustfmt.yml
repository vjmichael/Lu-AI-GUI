# Temporary DEV-04.5 branch-only formatter; delete after inspecting output.
name: IDE DEV04.5 one-shot native formatting repair
on:
  push:
    branches: [ide/dev04-5-installed-debugger-repair-20261108]
    paths:
      - 'ide/supervisor/**'
      - 'ide/sandbox/**'
      - '.github/workflows/ide-dev04-5-one-shot-rustfmt.yml'
permissions:
  contents: write
concurrency:
  group: dev045-format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only-rustfmt:
    if: github.ref == 'refs/heads/ide/dev04-5-installed-debugger-repair-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Format reviewed native sources without changing execution policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          cargo fmt --manifest-path ide/sandbox/Cargo.toml --all
          cargo fmt --manifest-path ide/supervisor/Cargo.toml --all
          git diff --name-only > "$RUNNER_TEMP/changed-files"
          if ! test -s "$RUNNER_TEMP/changed-files"; then
            echo 'DEV045_RUSTFMT=already_clean'
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              ide/sandbox/*.rs|ide/sandbox/**/*.rs|ide/supervisor/*.rs|ide/supervisor/**/*.rs) ;;
              *) echo "DENIED: formatter touched non-native file: $file"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          git add -- ide/sandbox ide/supervisor
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(ide): exact-head Rust formatting repair [rustfmt]'
          git push origin HEAD:refs/heads/ide/dev04-5-installed-debugger-repair-20261108
      - name: Verify exact formatting after mechanical commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ide/sandbox/Cargo.toml --all -- --check
          cargo fmt --manifest-path ide/supervisor/Cargo.toml --all -- --check
          echo 'DEV045_RUSTFMT=source_only_checked_not_native_execution'
