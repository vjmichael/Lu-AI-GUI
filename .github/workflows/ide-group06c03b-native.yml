name: IDE Group 6C03B isolated divergent verification
on:
  push:
    branches: [ide/group06c03b-divergent-merge-20261111]
    paths:
      - '.github/workflows/ide-group06c03b-native.yml'
      - 'ide/host/src/git_divergent_verify.rs'
      - 'ide/app/tests/g06c03b_protected_divergent.test.mjs'
      - 'ide/host/src/git_protected_divergent_merge.rs'
      - 'ide/host/src/lib.rs'
      - 'ide/app/src-tauri/src/lib.rs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ide-g06c03b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Linux desktop build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev
      - name: Native conflict/sandbox fixtures and compilation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo test --manifest-path ide/host/Cargo.toml --lib git_divergent_verify -- --nocapture
          cargo test --manifest-path ide/host/Cargo.toml --lib git_protected_divergent_merge -- --nocapture
          cargo check --locked --manifest-path ide/host/Cargo.toml --all-targets
          rustfmt --edition 2021 --check ide/host/src/git_divergent_verify.rs ide/host/src/git_protected_divergent_merge.rs
      - name: Hostile divergent authorization source checks and WebView build
        shell: bash
        run: |
          set -euo pipefail
          cd ide/app
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/g06c03b_protected_divergent.test.mjs
          npm run build
      - name: Tauri exact-head route compiler check
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ] && [ ! -f ide/app/src-tauri/icons/icon.ico ]; then
            python ide/app/fixtures/make_g04d_ci_icon.py
          fi
          cargo check --locked --manifest-path ide/app/src-tauri/Cargo.toml --all-targets
      - name: Explicit acceptance limits
        if: always()
        shell: bash
        run: |
          printf 'head=%s\nos=%s\ndivergent_publication=SOURCE_IMPLEMENTED_NOT_NATIVE_ACCEPTED\nhuman_consent=DEFERRED\nrelease=NOT_AUTHORIZED\n' "$GITHUB_SHA" "$RUNNER_OS"

  # Automated INSTALLED-package smoke only. No OS dialog is auto-approved.
  # Physical user-operated one-use consent remains DEFERRED (issue #212).
  installed-g06c03b-debian-smoke:
    name: G06C03B exact-head Debian install, process restart, uninstall (not physical consent)
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact selected source and native graphical dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf libssl-dev xvfb xauth xdotool dbus-x11 openbox
      - name: Resolve source licenses and build actual unsigned Debian package
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha "$GITHUB_SHA" --output ide/app/src-tauri/upstream-notice-receipt.json
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha "$GITHUB_SHA" --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          cd ide/app
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.g06b05.linux.conf.json --bundles deb
      - name: Verify license payload and exercise real Debian installation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          [[ "${#packages[@]}" -eq 1 ]] || { echo G06C03B_DEB_DENIED:package_count >&2; exit 2; }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha "$GITHUB_SHA" --require-upstream --artifact "${packages[0]}" --receipt ide/app/src-tauri/verification-package-receipt.json
          bash ide/app/fixtures/Test-G06B05InstalledDebSmoke.sh "${packages[0]}" "$GITHUB_SHA"
          sha256sum "${packages[0]}"
          echo G06C03B_LINUX_INSTALLED_SMOKE=NOT_HUMAN_CONSENT
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ide-g06c03b-deb-${{ github.sha }}
          path: |
            ide/app/src-tauri/target/release/bundle/deb/*.deb
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7

  installed-g06c03b-windows-smoke:
    name: G06C03B exact-head NSIS install, process restart, uninstall (not physical consent)
    runs-on: windows-2022
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build exact source and independently bound Windows license inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha "$GITHUB_SHA" --output ide/app/src-tauri/upstream-notice-receipt.json
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha "$GITHUB_SHA" --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          if [ ! -f ide/app/src-tauri/icons/icon.ico ]; then python ide/app/fixtures/make_g04d_ci_icon.py; fi
          cd ide/app
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.g06b05.windows.conf.json --bundles nsis
      - name: Verify installer, install and restart real NSIS application, independent Git integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'G06C03B_NSIS_DENIED:installer_count' }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha $env:GITHUB_SHA --require-upstream --artifact $setup[0].FullName --receipt ide/app/src-tauri/verification-package-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'G06C03B_NSIS_DENIED:unverified_licenses' }
          $fixture=Join-Path $env:RUNNER_TEMP 'g06c03b-disposable-git'
          $manifest=Join-Path $env:RUNNER_TEMP 'g06c03b-git-before.json'
          python ide/app/fixtures/g06b05_git_oracle.py fixture --directory $fixture --mode create
          if ($LASTEXITCODE -ne 0) { throw 'G06C03B_NSIS_DENIED:fixture' }
          python ide/app/fixtures/g06b05_git_oracle.py snapshot --repo $fixture --manifest $manifest --mode create --expect-index initial
          if ($LASTEXITCODE -ne 0) { throw 'G06C03B_NSIS_DENIED:independent_snapshot' }
          & ide/app/fixtures/Test-InstalledAlphaNsis.ps1 -InstallerPath $setup[0].FullName -InstallRoot (Join-Path $env:RUNNER_TEMP 'g06c03b-nsis-test-install')
          python ide/app/fixtures/g06b05_git_oracle.py check --manifest $manifest --outcome unchanged
          if ($LASTEXITCODE -ne 0) { throw 'G06C03B_NSIS_DENIED:unrelated_git_modified' }
          Write-Host 'G06C03B_WINDOWS_INSTALLED_SMOKE=NOT_HUMAN_CONSENT'
          Write-Host ('G06C03B_NSIS_SHA256='+(Get-FileHash -Algorithm SHA256 $setup[0].FullName).Hash)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ide-g06c03b-nsis-${{ github.sha }}
          path: |
            ide/app/src-tauri/target/release/bundle/nsis/*setup.exe
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7
