name: Lu E1-P04 Independent Output Oracle
on:
  push:
    branches: ['lu/e1-p04-independent-outcome-oracles-20261107']
    paths:
      - 'src-tauri/lu-core/src/native_app_output_oracle.rs'
      - 'src-tauri/lu-core/src/native_app_execution.rs'
      - 'src-tauri/lu-core/src/lib.rs'
      - '.github/workflows/lu-e1-p04-output-oracle.yml'
      - 'source-tree.lock.json'
  pull_request:
    paths:
      - 'src-tauri/lu-core/src/native_app_output_oracle.rs'
      - 'src-tauri/lu-core/src/native_app_execution.rs'
      - 'src-tauri/lu-core/src/lib.rs'
      - '.github/workflows/lu-e1-p04-output-oracle.yml'
      - 'source-tree.lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-e1-p04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual source-blob identity
        run: node scripts/verify-source-tree.mjs
  native-oracle:
    needs: source-integrity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Actual independent file-handle semantic oracle and SQLite tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e1-p04-native-evidence
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib native_app_output_oracle::tests -- --nocapture 2>&1 \
            | tee e1-p04-native-evidence/output-oracle-native.log
      - name: Verify audited artifact content/container parser remains independent
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib native_artifact_inspect::tests -- --nocapture 2>&1 \
            | tee e1-p04-native-evidence/structure-reader-native.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib native_app_execution::tests -- --nocapture 2>&1 \
            | tee e1-p04-native-evidence/process-contract-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-e1-p04-independent-oracle-${{ matrix.os }}
          path: e1-p04-native-evidence/
          retention-days: 14
          if-no-files-found: warn
