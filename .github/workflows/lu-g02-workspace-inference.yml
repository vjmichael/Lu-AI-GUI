name: G02 generic Lu Workspace inference native gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-workspace-authority:
    name: G02 workspace inference / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify source revision
        shell: bash
        run: git rev-parse HEAD
      - name: Compile and execute exact Lu Core host admission tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/lu-core/Cargo.toml --locked --lib workspace_inference::tests -- --nocapture
          cargo test --manifest-path src-tauri/lu-core/Cargo.toml --locked --lib workspace::tests -- --nocapture
      - name: Scope notice
        shell: bash
        run: |
          echo "These prove generic Lu native Workspace ownership tests only."
          echo "External Film Workspace mount, actual shared GGUF and physical Radeon still unaccepted."
