name: IDE WO7 actual signed NSIS installed SCM smoke (not protected debugger acceptance)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed exact Lu IDE source commit SHA
        required: true
        type: string
      candidate_run_id:
        description: Run containing signed lu-ide-wo7-candidate artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  signed-windows-installed-scm:
    runs-on: windows-2022
    timeout-minutes: 90
    environment: lu-ide-release-witness
    steps:
      - name: Verify candidate locator syntax before any artifact fetch
        shell: pwsh
        env:
          EXACT_SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:EXACT_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$' -or
              $env:CANDIDATE_RUN_ID -notmatch '^[0-9]{1,20}$') {
            throw 'DENIED: exact SHA or numeric artifact run ID required'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: lu-ide-wo7-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify actual signed candidate identity under native Windows
        shell: pwsh
        env:
          EXACT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $native=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $native -ne $env:EXACT_SOURCE_SHA) { throw 'DENIED: checkout SHA mismatch' }
          python ide/packaging/verify_wo7_candidate.py --manifest candidate/wo7-release.manifest.json --artifact-root candidate --source-sha $env:EXACT_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: signed candidate preflight failed' }
      - name: Real installed NSIS LocalService and uninstall acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content candidate/wo7-release.manifest.json -Raw | ConvertFrom-Json
          $dir=(Resolve-Path candidate).Path
          & 'ide/app/fixtures/Test-Wo7SignedInstalledNsis.ps1' `
            -InstallerPath (Join-Path $dir $manifest.installer.path) `
            -InstallerSha256 $manifest.installer.sha256 `
            -SignerThumbprint $manifest.installer.signerThumbprint `
            -ServiceSha256 $manifest.service.sha256 `
            -ServiceSignerThumbprint $manifest.service.signerThumbprint `
            -DesktopSha256 $manifest.desktop.sha256 `
            -DesktopSignerThumbprint $manifest.desktop.signerThumbprint `
            -InstallRoot (Join-Path $env:ProgramFiles 'Lu IDE')
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native installed signed NSIS smoke failed' }
      - name: Clearly limit the acceptance claim
        shell: pwsh
        run: |
          Write-Host 'SIGNED_WINDOWS_NSIS_INSTALLED_SCM_SMOKE=OBSERVED'
          Write-Host 'INSTALLED_PROTECTED_RUN_TEST_DEBUG=NOT_TESTED'
          Write-Host 'RELEASE_ACCEPTANCE=NOT_GRANTED'
