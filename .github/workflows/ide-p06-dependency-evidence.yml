name: IDE P06 exact-head dependency graph and upstream license provenance (NOT RELEASE)
on:
  pull_request:
    paths:
      - 'ide/packaging/verify_p06_*'
      - 'ide/packaging/test_verify_p06_*'
      - 'ide/packaging/p06-native-acceptance-matrix.json'
      - 'ide/packaging/p06_license_triage.py'
      - 'ide/packaging/p06-known-license-risk.json'
      - 'ide/packaging/upstream-crate-notices/**'
      - 'ide/packaging/test_p06_license_triage.py'
      - 'ide/packaging/p06_target_license_scope.py'
      - 'ide/packaging/test_p06_target_license_scope.py'
      - 'ide/packaging/test_p06_source_notice_recovery.py'
      - 'ide/packaging/test_p06_r_efi_authors.py'
      - 'ide/packaging/test_p06_exact_upstream_notice_fallback.py'
      - 'ide/packaging/upstream-crate-notices/**'
      - 'ide/packaging/test_p06_license_provenance.py'
      - 'ide/host/LICENSE'
      - 'ide/app/src-tauri/LICENSE'
      - 'ide/packaging/p06-reviewed-lock-graphs.json'
      - 'ide/packaging/upstream-licenses/**'
      - 'ide/packaging/upstream_notice_receipt.py'
      - 'ide/packaging/test_upstream_notice_receipt.py'
      - 'ide/packaging/test_verify_p04_license_bundle.py'
      - 'ide/packaging/collect_verification_licenses.py'
      - 'ide/packaging/verify_p04_license_bundle.py'
      - 'ide/app/package-lock.json'
      - 'ide/app/src-tauri/Cargo.lock'
      - '.gitattributes'
      - 'ide/packaging/verify_p06_candidate_lock.py'
      - 'ide/packaging/test_p06_candidate_lock.py'
      - 'ide/docs/IDE_P06_GOVERNANCE_REPRODUCIBILITY_20261107.md'
      - '.github/workflows/ide-p06-dependency-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  resolved-dependency-and-notice-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Require exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify review-attested locks are immutable blobs at the exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ide/app/src-tauri/Cargo.lock)" = "87d0045a4be1c78651f080300aba71c14dbe1f30"
          test "$(git rev-parse HEAD:ide/app/package-lock.json)" = "dfe4412bfacfc22ad1149f5213f4a26aa49b4067"
          test "$(git hash-object ide/app/src-tauri/Cargo.lock)" = "$(git rev-parse HEAD:ide/app/src-tauri/Cargo.lock)"
          test "$(git hash-object ide/app/package-lock.json)" = "$(git rev-parse HEAD:ide/app/package-lock.json)"
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform ${{ matrix.os }}
      - name: Reject forged native approval
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ide/packaging -p 'test_verify_p06_acceptance_matrix.py' -v
          python ide/packaging/verify_p06_acceptance_matrix.py --matrix ide/packaging/p06-native-acceptance-matrix.json
      - name: Restore exact committed npm graph without untrusted project scripts
        working-directory: ide/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -f package-lock.json
      - name: Fetch exact committed Cargo graph without resolution drift
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          test -f ide/app/src-tauri/Cargo.lock
      - name: Reject resolved Tauri drift and run hostile graph tests
        shell: bash
        run: |
          set -euo pipefail
          python ide/packaging/verify_tauri_minor.py --repo-root .
          python -m unittest discover -s ide/packaging -p 'test_verify_p06_dependency_graph.py' -v
      - name: Verify native working-copy original license bytes are exact upstream Git blobs
        shell: bash
        run: |
          set -euo pipefail
          for rev in 5.3.0 6.0.0; do
            p="ide/packaging/upstream-crate-notices/r-efi-${rev}-AUTHORS.txt"
            test "$(git hash-object --no-filters "$p")" = "$(git rev-parse "HEAD:$p")"
            test "$(git hash-object "$p")" = "$(git rev-parse "HEAD:$p")"
          done
          python -m unittest discover -s ide/packaging -p 'test_p06_exact_upstream_notice_fallback.py' -v
          original="ide/packaging/upstream-crate-notices/objc2-family-LICENSE.md"
          test "$(git hash-object --no-filters "$original")" = "$(git rev-parse "HEAD:$original")"
          python -m unittest discover -s ide/packaging -p 'test_p06_exact_upstream_notice_fallback.py' -v
          python -m unittest discover -s ide/packaging -p 'test_p06_r_efi_authors.py' -v
      - name: Check exact core upstream notice bytes after native Git checkout
        shell: bash
        run: |
          set -euo pipefail
          for notice in ide/packaging/upstream-licenses/*.txt; do
            test -f "$notice"
            test "$(git hash-object --no-filters "$notice")" = "$(git rev-parse "HEAD:$notice")"
            test "$(git check-attr eol -- "$notice" | sed 's/.*: eol: //')" = lf
          done
          python -m unittest discover -s ide/packaging -p 'test_upstream_notice_receipt.py' -v
          python -m unittest discover -s ide/packaging -p 'test_verify_p04_license_bundle.py' -v
          echo 'P06_CORE_UPSTREAM_NOTICES_NATIVE_CHECKOUT_BYTE_EXACT=PASS'
      - name: Fetch original six pinned upstream licenses and resolved npm/Cargo texts
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha "$EXACT_SHA" --output ide/app/src-tauri/p06-upstream-receipt.json
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/p06-notices --source-sha "$EXACT_SHA" --upstream-receipt ide/app/src-tauri/p06-upstream-receipt.json
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/p06-notices --source-sha "$EXACT_SHA" --require-upstream
      - name: Hash resolved npm/Cargo graphs and license source evidence
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python ide/packaging/verify_p06_dependency_graph.py --repo-root . --source-sha "$EXACT_SHA" --license-root ide/app/src-tauri/p06-notices --output ide/app/src-tauri/p06-dependency-evidence.json
          python -m unittest discover -s ide/packaging -p 'test_p06_r_efi_authors.py' -v
          python -m unittest discover -s ide/packaging -p 'test_p06_source_notice_recovery.py' -v
          python -m unittest discover -s ide/packaging -p 'test_p06_license_provenance.py' -v
          python -m unittest discover -s ide/packaging -p 'test_p06_license_triage.py' -v
          python ide/packaging/p06_license_triage.py --inventory ide/app/src-tauri/p06-notices/inventory.json --output ide/app/src-tauri/p06-license-review-queue.json --known-risk-policy ide/packaging/p06-known-license-risk.json
          python -m unittest discover -s ide/packaging -p 'test_verify_p06_lock_parity.py' -v
          python -m unittest discover -s ide/packaging -p 'test_p06_candidate_lock.py' -v
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform ${{ matrix.os }}
          python ide/packaging/verify_p06_lock_parity.py --review ide/packaging/p06-reviewed-lock-graphs.json --evidence ide/app/src-tauri/p06-dependency-evidence.json --npm-lock ide/app/package-lock.json --cargo-lock ide/app/src-tauri/Cargo.lock --platform ${{ matrix.os }} --receipt ide/app/src-tauri/p06-cross-os-parity-receipt.json
          echo 'P06_LOCKFILES_REVIEWED_AND_SOURCE_COMMITTED_NO_SIGNED_RELEASE_APPROVAL'
      - name: Independently scope unresolved notices to native Cargo target graph (no exemptions)
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            target=x86_64-pc-windows-msvc
          else
            target=x86_64-unknown-linux-gnu
          fi
          cargo metadata --offline --locked --format-version 1 --manifest-path ide/app/src-tauri/Cargo.toml --filter-platform "$target" > ide/app/src-tauri/p06-filtered-native-metadata.json
          python -m unittest discover -s ide/packaging -p 'test_p06_target_license_scope.py' -v
          python ide/packaging/p06_target_license_scope.py --inventory ide/app/src-tauri/p06-notices/inventory.json --metadata ide/app/src-tauri/p06-filtered-native-metadata.json --source-sha "$EXACT_SHA" --platform ${{ matrix.os }} --target-triple "$target" --output ide/app/src-tauri/p06-native-license-scope.json
          echo 'P06_NATIVE_RESOLVE_SCOPE_ONLY_LICENSE_REVIEW_REMAINS_OPEN'
      - name: Exercise locked npm and Cargo resolution without source mutation
        shell: bash
        run: |
          set -euo pipefail
          (cd ide/app && npm ci --ignore-scripts --no-audit --no-fund)
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/verify_p06_lock_parity.py --review ide/packaging/p06-reviewed-lock-graphs.json --evidence ide/app/src-tauri/p06-dependency-evidence.json --npm-lock ide/app/package-lock.json --cargo-lock ide/app/src-tauri/Cargo.lock --platform ${{ matrix.os }} --receipt ide/app/src-tauri/p06-locked-rerun-receipt.json
      - name: Retain exact source-committed locks, upstream notices and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ide-p06-resolved-locks-${{ matrix.os }}-unapproved
          path: |
            ide/app/package-lock.json
            ide/app/src-tauri/Cargo.lock
            ide/app/src-tauri/p06-upstream-receipt.json
            ide/app/src-tauri/p06-notices/**
            ide/app/src-tauri/p06-dependency-evidence.json
            ide/app/src-tauri/p06-license-review-queue.json
            ide/app/src-tauri/p06-filtered-native-metadata.json
            ide/app/src-tauri/p06-native-license-scope.json
            ide/app/src-tauri/p06-cross-os-parity-receipt.json
            ide/app/src-tauri/p06-locked-rerun-receipt.json
          if-no-files-found: warn
          retention-days: 30
