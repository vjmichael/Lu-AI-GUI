name: IDE DEV-02 protected installed Linux language services
# Real installed application, not a source compiler simulation. This manual
# lane deliberately requires a separately enrolled delegated-cgroup runner,
# vetted root-owned assets and an owner-approved release manifest.
# Current manifest releaseApproved=false: this job MUST fail closed until
# the independent legal/redistribution and provenance review is completed.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-installed-linux-protected-lsp:
    runs-on: [self-hosted, Linux, lu-ide-delegated]
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: 0
      LU_IDE_REVIEWED_LSP_BUNDLE_ROOT: /opt/lu-ide-reviewed-language-assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Deny unprotected Linux host or unapproved bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:ide/app/package-lock.json)" = "dfe4412bfacfc22ad1149f5213f4a26aa49b4067"
          test "$(git rev-parse HEAD:ide/app/src-tauri/Cargo.lock)" = "87d0045a4be1c78651f080300aba71c14dbe1f30"
          test -f /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c %u /usr/bin/bwrap)" = 0
          test -r /sys/fs/cgroup/cgroup.controllers
          test -r /proc/self/cgroup
          grep -E '^0::/.*/lu-ide-delegated(\.service)?/lu-ide-host$' /proc/self/cgroup
          test -d "$LU_IDE_REVIEWED_LSP_BUNDLE_ROOT"
          test ! -L "$LU_IDE_REVIEWED_LSP_BUNDLE_ROOT"
          test "$(stat -c %u "$LU_IDE_REVIEWED_LSP_BUNDLE_ROOT")" = 0
          test "$(stat -c %a "$LU_IDE_REVIEWED_LSP_BUNDLE_ROOT" | cut -c2-3)" != 77
          command -v dbus-run-session
          command -v xvfb-run
          command -v xdotool
          /usr/bin/python3 -c 'import pyatspi'
          python3 ide/packaging/verify_language_servers.py --manifest ide/packaging/language-servers.manifest.json --bundle-root "$LU_IDE_REVIEWED_LSP_BUNDLE_ROOT" --release
      - name: Stage only approved Linux binary and original license bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 ide/packaging/stage_linux_language_server_release.py \
            --manifest ide/packaging/language-servers.manifest.json \
            --bundle-root "$LU_IDE_REVIEWED_LSP_BUNDLE_ROOT" \
            --destination ide/app/src-tauri/reviewed-lsp-resources \
            > "$RUNNER_TEMP/lu-ide-e2-linux-stage.json"
          /usr/bin/python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path("ide/app/src-tauri/reviewed-lsp-resources/linux-lsp-staging-evidence.json")
          data=json.loads(path.read_text())
          if set(data["servers"]) != {"clangd", "rust-analyzer", "ruff"}:
              raise SystemExit("DENIED: all three reviewed native providers are required")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              for item in data["servers"].values():
                  sha=item["bundleSha256"]
                  if len(sha)!=64 or not all(c in "0123456789abcdef" for c in sha):
                      raise SystemExit("DENIED: malformed full tree pin")
                  out.write(item["rustEnvPin"]+"="+sha+"\n")
          print("DEV02_LINUX_THREE_REVIEWED_BUNDLE_TREE_HASHES=PASS")
          PY
      - name: Compile genuine exact-head native LSP host and frontend
        shell: bash
        working-directory: ide/app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          cargo test --manifest-path ../host/Cargo.toml --all-targets --locked
          cargo test --manifest-path src-tauri/Cargo.toml --features native-lsp --lib --locked
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          python ../packaging/verify_p06_candidate_lock.py --repo-root ../.. --platform ubuntu-24.04
          python ../packaging/upstream_notice_receipt.py --repo-root ../.. \
            --source-sha "${{ github.sha }}" \
            --output src-tauri/upstream-notice-receipt.json
          python ../packaging/collect_verification_licenses.py --repo-root ../.. \
            --output src-tauri/verification-notices --source-sha "${{ github.sha }}" \
            --upstream-receipt src-tauri/upstream-notice-receipt.json
          npx --yes @tauri-apps/cli@2.12.4 build \
            --config src-tauri/tauri.dev02.linux.conf.json \
            --bundles deb --features native-lsp
      - name: Install actual reviewed Debian with root-owned LSP resources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          python ide/packaging/verify_p04_license_bundle.py \
            --license-root ide/app/src-tauri/verification-notices \
            --source-sha "${{ github.sha }}" --require-upstream \
            --artifact "$deb" \
            --receipt ide/app/src-tauri/verification-package-receipt.json
          for server in clangd rust-analyzer ruff; do
            dpkg-deb --contents "$deb" | grep -F "/language-servers/$server/bin/$server"
          done
          dpkg-deb --contents "$deb" | grep -F '/THIRD_PARTY_LICENSES/inventory.json'
          package="$(dpkg-deb --field "$deb" Package)"
          if dpkg-query --show --showformat='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
            echo 'DENIED: preexisting target package on protected runner' >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP"
          printf '%s\n' "$package" > "$RUNNER_TEMP/dev02-installed-pkg"
          sudo dpkg --install "$deb"
          touch "$RUNNER_TEMP/dev02-installed"
          test -x /usr/bin/lu-ide-desktop
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          roots=[Path("/usr/lib"),Path("/usr/share")]
          for name in ("clangd","rust-analyzer","ruff"):
              found=[]
              for root in roots:
                  found.extend(root.glob("**/language-servers/"+name+"/bin/"+name))
              if len(found) != 1:
                  raise SystemExit(f"DENIED: one installed {name} asset required; got {len(found)}")
              entry=found[0]
              if entry.is_symlink() or entry.stat().st_uid != 0 or (
                  entry.stat().st_mode & 0o022
              ):
                  raise SystemExit(f"DENIED: installed {name} not root-owned immutable binary")
          print("DEV02_LINUX_ACTUAL_INSTALLED_ROOT_OWNED_LSP_BINARIES=PASS")
          PY
      - name: Real GTK-consented protected Rust/C++/Python UI and method acceptance
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lu-ide-e2-three-languages-${GITHUB_RUN_ID}"
          test ! -e "$root"
          mkdir -m 700 "$root"
          cat > "$root/Cargo.toml" <<'TOML'
          [package]
          name = "lu-ide-e2-real-providers"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "main.rs"
          TOML
          cat > "$root/main.rs" <<'RUST'
          fn compute_value() -> i32 { 7 }
          fn main() {
              let _value = compute_value();
              let _broken = unknown_symbol;
          }
          RUST
          cat > "$root/main.cpp" <<'CPP'
          int compute_value() { return 7; }
          int main() {
              int value = compute_value();
              return value + unknown_symbol;
          }
          CPP
          cat > "$root/hello.py" <<'PY'
          import os
          def greet():
              print("hello")
          greet()
          PY
          /usr/bin/python3 -m py_compile ide/app/fixtures/dev02_linux_installed_lsp_atspi.py
          env WO8_INSTALLED_EXE=/usr/bin/lu-ide-desktop WO8_FIXTURE_ROOT="$root" \
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            /usr/bin/python3 ide/app/fixtures/dev02_linux_installed_lsp_atspi.py
          echo 'DEV02_LINUX_REAL_INSTALLED_PROTECTED_THREE_LANGUAGES=PASS'
      - name: Always remove installed Debian package
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/dev02-installed" ]]; then
            pkg="$(cat "$RUNNER_TEMP/dev02-installed-pkg")"
            sudo dpkg --remove "$pkg"
            if dpkg-query --show --showformat='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
              echo 'DENIED: real reviewed package was not removed' >&2
              exit 2
            fi
            echo 'DEV02_LINUX_REAL_INSTALLED_PACKAGE_UNINSTALL=PASS'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev02-linux-installed-lsp-native-provenance
          path: |
            ide/app/src-tauri/verification-package-receipt.json
            ide/app/src-tauri/reviewed-lsp-resources/linux-lsp-staging-evidence.json
          if-no-files-found: warn
          retention-days: 7
