# Group 6D batched verification: NO per-commit triggers, no queue fanout.
name: IDE Group 6D consolidated native and installed acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: ide-g06d-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-native:
    name: G06D original, quarantine, native protected replay / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head and independently passed source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor afbbc96122b72e4d2695861c307c753b189b0ec0 HEAD
          git merge-base --is-ancestor f2cd984cf89b25c8a8ba70109e979a89fd13451f HEAD
          echo G06D_SOURCE_SHA="$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install native Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev patchelf libssl-dev
      - name: Native Git commit/parent/tree/diff tests and strict Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/host/Cargo.toml --lib git_rebase_cherry_plan -- --nocapture
          cargo test --manifest-path ide/host/Cargo.toml --lib git_replay_quarantine -- --nocapture
          cargo test --manifest-path ide/host/Cargo.toml --lib git_protected_replay -- --nocapture
          cargo test --manifest-path ide/host/Cargo.toml --lib git_divergent_verify -- --nocapture
          cargo test --locked --manifest-path ide/host/Cargo.toml --lib git_conflict_inventory -- --nocapture
          rustfmt --edition 2021 --check ide/host/src/git_conflict_inventory.rs
          cargo test --manifest-path ide/host/Cargo.toml --lib git_protected_divergent_merge -- --nocapture
          cargo test --manifest-path ide/host/Cargo.toml --lib git_protected_merge
          rustfmt --edition 2021 --check ide/host/src/git_rebase_cherry_plan.rs ide/host/src/git_replay_quarantine.rs ide/host/src/git_protected_replay.rs ide/host/src/git_divergent_verify.rs ide/host/src/git_protected_divergent_merge.rs
          echo G06D_LOCAL_ORIGINAL_REPLAY=SOURCE_REVIEW_ONLY
      - name: Hostile UI source-boundary checks and desktop build
        shell: bash
        run: |
          set -euo pipefail
          cd ide/app
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/g06c04_original_replay_review.test.mjs tests/g06c04_protected_replay.test.mjs tests/g06c03b_protected_divergent.test.mjs tests/g06d01_conflict_inventory.test.mjs tests/g06d02_three_way_editor.test.mjs
          npm run build
          echo G06D_WEB=NATIVE_ONE_USE_OS_APPROVAL_ONLY
      - name: Native Tauri typed replay route compile
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ] && [ ! -f ide/app/src-tauri/icons/icon.ico ]; then
            python ide/app/fixtures/make_g04d_ci_icon.py
          fi
          cargo check --locked --manifest-path ide/app/src-tauri/Cargo.toml --all-targets
          echo G06D_TAURI=COMPILED_SOURCE_NOT_PHYSICAL_INSTALLED_OPERATOR_CONSENT
      - name: Explicitly record deferred execution and human gates
        if: always()
        shell: bash
        run: |
          mkdir -p ide-g06c04-receipts
          printf 'head=%s\nos=%s\noriginal_review=READ_ONLY\nquarantine_trees=SEPARATE_BARE_OBJECT_DATABASE\nrebase_authorization=REQUIRES_DISTINCT_NATIVE_OS_DIALOG\ncherrypick_authorization=REQUIRES_DISTINCT_NATIVE_OS_DIALOG\nref_updates=EXACT_OLD_HEAD_CAS_ONLY\nphysical_approval=DEFERRED\ninstalled_human_acceptance=DEFERRED\n' \
            "$SOURCE_SHA" "$RUNNER_OS" > ide-g06c04-receipts/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-g06c04-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ide-g06c04-receipts/
          retention-days: 7

  # Automated INSTALLED-package smoke only. No OS dialog is auto-approved.
  # Physical user-operated one-use consent remains DEFERRED (issue #212).
  installed-g06c04-debian-smoke:
    name: G06D exact-head Debian install, process restart, uninstall (not physical consent)
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact selected source and native graphical dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf libssl-dev xvfb xauth xdotool dbus-x11 openbox
      - name: Resolve source licenses and build actual unsigned Debian package
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha "$SOURCE_SHA" --output ide/app/src-tauri/upstream-notice-receipt.json
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha "$SOURCE_SHA" --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          cd ide/app
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.g06b05.linux.conf.json --bundles deb
      - name: Verify license payload and exercise real Debian installation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          [[ "${#packages[@]}" -eq 1 ]] || { echo G06D_DEB_DENIED:package_count >&2; exit 2; }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha "$SOURCE_SHA" --require-upstream --artifact "${packages[0]}" --receipt ide/app/src-tauri/verification-package-receipt.json
          bash ide/app/fixtures/Test-G06B05InstalledDebSmoke.sh "${packages[0]}" "$SOURCE_SHA"
          sha256sum "${packages[0]}"
          echo G06D_LINUX_INSTALLED_SMOKE=NOT_HUMAN_CONSENT
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ide-g06c04-deb-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ide/app/src-tauri/target/release/bundle/deb/*.deb
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7

  installed-g06c04-windows-smoke:
    name: G06D exact-head NSIS install, process restart, uninstall (not physical consent)
    runs-on: windows-2022
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build exact source and independently bound Windows license inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha "$SOURCE_SHA" --output ide/app/src-tauri/upstream-notice-receipt.json
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha "$SOURCE_SHA" --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          if [ ! -f ide/app/src-tauri/icons/icon.ico ]; then python ide/app/fixtures/make_g04d_ci_icon.py; fi
          cd ide/app
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.g06b05.windows.conf.json --bundles nsis
      - name: Verify installer, install and restart real NSIS application, independent Git integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'G06D_NSIS_DENIED:installer_count' }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha $env:SOURCE_SHA --require-upstream --artifact $setup[0].FullName --receipt ide/app/src-tauri/verification-package-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'G06D_NSIS_DENIED:unverified_licenses' }
          $fixture=Join-Path $env:RUNNER_TEMP 'g06c04-disposable-git'
          $manifest=Join-Path $env:RUNNER_TEMP 'g06c04-git-before.json'
          python ide/app/fixtures/g06b05_git_oracle.py fixture --directory $fixture --mode create
          if ($LASTEXITCODE -ne 0) { throw 'G06D_NSIS_DENIED:fixture' }
          python ide/app/fixtures/g06b05_git_oracle.py snapshot --repo $fixture --manifest $manifest --mode create --expect-index initial
          if ($LASTEXITCODE -ne 0) { throw 'G06D_NSIS_DENIED:independent_snapshot' }
          & ide/app/fixtures/Test-InstalledAlphaNsis.ps1 -InstallerPath $setup[0].FullName -InstallRoot (Join-Path $env:RUNNER_TEMP 'g06c04-nsis-test-install')
          python ide/app/fixtures/g06b05_git_oracle.py check --manifest $manifest --outcome unchanged
          if ($LASTEXITCODE -ne 0) { throw 'G06D_NSIS_DENIED:unrelated_git_modified' }
          Write-Host 'G06D_WINDOWS_INSTALLED_SMOKE=NOT_HUMAN_CONSENT'
          Write-Host ('G06D_NSIS_SHA256='+(Get-FileHash -Algorithm SHA256 $setup[0].FullName).Hash)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ide-g06c04-nsis-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ide/app/src-tauri/target/release/bundle/nsis/*setup.exe
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7
