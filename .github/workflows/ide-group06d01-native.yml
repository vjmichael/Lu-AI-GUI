name: IDE G06D01 real index conflict inventory native acceptance
on:
  push:
    branches: [ide/group06d01-conflict-inventory-20261111]
  pull_request:
    branches: [ide/group06c03b-divergent-merge-20261111]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Native Tauri Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev
      - name: Real Git blob and index inspection fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test --locked --manifest-path ide/host/Cargo.toml --lib git_conflict_inventory -- --nocapture
          cargo check --locked --manifest-path ide/host/Cargo.toml --all-targets
          rustfmt --edition 2021 --check ide/host/src/git_conflict_inventory.rs
      - name: Hostile UI read-only inspection contract
        shell: bash
        run: |
          set -euo pipefail
          cd ide/app
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/g06d01_conflict_inventory.test.mjs
          npm run build
      - name: Native Tauri typed route compile
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ] && [ ! -f ide/app/src-tauri/icons/icon.ico ]; then
            python ide/app/fixtures/make_g04d_ci_icon.py
          fi
          cargo check --locked --manifest-path ide/app/src-tauri/Cargo.toml --all-targets
      - name: Source-read-only gate declaration
        if: always()
        shell: bash
        run: |
          echo "G06D01_SOURCE_SHA=$SOURCE_SHA"
          echo 'G06D01_NATIVE_INDEX_CONFLICTS=READ_ONLY'
          echo 'G06D01_APPLY_AUTHORITY=NOT_IMPLEMENTED'
          echo 'G06D01_HUMAN_ACCEPTANCE=DEFERRED'
