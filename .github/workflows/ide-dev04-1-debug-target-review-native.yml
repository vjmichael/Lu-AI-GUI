name: IDE DEV04.1 native debugger target review
on:
  push:
    branches: [ide/dev04-1-debug-target-provenance-20261108]
  pull_request:
    paths:
      - 'ide/host/**'
      - 'ide/app/**'
      - '.github/workflows/ide-dev04-1-debug-target-review-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ide-dev041-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-review:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Linux native Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev
      - name: Reject forged target evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test ide/app/tests/debug_target_review.test.mjs
      - name: Run real native Git/manifest review fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/host/Cargo.toml --test debug_target_review --locked
      - name: Compile the default nonexecuting desktop
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path ide/app/src-tauri/Cargo.toml --all-targets --locked
      - name: Compile protected debugger without permitting project debug
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path ide/app/src-tauri/Cargo.toml --features native-debug --lib --locked
          echo DEV041_PROJECT_DEBUGGER_EXECUTION=DENIED_UNTIL_BINARY_PROVENANCE
