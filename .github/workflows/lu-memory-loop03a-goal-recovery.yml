name: Lu MEMORY-LOOP-03A Host Goal and Recovery Preflight Native
on:
  push:
    branches: ['lu/memory-loop03-goal-recovery-preflight-20261109']
  pull_request:
    paths:
      - 'lu-desktop/src-tauri/src/memory_loop03_goal_gate.rs'
      - 'lu-desktop/src-tauri/src/agent_recovery_provenance.rs'
      - 'lu-desktop/src-tauri/src/memory_desktop.rs'
      - 'lu-desktop/src-tauri/src/lib.rs'
      - 'lu-desktop/tests/memory-loop03a-goal-recovery.test.mjs'
      - '.github/workflows/lu-memory-loop03a-goal-recovery.yml'
      - 'source-tree.lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-memory-loop03a-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-preflight:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact commit, frozen source and bounded branch evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p memory-loop03a-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs 2>&1 | tee memory-loop03a-evidence/source-lock.log
          printf 'SOURCE_SHA=%s\nOS=%s\n' "$EXPECTED_SHA" "$RUNNER_OS" > memory-loop03a-evidence/source.txt
      - name: Real native standalone pure Rust host-policy test
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lu-memory-loop03a-host"
          if test "$RUNNER_OS" = "Windows"; then out="$out.exe"; fi
          rustc --edition=2021 --test lu-desktop/src-tauri/src/memory_loop03_goal_gate.rs -o "$out" 2>&1 | tee memory-loop03a-evidence/host-compiler.log
          "$out" --nocapture 2>&1 | tee memory-loop03a-evidence/host-native-tests.log
          grep -Fq 'test result: ok. 9 passed; 0 failed;' memory-loop03a-evidence/host-native-tests.log
      - name: Check original-source model ingress and policy source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test lu-desktop/tests/memory-loop03a-goal-recovery.test.mjs 2>&1 | tee memory-loop03a-evidence/source-contracts.log
          grep -Fq '# pass 8' memory-loop03a-evidence/source-contracts.log
          grep -Fq '# fail 0' memory-loop03a-evidence/source-contracts.log
      - name: Linux native desktop toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf
      - name: Windows test-only runtime fixture; not a genuine engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'NOT_AN_ENGINE_CI_PLACEHOLDER' -NoNewline
          }
      - name: Actual React bundle and UI diagnostics
        shell: bash
        run: |
          set -euo pipefail
          pushd lu-desktop
          npm ci --no-audit --no-fund
          npm run build
          npm run check
          popd
      - name: Native production Tauri integration and genuine ANSF integration tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib memory_loop03_goal_gate::tests -- --nocapture 2>&1 | tee memory-loop03a-evidence/desktop-goal-tests.log
          grep -Fq 'test result: ok. 9 passed; 0 failed;' memory-loop03a-evidence/desktop-goal-tests.log
          cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml 2>&1 | tee memory-loop03a-evidence/desktop-compile.log
      - name: Prevent fixture or source-only acceptance misclassification
        if: always()
        shell: bash
        run: |
          echo 'This workflow tests an inert host goal+recovery context preflight. It does not accept an installed Windows app, a genuine GGUF model response, current source validity, OS-cgroup custody or execution permissions. Loaded-model and installed-app acceptance remain independent OPEN gates.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-memory-loop03a-host-${{ matrix.os }}
          path: memory-loop03a-evidence/
          if-no-files-found: warn
          retention-days: 14
