name: Lu AI Execution KIAF Native Acceptance
on:
  push:
    branches:
      - lu/ai-execution-p01-p12-recommendations-20261107
  pull_request:
    paths:
      - 'src-tauri/lu-core/src/native_artifact_inspect.rs'
      - 'src-tauri/lu-core/src/native_external_app_action.rs'
      - 'src-tauri/lu-core/src/native_capability_inventory.rs'
      - 'src-tauri/lu-core/src/native_workspace_read_turn.rs'
      - 'src-tauri/lu-core/tests/native_artifact_inspect.rs'
      - 'src-tauri/lu-core/tests/native_workspace_read_turn.rs'
      - '.github/workflows/lu-kiaf-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_artifact_inspect::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_external_app_action::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_capability_inventory::classification_tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib kiaf_failure_attribution_tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_artifact_inspect -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_workspace_read_turn -- --nocapture
