name: IDE D7D protected recovery service (Windows)
on:
  push:
    branches:
      - ide/wave-d7d-protected-windows-recovery-service-20261106
  pull_request:
    paths:
      - "ide/supervisor/**"
      - ".github/workflows/ide-d7d-protected-service.yml"
  workflow_dispatch:

# Keep only the newest exact PR-head OS acceptance run while older heads are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-windows-service:
    env:
      LU_IDE_NATIVE_ACCEPTANCE_TRACE: '1'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows compile and Rust tests
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          cargo check --manifest-path ide/supervisor/Cargo.toml --features protected-recovery-service --all-targets
          cargo test --manifest-path ide/supervisor/Cargo.toml --features protected-recovery-service --lib
          cargo build --manifest-path ide/supervisor/Cargo.toml --features protected-recovery-service --bin windows_recovery_service --bin d7d_service_smoke_fixture
      - name: Parse pinned protected installer before privileged execution
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) { throw 'DENIED: protected installer parse failed' }
      - name: Real SCM LocalService identity and IPC acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $service=(Resolve-Path 'ide/supervisor/target/debug/windows_recovery_service.exe').Path
          $hostExe=(Resolve-Path 'ide/supervisor/target/debug/d7d_service_smoke_fixture.exe').Path
          $serviceHash=(Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash
          $hostHash=(Get-FileHash -LiteralPath $hostExe -Algorithm SHA256).Hash
          try {
            & 'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1' -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash -ApprovedHostExecutable $hostExe -ExpectedHostSha256 $hostHash -CiAcceptanceUnsigned -Start
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "service installation failed: $LASTEXITCODE" }
            & sc.exe queryex LuIdeRecoveryBroker
            if ($LASTEXITCODE -ne 0) { throw 'service query denied' }
            $interactiveSid = @([Security.Principal.WindowsIdentity]::GetCurrent().Groups |
                Where-Object { $_.Value -eq 'S-1-5-4' }).Count -gt 0
            Write-Host "D7D_HOST_INTERACTIVE_LOGON_SID=$interactiveSid"
            & $hostExe $service $serviceHash
            if ($LASTEXITCODE -ne 0) { throw 'real Windows service admission failed' }
          } finally {
            & sc.exe delete LuIdeRecoveryBroker 2>$null | Out-Null
          }
      - name: Ensure production desktop integration remains disabled
        shell: pwsh
        run: |
          $core=Get-Content -Raw 'ide/supervisor/src/lib.rs'
          if ($core -match 'tauri::command') { throw 'DENIED: unauthorized desktop command' }
          Write-Host 'PASS: protected service remains native-only'

  crash-recovery-windows:
    env:
      LU_IDE_NATIVE_ACCEPTANCE_TRACE: '1'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile fixed native crash and recovery observer
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          cargo build --manifest-path ide/supervisor/Cargo.toml --features protected-recovery-service --bin windows_recovery_service --bin d7d_service_crash_fixture
      - name: Real host kill, protected service cleanup, restart and kernel reconciliation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $service=(Resolve-Path 'ide/supervisor/target/debug/windows_recovery_service.exe').Path
          $hostExe=(Resolve-Path 'ide/supervisor/target/debug/d7d_service_crash_fixture.exe').Path
          $serviceHash=(Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash
          $hostHash=(Get-FileHash -LiteralPath $hostExe -Algorithm SHA256).Hash
          try {
            & 'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1' -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash -ApprovedHostExecutable $hostExe -ExpectedHostSha256 $hostHash -CiAcceptanceUnsigned -Start
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "install failed: $LASTEXITCODE" }
            & 'ide/supervisor/fixtures/Test-D7DProtectedServiceCrash.ps1' -FixtureExecutable $hostExe -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "crash fixture failed: $LASTEXITCODE" }
          } finally {
            & sc.exe delete LuIdeRecoveryBroker 2>$null | Out-Null
          }

  pinned-offline-protected-cargo:
    env:
      LU_IDE_NATIVE_ACCEPTANCE_TRACE: '1'
      LU_IDE_D7_CI_ALLOW_EXACT_NUL: '1'
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Construct D7B offline MSVC, Windows SDK and Rust fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./ide/supervisor/fixtures/New-PinnedWindowsToolchain.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'lu-d7d-offline') -LockPath (Join-Path $env:RUNNER_TEMP 'lu-d7d-toolchain.lock.json') -RustVersion '1.99.1' -SdkVersion '10.0.26100.0' -VsVersionPrefix '17.14.' -MsvcVersionPrefix '14.44.'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'DENIED: offline SDK/toolchain construction failed' }
      - name: Compile SCM service and real native worker under protected feature
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo build --manifest-path ide/supervisor/Cargo.toml --features protected-recovery-service,ci-native-null-lease --bin windows_recovery_service --bin windows_null_service_bootstrap --example d7_windows_acceptance
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: production native worker compile failed' }
      - name: Execute real pinned offline Cargo job and native cancellation
        shell: pwsh
        env:
          LU_IDE_NATIVE_ACCEPTANCE_TRACE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $service=(Resolve-Path 'ide/supervisor/target/debug/windows_recovery_service.exe').Path
          $hostExe=(Resolve-Path 'ide/supervisor/target/debug/examples/d7_windows_acceptance.exe').Path
          $serviceHash=(Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash
          $hostHash=(Get-FileHash -LiteralPath $hostExe -Algorithm SHA256).Hash
          $bootstrap=(Resolve-Path 'ide/supervisor/target/debug/windows_null_service_bootstrap.exe').Path
          try {
            & 'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1' -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash -ApprovedHostExecutable $hostExe -ExpectedHostSha256 $hostHash -CiAcceptanceUnsigned -Start
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'DENIED: restricted SCM install failed' }
            # Disposable trusted native admin fixture: grant DACL management
            # solely to NT SERVICE\\LuIdeRecoveryBroker, then let THAT
            # restricted service own per-job exact AppContainer package ACEs.
            & $bootstrap --grant-fixed-service
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: exact service NUL bootstrap failed' }
            & $bootstrap --verify-fixed-service
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: exact service NUL rights not verified' }
            $env:LU_IDE_D7_PROTECTED_SERVICE_EXE=$service
            & $hostExe
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: protected real Cargo check failed' }
            & $hostExe --cancel-native-worker
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: protected real Cargo cancellation failed' }
          } finally {
            if ($bootstrap) {
              & $bootstrap --revoke-fixed-service
              if ($LASTEXITCODE -ne 0) { Write-Error 'DENIED: exact service NUL bootstrap revocation failed' }
            }
            & sc.exe delete LuIdeRecoveryBroker 2>$null | Out-Null
          }
      - name: Retain observed, unapproved offline toolchain digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d7d-observed-toolchain-lock
          path: ${{ runner.temp }}/lu-d7d-toolchain.lock.json
          if-no-files-found: ignore

  service-loss-windows:
    env:
      LU_IDE_NATIVE_ACCEPTANCE_TRACE: '1'
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact restricted service and fixed service-loss observer
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          cargo build --manifest-path ide/supervisor/Cargo.toml --features protected-recovery-service --bin windows_recovery_service --bin d7d_service_crash_fixture
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: D7D native build failed' }
      - name: Forcefully kill service during active child then refuse false restart recovery
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $service=(Resolve-Path 'ide/supervisor/target/debug/windows_recovery_service.exe').Path
          $hostExe=(Resolve-Path 'ide/supervisor/target/debug/d7d_service_crash_fixture.exe').Path
          $serviceHash=(Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash
          $hostHash=(Get-FileHash -LiteralPath $hostExe -Algorithm SHA256).Hash
          try {
            & 'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1' -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash -ApprovedHostExecutable $hostExe -ExpectedHostSha256 $hostHash -CiAcceptanceUnsigned -Start
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'DENIED: protected service install failed' }
            & 'ide/supervisor/fixtures/Test-D7DProtectedServiceLoss.ps1' -FixtureExecutable $hostExe -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'DENIED: service-loss acceptance failed' }
          } finally {
            & sc.exe delete LuIdeRecoveryBroker 2>$null | Out-Null
          }
