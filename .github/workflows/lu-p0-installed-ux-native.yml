name: Lu P0 installed UX and host-clock native task group (not release)
on:
  pull_request:
    types: [edited]
permissions:
  contents: read
jobs:
  p0-native:
    if: ${{ github.event.pull_request.number == 205 && github.event.pull_request.draft && github.event.pull_request.head.ref == 'lu/p0-installed-ux-agent-acceptance-20261110' && contains(github.event.pull_request.body, format('LU_P0_UX_NATIVE_SHA={0}', github.event.pull_request.head.sha)) && !contains(github.event.changes.body.from, format('LU_P0_UX_NATIVE_SHA={0}', github.event.pull_request.head.sha)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source identity and frozen tree
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p p0-native-evidence
          test "$(git rev-parse HEAD)" = "$SHA"
          node scripts/verify-source-tree.mjs 2>&1 | tee p0-native-evidence/source-lock.log
          printf 'SOURCE_SHA=%s\n' "$SHA" > p0-native-evidence/identity.txt
      - name: Source and behavior contracts for actual owner-observed failures
        shell: bash
        run: |
          set -euo pipefail
          node --test lu-desktop/tests/p0-physical-ux-contract.test.mjs lu-desktop/tests/p0-native-intent.test.mjs lu-desktop/tests/ux-chat01-message-interactions.test.mjs lu-desktop/tests/preview-dual-backend.test.mjs 2>&1 | tee p0-native-evidence/p0-source-tests.log
      - name: Native Linux desktop WebView dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf
      - name: Windows test-only Tauri build resources (not real model or package)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'P0_TEST_ONLY_NOT_A_REAL_ENGINE' -NoNewline
          }
      - name: Compile actual React frontend and frontend safety checks
        shell: bash
        run: |
          set -euo pipefail
          pushd lu-desktop
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tee ../p0-native-evidence/react-build.log
          npm run check 2>&1 | tee ../p0-native-evidence/react-check.log
          popd
      - name: Native Windows/Linux production Tauri clock tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib host_clock::tests -- --nocapture 2>&1 | tee p0-native-evidence/clock-native.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib agent_memory_reasoning::tests -- --nocapture 2>&1 | tee p0-native-evidence/ansf-regression.log
      - name: State limitations honestly
        if: always()
        shell: bash
        run: |
          echo 'This task group validates sources, frontend compilation and native host-clock tests only. It does NOT prove installed UX screenshots, physical AMD Vulkan memory telemetry, real model tool selection, browser worker, multimodal GGUF or HF verified download.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-p0-ux-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: p0-native-evidence/
          retention-days: 14
          if-no-files-found: warn
