name: Lu BACKEND-CTRL-01 cancel and completion semantics

on:
  push:
    branches:
      - lu/backend-control-cancellation-design-20261104
  pull_request:
    paths:
      - 'src-tauri/lu-core/**'
      - 'source-tree.lock.json'
      - '.github/workflows/lu-backend-control-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checked-out source inventory
        run: node scripts/verify-source-tree.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: vLLM worker offline syntax validation
        run: python -m py_compile src-tauri/vllm-worker/lu_vllm_worker.py src-tauri/vllm-worker/test_lu_vllm_worker.py
      - name: vLLM request-ID abort and safety contract (no GPU)
        run: python -m unittest discover -s src-tauri/vllm-worker -p 'test_*.py' -v
      - name: Host cancellation, backend ejection and stream regression tests
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib
      - name: Protobuf supervisor token-loop regression
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_stream_loop
