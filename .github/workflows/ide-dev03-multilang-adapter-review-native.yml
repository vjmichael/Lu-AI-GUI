name: IDE DEV03.2B reviewed multi-language adapter native
on:
  push:
    branches: [ide/dev03-multilang-native-adapter-review-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ide-dev03-multilang-review-exact-head
  cancel-in-progress: true

jobs:
  adapter-review:
    name: Native fixed adapter review / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact head and unmodified native worker authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BASE=1d6b1325967cfa20e8be7bba395e33ac2e506ff4
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- \
            ide/supervisor ide/sandbox \
            ide/host/src/browser.rs ide/host/src/execution_intents.rs \
            ide/app/src-tauri/src/build_backend.rs \
            ide/app/src-tauri/src/debug_backend.rs
          echo DEV03_NONRUST_EXISTING_NATIVE_WORKER_UNCHANGED=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Ubuntu native Tauri/GTK headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev patchelf libssl-dev
      - name: Fixed JS contract and full frontend
        working-directory: ide/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/reviewed_multilang_adapters.test.mjs
          npm run check
          echo DEV03_MULTILANG_FRONTEND_SOURCE_PASS
      - name: Native clean-Git and malicious-manifest filesystem cases
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/host/Cargo.toml \
            --test reviewed_multilang_adapters
          cargo test --manifest-path ide/host/Cargo.toml --all-targets
          echo DEV03_MULTILANG_RUST_HOST_PASS
      - name: Native typed Tauri review command build (no worker feature)
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path ide/app/src-tauri/Cargo.toml \
            --locked --all-targets
          echo DEV03_MULTILANG_TAURI_SOURCE_PASS
          echo DEV03_MULTILANG_EXECUTION_ADAPTER=NOT_IMPLEMENTED
          echo DEV03_MULTILANG_INSTALLED_APP_ACCEPTANCE=OPEN
      - name: Capture exact-head OS evidence boundary
        if: always()
        shell: bash
        run: |
          mkdir -p .dev03-multilang-receipts
          printf 'sha=%s\nrunner=%s\nrun=%s\nnative_review_only=true\nrunnable_adapter=false\ninstalled_acceptance=OPEN\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$GITHUB_RUN_ID" \
            > .dev03-multilang-receipts/native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-dev03-multilang-review-${{ matrix.os }}
          path: .dev03-multilang-receipts/native.txt
          if-no-files-found: error
          retention-days: 14
