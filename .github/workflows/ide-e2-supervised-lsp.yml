name: Lu IDE Wave E2 supervised LSP protocol and editor
on:
  pull_request:
    paths:
      - 'ide/host/**'
      - 'ide/supervisor/**'
      - 'ide/app/**'
      - 'ide/packaging/**'
      - '.github/workflows/ide-e2-supervised-lsp.yml'
  push:
    branches: ['ide/wave-e2-supervised-lsp-editor-20261106']
  workflow_dispatch:

# Coalesce superseded exact-head runs instead of filling the native CI queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol-and-editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native host LSP session and source revision tests
        run: cargo test --manifest-path ide/host/Cargo.toml lsp_session::tests -- --nocapture
      - name: Host source and semantic capabilities regression
        run: cargo test --manifest-path ide/host/Cargo.toml --all-targets
      - name: Supervisor LSP transport feature tests (NO OS server launch)
        run: cargo test --manifest-path ide/supervisor/Cargo.toml --features lsp-transport --all-targets
      - name: Check Rust formatting
        if: always()
        run: |
          cargo fmt --manifest-path ide/host/Cargo.toml -- --check
          cargo fmt --manifest-path ide/supervisor/Cargo.toml -- --check
      - name: Install editor dependencies and build UI
        shell: bash
        run: |
          cd ide/app
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Offline installer asset and license-redistribution audit
        shell: bash
        run: |
          python3 -m unittest discover -s ide/packaging -p 'test_*.py' -v
          python3 ide/packaging/verify_language_servers.py
          if python3 ide/packaging/verify_language_servers.py --release; then
            echo 'DENIED: unreviewed LSP bundle was accepted for release'
            exit 1
          fi

  windows-tauri-host:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cargo check invokes tauri-build, which requires icon.ico even for
      # compilation-only jobs. Generate the first-party deterministic icon
      # without npm install or executing an untrusted project script.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate first-party Tauri resource icon
        run: node ide/app/scripts/make-icon.mjs
      # Tauri generate_context! refuses missing frontendDist even for cargo
      # check. Build actual browser assets, never a dummy empty directory.
      - name: Build genuine standalone frontend before Tauri compile
        shell: bash
        run: |
          cd ide/app
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Compile standalone desktop with read-only LSP status and provider catalog
        run: cargo check --manifest-path ide/app/src-tauri/Cargo.toml --all-targets
      - name: Compile release-gated protected native Windows language service host
        run: cargo check --manifest-path ide/app/src-tauri/Cargo.toml --features native-lsp --all-targets
      - name: Native language router, release pin and traversal denial tests
        run: cargo test --manifest-path ide/app/src-tauri/Cargo.toml --features native-lsp --lib
      - name: Prove no unprotected editor worker starts
        shell: pwsh
        run: |
          $content=Get-Content 'ide/app/src-tauri/src/lib.rs' -Raw
          if ($content -match 'ide_start_language_server|ide_run_job|ide_execute_job') {
            throw 'DENIED: unaccepted executable LSP or worker route'
          }
          if ($content -notmatch 'LSP_PROTECTED_WORKER_UNVERIFIED') {
            throw 'DENIED: protected native acceptance gate missing'
          }

  # Evidence of installed DEFAULT shell only. It cannot prove signed E2 LSP
  # acceptance: no native-lsp flag, no SCM service, no language-server assets.
  unsigned-installed-desktop-smoke:
    needs: protocol-and-editor
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install frontend dependencies
        working-directory: ide/app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare exact-source resolved licenses for real NSIS Tauri resources
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform windows-2022
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: installer resolved lock graph differs from reviewed OS evidence' }
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: npm locked install failed' }
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: Cargo locked resolution failed' }
          python ide/packaging/verify_p06_candidate_lock.py --repo-root . --platform windows-2022
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: locked reinstall changed OS dependency graph' }
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: unresolved Cargo native license sources' }
          python ide/packaging/verify_tauri_minor.py --repo-root .
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: actual resolved Tauri runtime graph incompatibility' }
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha $env:SOURCE_SHA --output ide/app/src-tauri/upstream-notice-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: source-pinned upstream license retrieval failed' }
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha $env:SOURCE_SHA --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: actual npm/Cargo third-party licenses not staged' }
          Write-Host 'P05_E2_NATIVE_LICENSES=RESOLVED_AND_INCLUDED_NO_LEGAL_APPROVAL'
      - name: Build genuine unsigned standalone NSIS
        working-directory: ide/app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.installed-smoke.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native NSIS build failed' }
      - name: Bind NSIS installer bytes to reviewed legal files and exact source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $installers=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'DENIED: exact single unsigned NSIS candidate missing' }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha $env:SOURCE_SHA --artifact $installers[0].FullName --require-upstream --receipt ide/app/src-tauri/e2-supervised-package-license-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: NSIS license inventory or package SHA differs' }
      - name: Check real installed executable launch/restart/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installers=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis/' -Filter '*setup.exe' -File)
          if ($installers.Count -ne 1) { throw "DENIED: expected exactly one NSIS installer, got $($installers.Count)" }
          $private=Join-Path $env:RUNNER_TEMP ('lu-ide-alpha-smoke-'+$env:GITHUB_RUN_ID)
          & 'ide/app/fixtures/Test-InstalledAlphaNsis.ps1' -InstallerPath $installers[0].FullName -InstallRoot $private
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'DENIED: real installed default IDE failed' }
      - name: Keep unsigned candidate explicitly separate from E2 release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lu-ide-e2-default-alpha-unsigned-nsis-test-only
          path: |
            ide/app/src-tauri/target/release/bundle/nsis/*setup.exe
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/e2-supervised-package-license-receipt.json
          if-no-files-found: error
          retention-days: 3
