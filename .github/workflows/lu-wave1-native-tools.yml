name: Lu Wave 1 Native Tools Consolidation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-wave1-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
      - name: Require consolidated native tool modules
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'pub mod native_file_transfer;' src-tauri/lu-core/src/lib.rs
          grep -Fx 'pub mod native_archive_create;' src-tauri/lu-core/src/lib.rs
          grep -Fx 'pub mod native_spreadsheet_create;' src-tauri/lu-core/src/lib.rs
          grep -Fx 'pub mod native_spreadsheet_tool;' src-tauri/lu-core/src/lib.rs
          grep -Fx 'pub mod native_iso9660;' src-tauri/lu-core/src/lib.rs
          grep -Fx 'pub mod native_iso_extract_tool;' src-tauri/lu-core/src/lib.rs
          grep -Fx 'pub mod native_linux_archive;' src-tauri/lu-core/src/lib.rs
          grep -Fx 'pub mod native_linux_archive_tool;' src-tauri/lu-core/src/lib.rs
  native:
    needs: exact-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Install real Linux compression test backends
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils bzip2 zstd
          command -v xz
          command -v bzip2
          command -v zstd
      - name: Core native tool suite without lockfile regeneration
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib --tests -- --nocapture
      - name: Explicit archive source test matrix
        run: |
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_archive_create -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_file_transfer -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_spreadsheet_create -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_spreadsheet_tool_authority -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_iso9660 -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_linux_archive -- --nocapture
      - name: Ensure no lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src-tauri/lu-core/Cargo.lock lu-desktop/src-tauri/Cargo.lock
