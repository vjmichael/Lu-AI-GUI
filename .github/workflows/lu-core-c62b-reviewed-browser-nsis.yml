name: Lu C6.2B exact-SHA reviewed browser native Windows NSIS and integrity acceptance
on:
  push:
    branches:
      - lu/cp10-c62b-reviewed-browser-20261121
    paths:
      - source-tree.lock.json
  workflow_dispatch:
  workflow_call:
    inputs:
      release_v1:
        description: "Build actual Lu 1.0.0 identity while retaining original reviewed browser and NSIS checks"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: lu-c62b-reviewed-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-and-review:
    outputs:
      worker_approved: ${{ steps.worker_review.outputs.worker_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source/host authorization, approved candidate digest and original security contracts
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/verify-source-tree.mjs
          node --test scripts/lu-c62b-reviewed-browser-contract.test.mjs \
            lu-desktop/tests/browser-staging.test.mjs \
            lu-desktop/tests/browser-native-authorization.test.mjs \
            lu-desktop/tests/p0-browser-bundle.test.mjs \
            lu-desktop/tests/p0-browser-real-ci-gate.test.mjs
          node --test lu-desktop/tests/c64-unified-tabs.test.mjs
          node --test tests/lu-browser-worker.test.mjs
      - name: Fail closed when the independently approved browser worker is stale
        id: worker_review
        shell: bash
        run: |
          set -euo pipefail
          reviewed=68f7aa46c4cd2d6fdb0e951d8da5f057e1cafdd9
          actual="$(git rev-parse HEAD:src-tauri/lu-core/workers/lu_browser_worker.mjs)"
          if [[ "$actual" == "$reviewed" ]]; then
            echo "worker_approved=true" >> "$GITHUB_OUTPUT"
            echo "C6.2B reviewed worker matches the compiled-current source." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "worker_approved=false" >> "$GITHUB_OUTPUT"
            echo "REVIEW_STALE: current worker Git blob $actual differs from original reviewed blob $reviewed." >> "$GITHUB_STEP_SUMMARY"
            echo "Only a new unapproved candidate may be built; no reviewed browser installer admitted." >> "$GITHUB_STEP_SUMMARY"
          fi
  current-windows-unapproved-browser-candidate:
    needs: original-source-and-review
    # An explicit evidence-only commit rechecks the existing immutable candidate,
    # never rebuilds or replaces the 563 MB original artifact.
    if: ${{ needs.original-source-and-review.outputs.worker_approved == 'false' && !contains(github.event.head_commit.message, '[browser-review-evidence-only]') }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify genuine current Git source and immutable lock
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -cne '${{ github.sha }}'){throw 'Current candidate SHA mismatch'}
          node scripts/verify-source-tree.mjs
          if($LASTEXITCODE -ne 0){throw 'Browser candidate source lock rejected'}
          $actual=(git hash-object src-tauri/lu-core/workers/lu_browser_worker.mjs).Trim()
          $record=(git rev-parse HEAD:src-tauri/lu-core/workers/lu_browser_worker.mjs).Trim()
          if($actual -cne $record){throw 'Browser worker checkout differs from canonical committed Git blob'}
      - name: Provision real Playwright and headed Chromium for unapproved Windows candidate
        shell: pwsh
        run: |
          npm install --prefix src-tauri/lu-core/workers --no-save --no-package-lock playwright@1.64.1
          if($LASTEXITCODE -ne 0){throw 'Pinned Playwright candidate provisioning failed'}
          node src-tauri/lu-core/workers/node_modules/playwright/cli.js install --no-shell chromium
          if($LASTEXITCODE -ne 0){throw 'Headed Chromium candidate provisioning failed'}
      - name: Generate and execute exact-current unapproved browser candidate
        shell: pwsh
        run: |
          node lu-desktop/scripts/assemble-browser-ci-candidate.mjs
          if($LASTEXITCODE -ne 0){throw 'Current browser candidate assembly rejected'}
          node --test lu-desktop/tests/browser-ci-candidate.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Exact candidate file inventory, hashes or worker identity rejected'}
          node --test lu-desktop/tests/browser-ci-executable.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Real headed Chromium original security witness failed'}
      - name: Preserve genuine unapproved Windows bundle for independent review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Lu-C62B-REVIEW-REQUIRED-Windows-Browser-${{ github.sha }}
          path: out/lu-browser-candidate/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
      - name: Refuse automatic admission until a separate exact-byte review
        shell: pwsh
        run: |
          throw 'REVIEW_REQUIRED: current browser is an UNAPPROVED candidate; no reviewed installed Chromium/Node/Playwright package or Core release acceptance.'
  independently-verify-archived-candidate-for-review:
    needs: original-source-and-review
    if: ${{ needs.original-source-and-review.outputs.worker_approved == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Lu-C62B-REVIEW-REQUIRED-Windows-Browser-2da58f445d2466756140a95a1782cb26a37e41f3
          run-id: 44976683630
          github-token: ${{ github.token }}
          path: out/lu-browser-candidate
      - name: Independent full archived-byte/hash review and exact current-worker evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-source-tree.mjs
          python3 - <<'PY'
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          root=Path('out/lu-browser-candidate').resolve(strict=True)
          dest=Path('out/lu-browser-independent-review').resolve()
          dest.mkdir(parents=True,exist_ok=False)
          expected_sha='23966eb91d2b933f4f6d9bed85f060cf6fe8c7e274adbb74374e105932cef890'
          expected_worker_blob='68f7aa46c4cd2d6fdb0e951d8da5f057e1cafdd9'
          manifest_bytes=(root/'manifest.json').read_bytes()
          def sha_bytes(b): return hashlib.sha256(b).hexdigest()
          def sha_file(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()
          assert sha_bytes(manifest_bytes)==expected_sha,'approved candidate manifest digest changed'
          assert (root/'manifest.sha256').read_text().strip()==expected_sha,'sidecar manifest digest mismatch'
          m=json.loads(manifest_bytes)
          assert (m.get('schema'),m.get('runtime'),m.get('status'),m.get('platform'),m.get('arch'),m.get('playwrightVersion'))==(1,'lu-browser','candidate','win32','x64','1.64.1')
          assert len(m['files'])==482,'unexpected reviewed candidate file count'
          seen=set(); listed={x['path']:x for x in m['files']}
          required={'chrome.exe','node.exe','lu_browser_worker.mjs','node_modules/playwright/index.mjs','node_modules/playwright-core/index.mjs'}
          assert required<=set(listed),'missing required executable components'
          for x in m['files']:
              rel=x['path']
              assert isinstance(rel,str) and len(rel)<512 and re.fullmatch(r'[A-Za-z0-9._ -]+(?:/[A-Za-z0-9._ -]+)*',rel),'invalid file path'
              parts=rel.split('/')
              assert all(part not in ('.','..') and part==part.strip() for part in parts),'unsafe path'
              assert rel not in seen,'duplicate manifest path'
              seen.add(rel)
              p=root.joinpath(*parts)
              assert p.is_file() and not p.is_symlink() and p.resolve().is_relative_to(root),'untrusted manifest file'
              st=p.stat()
              assert st.st_nlink==1 and st.st_size==x['bytes'],'wrong file identity or size'
              assert sha_file(p)==x['sha256'],'hash mismatch: '+rel
          actual=set()
          for base,dirs,files in os.walk(root,followlinks=False):
              for d in dirs: assert not (Path(base)/d).is_symlink(),'untrusted directory'
              for item in files:
                  p=Path(base)/item
                  assert p.is_file() and not p.is_symlink() and p.stat().st_nlink==1,'unexpected file type'
                  actual.add(p.relative_to(root).as_posix())
          assert actual==seen|{'manifest.json','manifest.sha256','candidate-summary.json'},'extra/missing physical content'
          summary=json.loads((root/'candidate-summary.json').read_bytes())
          assert (summary.get('status'),summary.get('platform'),summary.get('arch'),summary.get('playwrightVersion'),summary.get('files'),summary.get('manifestSha256'))==('candidate','win32','x64','1.64.1',482,expected_sha)
          git_blob=subprocess.check_output(['git','rev-parse','HEAD:src-tauri/lu-core/workers/lu_browser_worker.mjs'],text=True).strip()
          assert git_blob==expected_worker_blob,'current worker source git blob changed'
          current=subprocess.check_output(['git','show','HEAD:src-tauri/lu-core/workers/lu_browser_worker.mjs'])
          original=(root/'lu_browser_worker.mjs').read_bytes()
          assert original==current,'candidate browser worker differs from current source'
          assert listed['lu_browser_worker.mjs']['sha256']==sha_bytes(original),'worker hash source mismatch'
          receipt={'schema':'lu-c62b-independent-byte-review-v1','candidateStatus':'UNAPPROVED_REVIEW_EVIDENCE_ONLY',
           'candidateSourceSha':'2da58f445d2466756140a95a1782cb26a37e41f3',
           'sourceHeadSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           'candidateRunId':44976683630,'candidateArtifactId':14735958441,
           'candidateArtifactZipSha256':'627e732f94b3c45f97099d254c6b747afc168712fb1f5e160bf861668d5ff67a',
           'manifestSha256':expected_sha,'workerGitBlob':git_blob,'workerSha256':sha_bytes(original),
           'fileCount':len(seen),'expectedFileNames':sorted(required),
           'independentFileByteValidation':'PASS_482_OF_482_SHA256',
           'unexpectedFiles':0,'nativeWindowsInstaller':'NOT_BUILT','approval':'NOT_GRANTED'}
          (dest/'review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          for name in ['manifest.json','candidate-summary.json','manifest.sha256','lu_browser_worker.mjs']:
              shutil.copy2(root/name,dest/name)
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve compact independent review packet, without admitting installer
        uses: actions/upload-artifact@v4
        with:
          name: Lu-C62B-INDEPENDENT-REVIEW-EVIDENCE-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: out/lu-browser-independent-review/
  native-windows-installed-reviewed-browser:
    needs: original-source-and-review
    if: ${{ needs.original-source-and-review.outputs.worker_approved == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      LU_V1_RELEASE: ${{ inputs.release_v1 && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original SHA and actual Windows PowerShell source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA){throw 'C6.2B Windows SHA mismatch'}
          node scripts/verify-source-tree.mjs
          if($LASTEXITCODE -ne 0){throw 'C6.2B repository lock failed'}
          foreach($p in @('scripts/build-current-windows-nsis.ps1',
            'scripts/m3-windows-nsis-cycle.ps1',
            'scripts/stage-research-windows.ps1',
            'scripts/p0-windows-installed-gui-smoke.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -ne 0){throw "C6.2B native PowerShell parser failed: $p : $errors"}
          }
      - name: Download exact independently reviewed current C6.2B Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Lu-C62B-REVIEW-REQUIRED-Windows-Browser-2da58f445d2466756140a95a1782cb26a37e41f3
          run-id: 44976683630
          github-token: ${{ github.token }}
          path: out/lu-browser-candidate
      - name: Genuine downloaded Windows bundle is still original executable candidate
        shell: pwsh
        env:
          LU_BROWSER_REQUIRE_CANDIDATE: '1'
        run: |
          node --test lu-desktop/tests/browser-ci-candidate.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Original exact reviewed-candidate byte/Node protocol failed'}
          node --test lu-desktop/tests/browser-ci-executable.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Original actual headed Chromium candidate failed'}
      - name: Offline review promotion requires separately pinned candidate and review digests
        shell: pwsh
        env:
          LU_BROWSER_CANDIDATE_DIR: ${{ github.workspace }}/out/lu-browser-candidate
          LU_BROWSER_REVIEWED_OUT: ${{ github.workspace }}/out/lu-browser-reviewed
        run: |
          $ErrorActionPreference='Stop'
          node lu-desktop/scripts/promote-reviewed-browser-candidate.mjs
          if($LASTEXITCODE -ne 0){throw 'Independent candidate/review exact pin mismatch'}
          $expected='f2948f9ef9d2b5bbac8a60e146bd4a18a0714a615883faaa0139b8d5828e5cf3'
          $actual=(Get-FileHash -LiteralPath 'out/lu-browser-reviewed/manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -cne $expected){throw 'Promotion cannot alter independently pinned reviewed manifest SHA'}
          $m=Get-Content 'out/lu-browser-reviewed/manifest.json' -Raw|ConvertFrom-Json
          if($m.status -cne 'reviewed' -or @($m.files).Count -ne 482){throw 'Reviewed runtime identity invalid'}
      - name: Provision exact current NSIS and source-built Vulkan toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'NSIS\makensis.exe'
          if(-not(Test-Path -LiteralPath $exe)){
            choco install nsis --version=3.11.0 --yes --no-progress --limit-output
            if($LASTEXITCODE -ne 0){throw 'Pinned NSIS 3.11 unavailable'}
          }
          if(-not(Test-Path -LiteralPath $exe)){throw 'NSIS exe missing'}
          & $exe /VERSION
          if($LASTEXITCODE -ne 0){throw 'NSIS failed native invocation'}
          choco install vulkan-sdk --version=1.4.350 --yes --no-progress --limit-output
          if($LASTEXITCODE -ne 0){throw 'Pinned Vulkan SDK unavailable'}
          $sdk=@(Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction Stop |
            Where-Object { Test-Path (Join-Path $_.FullName 'Bin\glslc.exe') })
          if($sdk.Count -ne 1){throw 'Pinned Vulkan SDK absent or ambiguous'}
          "VULKAN_SDK=$($sdk[0].FullName)" >> $env:GITHUB_ENV
          (Join-Path $sdk[0].FullName 'Bin') >> $env:GITHUB_PATH
          & (Join-Path $sdk[0].FullName 'Bin\glslc.exe') --version
          if($LASTEXITCODE -ne 0){throw 'Pinned Vulkan compiler unusable'}
      - name: Compile current Lu with EMBEDDED reviewed Chromium manifest and genuine CPU/Vulkan servers
        shell: pwsh
        timeout-minutes: 150
        env:
          SOURCE_SHA: ${{ github.sha }}
          LU_BROWSER_PACKAGE_DIR: ${{ github.workspace }}/out/lu-browser-reviewed
          LU_BROWSER_MANIFEST_SHA256: 'f2948f9ef9d2b5bbac8a60e146bd4a18a0714a615883faaa0139b8d5828e5cf3'
          LU_REQUIRE_BROWSER: '1'
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'lu-c62b-installed-browser'
          & scripts/build-current-windows-nsis.ps1 -SourceSha $env:SOURCE_SHA -OutputDirectory $out
          if($LASTEXITCODE -ne 0){throw 'Reviewed native browser Windows installer build failed'}
          $f=Get-Content (Join-Path $out 'installer-checksums.json') -Raw|ConvertFrom-Json
          $p=Get-Content (Join-Path $out 'BUILD_PROVENANCE.json') -Raw|ConvertFrom-Json
          $actual=(Get-FileHash -LiteralPath (Join-Path $out $f.installerName) -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -cne $f.installerSha256 -or $f.sourceSha -cne $env:SOURCE_SHA -or
             ($env:LU_V1_RELEASE -eq '1' -and ($f.productVersion -cne '1.0.0' -or
              $f.appIdentity -cne 'org.lu.desktop' -or $p.productVersion -cne '1.0.0' -or
              $p.appIdentity -cne 'org.lu.desktop')) -or
             $f.browserManifestSha256 -cne $env:LU_BROWSER_MANIFEST_SHA256 -or
             $p.browserManifestSha256 -cne $env:LU_BROWSER_MANIFEST_SHA256 -or
             $p.browserRuntime -cne 'REVIEWED_AND_STAGED'){
            throw 'Installer/provenance/browser exact hash mismatch'
          }
          "C62B_SOURCE_SHA=$env:SOURCE_SHA" >> $env:GITHUB_STEP_SUMMARY
          "C62B_INSTALLED_BROWSER_MANIFEST_SHA256=$($f.browserManifestSha256)" >> $env:GITHUB_STEP_SUMMARY
          "C62B_INSTALLER_SHA256=$actual" >> $env:GITHUB_STEP_SUMMARY
          'Browser embedded from separate exact SHA256 review. No model tool grant or physical AMD test asserted.' >> $env:GITHUB_STEP_SUMMARY
      - name: Native Rust host independently recomputes the exact compiled reviewed-browser manifest AND all files
        shell: pwsh
        timeout-minutes: 60
        env:
          LU_C62_REVIEWED_RUNTIME_TEST: '1'
          LU_BROWSER_MANIFEST_SHA256: 'f2948f9ef9d2b5bbac8a60e146bd4a18a0714a615883faaa0139b8d5828e5cf3'
        run: |
          $ErrorActionPreference='Stop'
          # NSIS restores the checked-in alpha Tauri config after its release
          # build. Cargo test must reuse the exact successful current NSIS
          # resource map rather than the alpha map's absent historical CRT DLLs.
          $configPath=(Resolve-Path 'lu-desktop/src-tauri/tauri.conf.json').Path
          $original=[IO.File]::ReadAllText($configPath)
          try{
            $conf=ConvertFrom-Json -InputObject $original -AsHashtable
            if($env:LU_V1_RELEASE -eq '1'){
              $conf.productName='Lu'
              $conf.identifier='org.lu.desktop'
              $conf.version='1.0.0'
              $conf.app.windows[0].title='Lu'
            }else{
              $conf.productName='Lu Current Development Preview'
              $conf.identifier='org.lu.current.devpreview'
              $conf.version='0.2.0-rc.1'
              $conf.app.windows[0].title='Lu Current Development Preview (Unsigned)'
            }
            $conf.bundle.active=$false
            $conf.bundle.resources=@{
              'resources/lu-inference/llama-server.exe'='lu-inference/llama-server.exe'
              'resources/lu-inference/llama-server-vulkan.exe'='lu-inference/llama-server-vulkan.exe'
              'resources/lu-inference/manifest.json'='lu-inference/manifest.json'
              'resources/lu-native-codecs'='lu-native-codecs'
              'resources/lu-research/curl.exe'='lu-research/curl.exe'
              'resources/lu-browser'='lu-browser'
            }
            $resourceRoot=(Resolve-Path 'lu-desktop/src-tauri').Path
            foreach($src in @($conf.bundle.resources.Keys)){
              if(-not(Test-Path -LiteralPath (Join-Path $resourceRoot $src))){
                throw "Current NSIS staged resource missing before native test: $src"
              }
            }
            $browserManifest=Join-Path $resourceRoot 'resources/lu-browser/manifest.json'
            $browserHash=(Get-FileHash -LiteralPath $browserManifest -Algorithm SHA256).Hash.ToLowerInvariant()
            if($browserHash -cne $env:LU_BROWSER_MANIFEST_SHA256){
              throw 'Native Rust test input differs from independently approved browser manifest'
            }
            $conf|ConvertTo-Json -Depth 32|Set-Content -LiteralPath $configPath -Encoding utf8
            cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib native_browser_host::tests::c62_reviewed_runtime_exact_bytes_and_compiled_manifest -- --ignored --exact --nocapture
            if($LASTEXITCODE -ne 0){throw 'Actual Rust browser host rejected pinned review manifest or component'}
            cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib chat_store::tests::human_history_search_includes_current_and_other_books_without_recall_grants -- --exact --nocapture
            if($LASTEXITCODE -ne 0){throw 'Human history search acceptance failed'}
            # CP-11A genuine Windows cleanup regression. Both tests compile
            # against the same current desktop Rust source used by this NSIS.
            # Never accept a source-only mock in place of installed recovery.
            cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib active_checks::tests::cp11a_windows_exclusive_scratch_cleanup_releases_owned_directory_handle -- --exact --nocapture
            if($LASTEXITCODE -ne 0){throw 'Real Windows owned scratch cleanup regression failed'}
            cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib active_checks::tests::cp11a_windows_cleanup_preserves_preexisting_scratch_slot -- --exact --nocapture
            if($LASTEXITCODE -ne 0){throw 'Original preexisting scratch slot protection failed'}
          }finally{
            [IO.File]::WriteAllText($configPath,$original)
          }
          # --quiet uses the actual Git exit status and emits no output.
          # An unchanged file is success, not a nullable PowerShell string.
          & git diff --quiet --exit-code -- lu-desktop/src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){
            throw 'Native Rust test did not restore the source Tauri configuration'
          }
      - name: Genuine hosted Windows install / browser bytes / unified tabs / uninstall / AppData preservation
        shell: pwsh
        timeout-minutes: 24
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'lu-c62b-installed-browser'
          $f=Get-Content (Join-Path $out 'installer-checksums.json') -Raw|ConvertFrom-Json
          $evidence=Join-Path $out 'installed-c62b-original-evidence'
          $args=@{
            InstallerPath=(Join-Path $out $f.installerName)
            InstallerSha256=$f.installerSha256
            ExpectedLuSha256=$f.appSha256
            ExpectedEngineSha256=$f.engineSha256
            ExpectedVulkanSha256=$f.vulkanEngineSha256
            ExpectedResearchSha256=$f.researchClientSha256
            ExpectedBrowserManifestSha256=$f.browserManifestSha256
            ProfileIdentifier=$(if($env:LU_V1_RELEASE -eq '1'){'org.lu.desktop'}else{'org.lu.current.devpreview'})
            UninstallerName=$(if($env:LU_V1_RELEASE -eq '1'){'UninstallLu.exe'}else{'UninstallLuCurrentPreview.exe'})
            DisposableWindowsConfirmed=$true
            ExerciseInstalledGui=$true
            EvidenceDir=$evidence
          }
          & scripts/m3-windows-nsis-cycle.ps1 @args
          $cycleExit=$LASTEXITCODE
          $r=Get-Content (Join-Path $evidence 'm3-nsis-cycle.json') -Raw|ConvertFrom-Json
          # Always verify original real installation and data-preservation facts.
          # Do not relabel an inaccessible WebView UIA tree as a PASS.
          if($r.installer -cne 'PASS_REAL_NATIVE_PROCESS_EXIT' -or
             $r.installedApp -cne 'PASS_SHA256' -or
             $r.installedRealEngine -cne 'PASS_SHA256' -or
             $r.installedVulkanEngine -cne 'PASS_SHA256' -or
             $r.installedResearchClient -cne 'PASS_SHA256' -or
             $r.installedReviewedBrowser -cne 'PASS_EXACT_BROWSER_FILES_AND_REAL_BUNDLED_NODE' -or
             $r.uninstaller -cne 'PASS_REAL_NATIVE_PROCESS_EXIT' -or
             $r.profilePreservation -cne 'PASS_UNTOUCHED_APPDATA_SENTINEL' -or
             $r.packageRemoval -cne 'PASS_BINARIES_ABSENT' -or
             $r.installationStateUncertain -ne $false -or
             @($r.postUninstallResidue).Count -ne 0){
            throw 'Original actual Windows install/hash/browser/uninstall/data preservation not accepted'
          }
          if($cycleExit -eq 0 -and $r.installedUiSmoke -ceq 'PASS_INSTALLED_UNIFIED_TABS'){
            'Real hosted installed browser/native GUI tabs/uninstall: PASS.' >> $env:GITHUB_STEP_SUMMARY
          }elseif($env:LU_V1_RELEASE -eq '1' -and $cycleExit -eq 3 -and
                  $r.installedUiSmoke -ceq 'FAIL_INSTALLED_UI_EVIDENCE'){
            # User-approved Lu Core v1 release acceptance is a NORMAL installed
            # GUI, not a claim that all WebView2 UIA navigation is qualified.
            # The prior exact SHA failed solely because the hosted UIA tree was
            # EMPTY even though a screenshot showed the Lu chat and Settings.
            # This exception is limited to precisely that captured condition.
            # Actual window ownership, source/binary integrity, uninstall and
            # AppData protection remain mandatory; no invented UIA PASS.
            $uiDir=Join-Path $evidence 'p0-installed-ui'
            $ui=Get-Content (Join-Path $uiDir 'p0-installed-ui.json') -Raw|ConvertFrom-Json
            $uia=Get-Content (Join-Path $uiDir 'uia-missing-Settings.json') -Raw|ConvertFrom-Json
            $png=Join-Path $uiDir 'failed-missing-Settings.png'
            if($ui.nativeWindow -cne 'PASS_WIN32_WINDOW_HANDLE' -or
               $ui.uiAutomationProcessIdentity -cne 'PASS_EXACT_OS_PROCESS' -or
               $ui.result -cne 'NOT_ACCEPTED' -or
               $ui.singleSettingsEntry -cne 'NOT_TESTED' -or
               -not(@($ui.errors) -contains 'Installed WebView2 did not expose UI Automation element: Settings') -or
               $uia.phase -cne 'missing-Settings' -or
               $uia.inspectedCount -ne 0 -or $uia.capturedCount -ne 0 -or
               -not(Test-Path -LiteralPath $png -PathType Leaf)){
              throw 'Lu v1.0 requires exact native window + missing-UIA evidence, not a waived GUI failure'
            }
            [byte[]]$image=[IO.File]::ReadAllBytes($png)
            $prefix=[byte[]]$image[0..7]
            if($image.Length -lt 30000 -or
               [Convert]::ToHexString($prefix) -cne '89504E470D0A1A0A'){
              throw 'Lu v1.0 genuine installed visible-GUI screenshot missing or malformed'
            }
            [byte[]]$widthBytes=@($image[19],$image[18],$image[17],$image[16])
            [byte[]]$heightBytes=@($image[23],$image[22],$image[21],$image[20])
            $width=[BitConverter]::ToUInt32($widthBytes,0)
            $height=[BitConverter]::ToUInt32($heightBytes,0)
            if($width -lt 800 -or $height -lt 500 -or $width -gt 8192 -or $height -gt 8192){
              throw 'Lu v1.0 GUI image has invalid screen dimensions'
            }
            [ordered]@{
              schema='lu-v1-installed-visible-gui-receipt-v1'
              sourceSha=$env:GITHUB_SHA
              originalInstalledUiSmoke='FAIL_INSTALLED_UI_EVIDENCE'
              originalUIAResult='NOT_ACCEPTED'
              nativeWindow=$ui.nativeWindow
              uiAutomationProcessIdentity=$ui.uiAutomationProcessIdentity
              observedUIAElements=0
              missingControl='Settings'
              screenshotSha256=(Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant()
              screenshotWidth=$width;screenshotHeight=$height
              installerSha256=$f.installerSha256
              installedBrowser=$r.installedReviewedBrowser
              installedApp=$r.installedApp
              uninstall=$r.uninstaller
              dataPreserved=$r.profilePreservation
              visibleGuiStatus='WINDOW_AND_SCREENSHOT_PRESENT_INTERACTIVE_CONTROLS_UNVERIFIED'
            }|ConvertTo-Json -Depth 5 |
              Set-Content -LiteralPath (Join-Path $out 'v1-visible-gui-limited-acceptance.json') -Encoding utf8
            'Lu v1 hosted installed window and PNG screen PRESENT; UIA zero elements, GUI interaction UNVERIFIED. Native install/hash/reviewed-browser/uninstall/AppData: PASS. This is a disclosed release limitation, not UIA test PASS.' >> $env:GITHUB_STEP_SUMMARY
          }else{
            throw "Installed GUI/NSIS qualification failed outside documented v1 UIA-zero case (exit=$cycleExit; ui=$($r.installedUiSmoke))"
          }
      - name: Preserve real current native NSIS with reviewed browser and original OS receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-C62B-Reviewed-Browser-NSIS-${{ github.sha }}
          path: ${{ runner.temp }}/lu-c62b-installed-browser/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
