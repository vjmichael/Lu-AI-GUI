  genuine-local-qwen:
    needs: exact-source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LU_E1_P07_LLAMA_PORT: '18972'
      # The genuine first tool is a mandatory native observation; never
      # use the transport's fail-closed unconstrained/raw default.
      LU_E1_P07_RESPONSE_PROTOCOL: json_schema
      MODEL_SHA256: 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual independent FFprobe and pin Lu source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p c4-qwen-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg cmake
          command -v git
          command -v ffprobe
          echo "LU_E1_P07_GIT=$(command -v git)" >> "$GITHUB_ENV"
          echo "LU_E1_P07_FFPROBE=$(command -v ffprobe)" >> "$GITHUB_ENV"
      - name: Compile pinned actual llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b12143 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/c4-llama-source"
          test "$(git -C "$RUNNER_TEMP/c4-llama-source" rev-parse HEAD)" = 2bc46baa9207d098d03741ac394e7faaf1a955b6
          cmake -S "$RUNNER_TEMP/c4-llama-source" -B "$RUNNER_TEMP/c4-llama-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/c4-llama-build" --target llama-server --parallel 3
          sha256sum "$RUNNER_TEMP/c4-llama-build/bin/llama-server" \
            > c4-qwen-evidence/llama-engine-sha256.txt
      - name: Pin actual Qwen3 0.6B GGUF bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 \
            https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf \
            -o "$RUNNER_TEMP/c4-qwen.gguf"
          printf '%s  %s\n' "$MODEL_SHA256" "$RUNNER_TEMP/c4-qwen.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/c4-qwen.gguf" > c4-qwen-evidence/model-sha256.txt
      - name: Start actual offline GGUF local server
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/c4-llama-build/bin/llama-server" \
            -m "$RUNNER_TEMP/c4-qwen.gguf" --host 127.0.0.1 \
            --port "$LU_E1_P07_LLAMA_PORT" -c 8192 -ngl 0 \
            > c4-qwen-evidence/llama-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/c4-llama.pid"
          ready=0
          for i in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/c4-llama.pid")" 2>/dev/null; then exit 1; fi
            if curl -fsS --max-time 2 "http://127.0.0.1:$LU_E1_P07_LLAMA_PORT/health" \
              > c4-qwen-evidence/health.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
      - name: Provision fixed root-owned reviewed Git and FFprobe admission for actual GGUF tool execution
        shell: bash
        run: |
          set -euo pipefail
          # The real model's request MUST reach the same production SEC-06C
          # custody boundary as a human-reviewed native desktop request.
          # Never fall back to an unmanaged same-UID Git/FFprobe subprocess.
          python3 -m py_compile             scripts/lu-sec06c-owned-git-launcher.py             scripts/lu-sec06c-owned-git-worker.py             scripts/lu-sec06c-owned-probe-launcher.py             scripts/lu-sec06c-owned-probe-worker.py             scripts/lu-sec06c-owned-kernel-manager.py
          sudo install -d -o root -g root -m 0755 /usr/libexec/lu
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-git-launcher.py /usr/libexec/lu/lu-sec06c-launch-git
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-git-worker.py /usr/libexec/lu/lu-sec06c-owned-git-worker
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-probe-launcher.py /usr/libexec/lu/lu-sec06c-launch-probe
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-probe-worker.py /usr/libexec/lu/lu-sec06c-owned-probe-worker
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-kernel-manager.py /usr/libexec/lu/lu-sec06c-owned-kernel-manager
          printf '%s ALL=(root) NOPASSWD: /usr/libexec/lu/lu-sec06c-launch-git *\n' "$USER" | sudo tee /etc/sudoers.d/lu-c4-gguf-git >/dev/null
          printf '%s ALL=(root) NOPASSWD: /usr/libexec/lu/lu-sec06c-launch-probe *\n' "$USER" | sudo tee /etc/sudoers.d/lu-c4-gguf-probe >/dev/null
          sudo chmod 0440 /etc/sudoers.d/lu-c4-gguf-git /etc/sudoers.d/lu-c4-gguf-probe
          sudo visudo -cf /etc/sudoers.d/lu-c4-gguf-git
          sudo visudo -cf /etc/sudoers.d/lu-c4-gguf-probe
          test "$(id -u)" -ne 0
          test "$(stat -c %u /usr/libexec/lu/lu-sec06c-launch-git)" = 0
          test "$(stat -c %u /usr/libexec/lu/lu-sec06c-launch-probe)" = 0
      - name: Prove local b12143 llama.cpp enforces actual model grammar before native tool acceptance
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=benchmarks/e1 python3 -m unittest -v test_e1_p07_llama_completion \
            2>&1 | tee c4-qwen-evidence/typed-grammar-source-contract.log
          PYTHONPATH=benchmarks/e1 python3 - <<'PY'
          import os
