name: Lu CORE-MERGE-C4 one-SHA native security recovery and real Qwen

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Manual/reusable only. The existing REPO-01 workflow holds the one-time
# exact PR #235 SHA admission marker; no independent heavy PR trigger.
concurrency:
  group: lu-core-merge-c4-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  exact-source-admission:
    if: >-
      github.event.pull_request.number == 235 &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.ref == 'lu/p0-next-typed-criterion-review-20261113' &&
      contains(github.event.pull_request.body, format('LU_CORE_C4_GROUP_SHA={0}', github.event.pull_request.head.sha)) &&
      !contains(github.event.changes.body.from, format('LU_CORE_C4_GROUP_SHA={0}', github.event.pull_request.head.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admit only exact unmodified source and one human-marked SHA
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          grep -Fxq "LU_CORE_C4_GROUP_SHA=$EXACT_HEAD" <<< "$PR_BODY"
          node scripts/verify-source-tree.mjs
          mkdir -p c4-source-evidence
          git rev-parse HEAD > c4-source-evidence/commit.txt
          sha256sum source-tree.lock.json > c4-source-evidence/source-lock-sha256.txt
          printf 'C4_SHA=%s\nADMISSION=EXACT_SHA_ONLY\n' "$EXACT_HEAD" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-c4-source-admission
          path: c4-source-evidence/
          retention-days: 14
          if-no-files-found: warn

  native-planner-ipc-desktop:
    needs: exact-source-admission
    runs-on: ${{ matrix.os }}
    timeout-minutes: 145
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux Tauri 2 native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libssl-dev patchelf cmake
      - name: Windows CI-only nonfunctional engine resource placeholders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'NOT_AN_ENGINE_CI_PLACEHOLDER' -NoNewline
          }
      - name: Exact SHA and native source-contract regressions
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p c4-native-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs
          node --test \
            lu-desktop/tests/agent01g-approved-step-integration.test.mjs \
            lu-desktop/tests/agent01h-next-step-preview.test.mjs \
            lu-desktop/tests/agent01k-independent-recovery.test.mjs \
            lu-desktop/tests/reviewed-tool-feedback.test.mjs \
            lu-desktop/tests/task-board.test.mjs \
            scripts/core01f-bridge-review.test.mjs \
            scripts/core-merge-c1-family-contracts.test.mjs \
            lu-desktop/tests/browser-native-authorization.test.mjs \
            lu-desktop/tests/browser-model-read.test.mjs \
            lu-desktop/tests/browser-research-evidence.test.mjs \
            lu-desktop/tests/browser-visibility-settings.test.mjs \
            lu-desktop/tests/research-citation-enforcement.test.mjs \
            lu-desktop/tests/research-roadmap-acceptance.test.mjs \
            tests/lu-browser-worker.test.mjs \
            lu-desktop/tests/reader-desktop.test.mjs \
            lu-desktop/tests/p06-observe-privacy.test.mjs \
            lu-desktop/tests/workspace-desktop.test.mjs \
            lu-desktop/tests/image-edit-intent.test.mjs \
            lu-desktop/tests/r21-image-ux.test.mjs \
            lu-desktop/tests/p08-archive-split.test.mjs \
            2>&1 | tee c4-native-evidence/frontend-contracts.log
      - name: Current React desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          cd lu-desktop
          npm ci --no-audit --no-fund
          npm run build
      - name: Original Rust model/tool Protobuf, plan and receipt regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --test native_agent_tool_turn -- --nocapture \
            2>&1 | tee c4-native-evidence/typed-tool-turn.log
          # C1/C2: original TOOLS-05/06/08 hostile cases, same protected
          # registry and current no-replay authority on Windows and Linux.
          for suite in native_schema_validation native_environment_discovery native_stream_loop; do
            cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
              --test "$suite" -- --nocapture \
              2>&1 | tee "c4-native-evidence/${suite}.log"
          done
          # C2: original human schema/data and one fixed program are the
          # entire read-only utility authority. The model is never the grant.
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib native_core_utility_turn::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/c2-core-utility-turn.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib agent_reviewed_broker_bridge::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/plan-native-broker.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib agent_deliverable_receipts::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/independent-deliverables.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --test host_reviewed_route_durable -- --nocapture \
            2>&1 | tee c4-native-evidence/durable-tool-ipc.log
          # C1/C2: original G02 host-owned Workspace inference was inherited
          # byte-exact. Re-run its original authority and lifecycle tests;
          # source continuity alone cannot establish accepted behavior.
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib workspace_inference::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/g02-host-owned-inference.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib workspace::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/g02-workspace-lifecycle.log
          # Recovered original OPMEM harness compiles the SAME production
          # module in isolation from the full inference-worker API on both
          # Windows and Linux. This does not admit a tool or a new workspace.
          cargo test --manifest-path tests/operational-memory-harness/Cargo.toml \
            --test operational_memory -- --nocapture \
            2>&1 | tee c4-native-evidence/opmem-original-independent.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --test operational_memory -- --nocapture \
            2>&1 | tee c4-native-evidence/opmem-original-integrated.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --test native_workspace_read_turn -- --nocapture \
            2>&1 | tee c4-native-evidence/original-workspace-tool-turn.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --test native_archive_tree_authority -- --nocapture \
            2>&1 | tee c4-native-evidence/original-archive-authority.log
      - name: Original compiled desktop command and task completion reconciliation
        # Independent check: still gather native host diagnostics after a
        # separate lu-core test fails. The job remains FAILED on that test.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
            2>&1 | tee c4-native-evidence/tauri-check.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
            --lib project_task_verified_evidence::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/task-criterion-reconciliation.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
            --lib browser_model_desktop::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/browser-original-contracts.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
            --lib environment_context::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/ambient-host-runtime-context.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
            --lib core_utility_desktop::tests -- --nocapture \
            2>&1 | tee c4-native-evidence/c2-desktop-utility-routing.log
      - name: C1 exact-source Browser Reader Observe original native behavior
        # Keep independent results even if a different family fails. Each
        # original test runs, is logged and contributes to a failed job status.
        # This is NOT headed Chromium, scanned-PDF OCR, or installed WGC proof.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4-native-evidence
          failures=0
          run_case() {
            local name="$1"
            shift
            if "$@" 2>&1 | tee "c4-native-evidence/c1-${name}.log"; then
              echo "C1_NATIVE_${name}=PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              failures=$((failures+1))
              echo "C1_NATIVE_${name}=FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          core=(cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml)
          # Original Browser model codec, supervision, native origin/firewall,
          # citation evidence, restart and bounded web research behaviors.
          run_case browser-units "${core[@]}" --lib browser_ -- --nocapture
          for suite in web_research_acceptance web_research_citation_acceptance web_research_roadmap_acceptance; do
            run_case "browser-${suite}" "${core[@]}" --test "$suite" -- --nocapture
          done
          run_case browser-evidence "${core[@]}" --lib web_research_ -- --nocapture
          # Original Reader text/Office/PDF parser, immutable page/source,
          # format, authorizer, and source identity tests. Actual scanned
          # PDF OCR fixture requires separately admitted real local binaries.
          run_case reader-units "${core[@]}" --lib native_reader_ -- --nocapture
          run_case reader-ocr "${core[@]}" --lib native_ocr::tests -- --nocapture
          # Preserve original P06 consent, forgetting, egress, source purity,
          # process-loss handling and local-only image admission checks.
          run_case observe-units "${core[@]}" --lib native_observe_ -- --nocapture
          run_case observe-awareness "${core[@]}" --lib native_awareness_lane::tests -- --nocapture
          run_case observe-gui-identity "${core[@]}" --lib native_gui_verification::tests -- --nocapture
          run_case observe-p06 "${core[@]}" --lib p06_ -- --nocapture
          run_case observe-durable-provenance "${core[@]}" --lib observe_session_provenance_is_durable_after_stop_and_note_forget -- --nocapture
          run_case observe-private-frame "${core[@]}" --lib native_local_observe_image_pipe_is_private_one_shot_bounded_and_not_in_sqlite -- --nocapture
          run_case observe-host-image "${core[@]}" --lib os_owned_image_pipe_enters_real_png_admission_and_remains_off_network -- --nocapture
          run_case observe-reject-truncated "${core[@]}" --lib malformed_or_truncated_observed_pixels_never_produce_image_proof -- --nocapture
          exit "$failures"
      - name: C1 original desktop Reader and Observe source authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4-native-evidence
          failures=0
          for family in reader_desktop observe_desktop; do
            if cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml \
              --lib "${family}::tests" -- --nocapture \
              2>&1 | tee "c4-native-evidence/c1-${family}.log"; then
              echo "C1_DESKTOP_${family}=PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              failures=$((failures+1))
              echo "C1_DESKTOP_${family}=FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failures"
      - name: C1 original protected Linux P06 finite-operation broker admission
        # Root-owned installed SEC-06C sources, never same-UID fallback.
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/lu-sec06c-owned-native-launcher.py \
            scripts/lu-sec06c-owned-native-worker.py \
            scripts/lu-sec06c-owned-kernel-manager.py \
            scripts/lu-sec06c-owned-git-launcher.py \
            scripts/lu-sec06c-owned-git-worker.py
          test "$(id -u)" -ne 0
          test -f /usr/bin/python3
          sudo install -d -o root -g root -m 0755 /usr/libexec/lu
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-kernel-manager.py /usr/libexec/lu/lu-sec06c-owned-kernel-manager
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-native-launcher.py /usr/libexec/lu/lu-sec06c-launch-native
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-native-worker.py /usr/libexec/lu/lu-sec06c-owned-native-worker
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-git-launcher.py /usr/libexec/lu/lu-sec06c-launch-git
          sudo install -o root -g root -m 0755 scripts/lu-sec06c-owned-git-worker.py /usr/libexec/lu/lu-sec06c-owned-git-worker
          # Only the two exact reviewed hostile Python acceptance strings
          # exist in this ephemeral root-owned runner; not an installer part.
          printf 'LU_P06_ACCEPTANCE_ONLY_V1\n' | sudo tee /usr/libexec/lu/lu-sec06c-p06-acceptance-marker >/dev/null
          sudo chown root:root /usr/libexec/lu/lu-sec06c-p06-acceptance-marker
          sudo chmod 0444 /usr/libexec/lu/lu-sec06c-p06-acceptance-marker
          printf '%s ALL=(root) NOPASSWD: /usr/libexec/lu/lu-sec06c-launch-native *\n' "$USER" | sudo tee /etc/sudoers.d/lu-c4-p06-native >/dev/null
          printf '%s ALL=(root) NOPASSWD: /usr/libexec/lu/lu-sec06c-launch-git *\n' "$USER" | sudo tee /etc/sudoers.d/lu-c4-p06-git >/dev/null
          sudo chmod 0440 /etc/sudoers.d/lu-c4-p06-native /etc/sudoers.d/lu-c4-p06-git
          sudo visudo -cf /etc/sudoers.d/lu-c4-p06-native
          sudo visudo -cf /etc/sudoers.d/lu-c4-p06-git
          test "$(stat -c %u /usr/libexec/lu/lu-sec06c-launch-native)" = 0
          test "$(stat -c %u /usr/libexec/lu/lu-sec06c-p06-acceptance-marker)" = 0
          test "$(cat /usr/libexec/lu/lu-sec06c-p06-acceptance-marker)" = LU_P06_ACCEPTANCE_ONLY_V1
      - name: C1 original P06A-D installed Git and Python, watchdog and verified-stop contracts
        # Preserve original independent process tests, not merely Cargo's
        # zero-ignored default. A failed earlier family cannot hide this gap.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4-native-evidence
          python - <<'PY'
          import os,shutil,sys
          git=shutil.which("git")
          if not git: raise RuntimeError("Actual installed Git is required")
          for key,path in {
            "LU_E1_P06_GIT":os.path.realpath(git),
            "LU_E1_P06_PYTHON":os.path.realpath("/usr/bin/python3") if sys.platform=="linux" else os.path.realpath(sys.executable),
          }.items():
            if not os.path.isabs(path) or not os.path.isfile(path):
              raise RuntimeError("Genuine native reviewed executable missing: "+key)
            with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as output:
              output.write(key+"="+path+"\n")
          PY
          # GitHub's GITHUB_ENV takes effect only in subsequent steps.
          # These original real-binary assertions run in this SAME step.
          # Re-resolve the two verified, host-installed binaries into this
          # shell's environment; never supply a test-side fake executable.
          export LU_E1_P06_GIT="$(python -c 'import os,shutil; p=shutil.which("git"); print(os.path.realpath(p) if p else "")')"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export LU_E1_P06_PYTHON="$(readlink -f /usr/bin/python3)"
            export LU_SEC06C_BROKER_DEBUG=1
          else
            export LU_E1_P06_PYTHON="$(python -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          fi
          test -f "$LU_E1_P06_GIT" && test -f "$LU_E1_P06_PYTHON"
          failures=0
          run_original() {
            local name="$1"
            local count="$2"
            shift 2
            if "$@" 2>&1 | tee "c4-native-evidence/c1-${name}.log" &&
              grep -Eq "test result: ok\\. ${count} passed; 0 failed;" "c4-native-evidence/c1-${name}.log"; then
              echo "C1_ORIGINAL_${name}=PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              failures=$((failures+1))
              echo "C1_ORIGINAL_${name}=FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          core=(cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            core+=(--features p06-protected-acceptance)
          fi
          run_original p06b-real-version 6 "${core[@]}" --lib native_app_version_execution::tests -- --ignored --nocapture
          run_original p06d-real-git 5 "${core[@]}" --lib native_app_typed_git::tests -- --ignored --nocapture
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            run_original p06-finite-denials 1 \
              cargo test --locked --manifest-path src-tauri/lu-win-worker-job/Cargo.toml \
              --features p06-protected-acceptance --lib \
              p06_acceptance_only_two_exact_python_operations_not_generic_code -- --nocapture
          fi
          run_original llama-watchdog 1 "${core[@]}" --lib persistent_llama_backend::tests::original_watchdog_kills_exact_owned_child_even_when_decoder_blocks -- --nocapture
          run_original llama-slots 1 "${core[@]}" --lib persistent_llama_backend::tests::original_slot_verification_rejects_busy_multiple_and_forged_idleness -- --nocapture
          exit "$failures"
      - name: C1 original Windows WGC frame redaction and OS identity worker tests
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4-native-evidence
          # This historical standalone worker has no committed Cargo.lock.
          # Do not pretend its dependency graph is pinned by the Core lock.
          cargo test --manifest-path src-tauri/lu-observe-capture-worker/Cargo.toml \
            --bin lu-observe-capture-worker frame_geometry_tests -- --nocapture \
            2>&1 | tee c4-native-evidence/c1-original-windows-wgc-worker.log
          echo 'C1_WGC_UNIT=SOURCE_TEST_ONLY_NOT_PHYSICAL_CAPTURE' >> "$GITHUB_STEP_SUMMARY"
      - name: Current UI source and typed-Protobuf history check after native compilation
        # Keep collecting the original frontend receipt even if Rust fails;
        # never suppress the failed status in final grouped reconciliation.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd lu-desktop && npm run check) 2>&1 | tee c4-native-evidence/desktop-ui-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-c4-native-${{ matrix.os }}
          path: c4-native-evidence/
          retention-days: 14
          if-no-files-found: warn

  original-security-recovery:
    needs: exact-source-admission
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce original source and run actual journal/recovery tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p c4-recovery-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib agent_host_scheduler::tests -- --nocapture \
            2>&1 | tee c4-recovery-evidence/scheduler.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib agent_os_custody::tests -- --nocapture \
            2>&1 | tee c4-recovery-evidence/original-os-custody.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib agent_continuation_intent::tests -- --nocapture \
            2>&1 | tee c4-recovery-evidence/one-use-recovery.log
          cargo test --manifest-path lu-desktop/tests/native-reviewed-recovery/Cargo.toml \
            --lib reviewed_app_recovery::tests -- --nocapture \
            2>&1 | tee c4-recovery-evidence/task-journal-restart.log
      - name: Original kernel Win32 Job Object descendant and restart acceptance
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-win-worker-job/Cargo.toml \
            --lib agent01l_kernel_job_tests -- --nocapture \
            2>&1 | tee c4-recovery-evidence/windows-job-kernel.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib native_background_process::tests::agent01l_real_git_job_attests_original_turn_and_reopens_without_replay \
            -- --nocapture 2>&1 | tee c4-recovery-evidence/windows-git-restart.log
      - name: Linux escaped process-group negative control
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/e1/e1_p08_setsid_escape_probe.py \
            2>&1 | tee c4-recovery-evidence/linux-killpg-escape.log
          grep -Fq 'E1_P08_GROUP_ESCAPE_PROVEN=1' \
            c4-recovery-evidence/linux-killpg-escape.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-c4-recovery-${{ matrix.os }}
          path: c4-recovery-evidence/
          retention-days: 14
          if-no-files-found: warn

  linux-real-cgroup:
    needs: exact-source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source, kernel cgroup and original finite root-owned broker preflight
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p c4-linux-kernel-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs
          test -f /sys/fs/cgroup/cgroup.controllers
          cat /proc/self/cgroup > c4-linux-kernel-evidence/cgroup.txt
          python3 -m py_compile \
            scripts/lu-sec06c-owned-git-launcher.py \
            scripts/lu-sec06c-owned-git-worker.py \
            scripts/lu-sec06c-owned-kernel-manager.py \
            benchmarks/e1/agent01l_cgroup_escape_crash_acceptance.py
          cargo build --locked --manifest-path src-tauri/lu-win-worker-job/Cargo.toml \
            --features e1-p08-crash-fixture \
            --bin lu-linux-cgroup-guard --bin lu-e1-p08-linux-cgroup-crash-parent
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib sec06c --no-run
      - name: Real delegated kernel cgroup survives host kill and reaps escaped descendant
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/e1/agent01l_cgroup_escape_crash_acceptance.py \
            --guard "$GITHUB_WORKSPACE/src-tauri/lu-win-worker-job/target/debug/lu-linux-cgroup-guard" \
            --parent "$GITHUB_WORKSPACE/src-tauri/lu-win-worker-job/target/debug/lu-e1-p08-linux-cgroup-crash-parent" \
            2>&1 | tee c4-linux-kernel-evidence/kernel-crash-escape.log
          grep -Fq 'AGENT01L_NATIVE_CGROUP_ESCAPED_DESCENDANT_PASS=1' \
            c4-linux-kernel-evidence/kernel-crash-escape.log
      - name: Original native Git worker under delegated cgroup and restart/replay denial
        shell: bash
        env:
          LU_AGENT01L_TEST_CGROUP_GUARD: ${{ github.workspace }}/src-tauri/lu-win-worker-job/target/debug/lu-linux-cgroup-guard
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib native_background_process::tests::agent01l_linux_real_git_cgroup_custody_after_restart \
            -- --ignored --nocapture \
            2>&1 | tee c4-linux-kernel-evidence/native-cgroup-git-restart.log
          grep -Fq 'test result: ok. 1 passed; 0 failed;' \
            c4-linux-kernel-evidence/native-cgroup-git-restart.log
      - name: Fail closed on absent cgroup delegation
        if: failure()
        shell: bash
        run: |
          if grep -Fq 'AGENT01L_CGROUP_DELEGATION_NOT_AVAILABLE=1' c4-linux-kernel-evidence/kernel-crash-escape.log 2>/dev/null; then
            echo 'Delegated cgroup-v2 kernel capability unavailable: real Linux custody is NOT accepted.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Original Linux kernel/native or finite root-owned worker acceptance FAILED or did not run. See original logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-c4-linux-real-kernel-custody
          path: c4-linux-kernel-evidence/
          retention-days: 14
          if-no-files-found: warn

  linux-original-root-owned-git:
