name: IDE P05 B3 native saved-project search regression
on:
  push:
    branches: ['ide/p05-b3-project-search-20261107']
    paths:
      - 'ide/docs/IDE_P05_B3_PROJECT_SEARCH_PORT_20261107.md'
      - '.github/workflows/ide-p05-b3-installed-native.yml'
      - 'ide/app/**'
      - 'ide/host/**'
      - 'ide/PROJECT_STATE.md'
      - 'ide/CHANGELOG.md'
      - '.github/workflows/ide-p05-b3-native-ci.yml'
  pull_request:
    paths:
      - 'ide/app/**'
      - 'ide/host/**'
      - '.github/workflows/ide-p05-b3-native-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-b3-source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Confirm exact source and original reviewed lock blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD:ide/app/src-tauri/Cargo.lock)" = "87d0045a4be1c78651f080300aba71c14dbe1f30"
          test "$(git rev-parse HEAD:ide/app/package-lock.json)" = "dfe4412bfacfc22ad1149f5213f4a26aa49b4067"
          test "$(git hash-object ide/app/src-tauri/Cargo.lock)" = "$(git rev-parse HEAD:ide/app/src-tauri/Cargo.lock)"
          echo "P05_B3_RELEASE_GRAPH=P06_REVIEWED_LOCK_BYTES_UNCHANGED"
      - name: Install native Linux WebKit build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Host source regression and Rust format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ide/host/Cargo.toml -- --check
          cargo test --manifest-path ide/host/Cargo.toml --all-targets
      - name: Actual standalone E2 frontend tests and bundling
        working-directory: ide/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Actual native desktop Tauri type-check with pinned lock
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path ide/app/src-tauri/Cargo.toml --lib --locked
      - name: Fixed scope evidence
        run: |
          echo "P05_B3_NATIVE_SOURCE_CI=PASS"
          case "${{ matrix.os }}" in
            ubuntu-24.04) echo "P05_B3_UBUNTU24_NATIVE_SOURCE=PASS" ;;
            ubuntu-26.04) echo "P05_B3_UBUNTU26_DIAGNOSTIC_SOURCE=PASS" ;;
            windows-2022) echo "P05_B3_WINDOWS2022_NATIVE_SOURCE=PASS" ;;
            *) exit 1 ;;
          esac
          echo "P05_B3_SIGNED_RELEASE_AND_INSTALLED_EQUIVALENCE=NOT_ACCEPTED"
