name: Lu v1.0 Observe and Learn — native policy
on:
  pull_request:
    paths:
      - 'src-tauri/lu-core/src/native_observe_learn.rs'
      - 'src-tauri/lu-core/src/native_observe_ansf.rs'
      - 'src-tauri/lu-core/src/native_observe_scope.rs'
      - 'src-tauri/lu-core/src/native_gui_verification.rs'
      - 'src-tauri/lu-observe-capture-worker/**'
      - 'docs/LU_OBSERVATION_SCOPE_AND_GUI_VERIFICATION_V1.md'
      - 'lu-desktop/**'
      - 'src-tauri/lu-core/src/lib.rs'
      - 'docs/LU_OBSERVE_LEARN_V1.md'
      - 'docs/LU_NATIVE_TOOLS_IMPLEMENTATION_LEDGER.md'
      - 'docs/LU_R22_STRUCTURED_CHAT_AND_ALPHA_V1_ROADMAP.md'
      - '.github/workflows/lu-v1-observe-learn.yml'
      - 'source-tree.lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
      - run: grep -Fx 'pub mod native_observe_learn;' src-tauri/lu-core/src/lib.rs
  native-linux:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_observe_learn::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_observe_ansf::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_observe_scope::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_gui_verification::tests -- --nocapture
      - shell: bash
        run: git diff --exit-code -- src-tauri/lu-core/Cargo.lock
  native-windows:
    needs: source
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_observe_learn::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_observe_ansf::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_observe_scope::tests -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_gui_verification::tests -- --nocapture
      - shell: bash
        run: git diff --exit-code -- src-tauri/lu-core/Cargo.lock
  desktop-ui:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: lu-desktop
        run: |
          npm ci
          npm run build
          npm run check
          npm run test:ui
  desktop-windows:
    needs: [source, desktop-ui]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage inert compile-only engine placeholders
        shell: pwsh
        run: |
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'NOT_AN_ENGINE_CI_PLACEHOLDER' -NoNewline
          }
      - working-directory: lu-desktop
        run: |
          npm ci
          npm run build
      - name: Compile Windows.Graphics.Capture picker and D3D11 one-shot worker
        run: cargo build --release --manifest-path src-tauri/lu-observe-capture-worker/Cargo.toml
      - name: Pin compiled Windows capture worker digest for desktop host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $worker='src-tauri/lu-observe-capture-worker/target/release/lu-observe-capture-worker.exe'
          if (!(Test-Path -LiteralPath $worker)) {throw 'Real WGC worker not built'}
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $worker).Hash.ToLowerInvariant()
          if ($sha.Length -ne 64) {throw 'Unusable worker digest'}
          Add-Content -Path $env:GITHUB_ENV -Value "LU_OBSERVE_CAPTURE_WORKER_SHA256=$sha"
          Set-Content -LiteralPath 'lu-observe-capture-worker.sha256' -Value $sha -NoNewline
      - run: cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib observe_desktop::tests -- --nocapture
      - name: Publish compiled Windows picker for isolated native evaluation
        uses: actions/upload-artifact@v4
        with:
          name: lu-observe-capture-win-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/lu-observe-capture-worker/target/release/lu-observe-capture-worker.exe
            lu-observe-capture-worker.sha256
      - name: Check desktop source lockfile
        shell: bash
        run: git diff --exit-code -- lu-desktop/src-tauri/Cargo.lock
