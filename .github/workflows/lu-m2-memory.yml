name: Lu M2 ANSF Goals and Clarification Native Acceptance
on:
  push:
    branches:
      - lu/m2-ansf-goals-clarifications-20261107
  pull_request:
    paths:
      - 'src-tauri/lu-core/src/ansf*.rs'
      - 'lu-desktop/src-tauri/src/chat_store.rs'
      - 'lu-desktop/src-tauri/src/memory_desktop.rs'
      - 'lu-desktop/src-tauri/src/lib.rs'
      - 'lu-desktop/web/main.jsx'
      - 'lu-desktop/tests/m2-ansf-memory.test.mjs'
      - '.github/workflows/lu-m2-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-source-tree.mjs
      - run: node --test lu-desktop/tests/m2-ansf-memory.test.mjs
  native:
    needs: ui-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_goals::tests -- --nocapture
      - run: cargo test --manifest-path lu-desktop/tests/native-chat/Cargo.toml -- --nocapture
      - run: cargo test --manifest-path lu-desktop/tests/native-auth/Cargo.toml real_persisted_user_turn_requires_separate_host_approval_before_native_read
