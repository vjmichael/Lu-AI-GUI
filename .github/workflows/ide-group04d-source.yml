# Exact Windows Tauri source gate uses CI-only diagnostic ICO; no installed release asset.
# Third source gate; exact formatter repaired in developer desktop.
# Exact native-source rerun after independently reported supervisor formatting correction.
# Recheck exact developer source after native Rustfmt and renderer safety updates.
name: IDE G04D guarded variable inspection source and native compiler (not release)
on:
  push:
    branches: [ide/group04d-native-inspection-20261110]
    paths: ['.github/workflows/ide-group04d-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ide-g04d-sourcedev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Exact-source formatting and consent boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo fmt --manifest-path ide/host/Cargo.toml -- --check
          cargo fmt --manifest-path ide/supervisor/Cargo.toml -- --check
          cargo fmt --manifest-path ide/app/src-tauri/Cargo.toml -- --check
          node --test ide/app/tests/ide_group04d_native_inspection.test.mjs
      - name: Source-level Rust protocol, supervisor and Linux release check
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/host/Cargo.toml --features dev046c-ci-control --lib dap_session
          cargo test --manifest-path ide/supervisor/Cargo.toml --features dap-transport --lib debug_control_dispatch
          cargo check --manifest-path ide/supervisor/Cargo.toml --features dap-transport,linux-worker
          cargo check --release --manifest-path ide/supervisor/Cargo.toml --features dap-transport,linux-worker
          echo 'IDE_G04D_LINUX_SOURCE=PASS_NOT_KERNEL_OR_INSTALLED'
  windows-native-source:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Exact-source and nonexecutable source consent boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'DENIED: exact reviewed head changed' }
          cargo fmt --manifest-path ide/host/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: host Rustfmt failure' }
          cargo fmt --manifest-path ide/supervisor/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: supervisor Rustfmt failure' }
          cargo fmt --manifest-path ide/app/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: desktop Rustfmt failure' }
          node --test ide/app/tests/ide_group04d_native_inspection.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: privilege/redaction boundary changed' }
          # Syntax ONLY: a headless runner must never simulate a human click.
          $tokens=$null
          $parseErrors=$null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ide/app/fixtures/Test-DEV046D-PhysicalHumanConsent.ps1').Path,
            [ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'DENIED: physical human operator script invalid' }
      - name: Compile real protected Windows native scope bridge, original receipts and dev-only desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $features='dap-transport,protected-recovery-service,dev046d-native-dialog'
          cargo test --manifest-path ide/host/Cargo.toml --features dev046c-ci-control --lib dap_session
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: hostile DAP parser tests failed' }
          cargo test --manifest-path ide/supervisor/Cargo.toml --features $features --lib debug_control_dispatch
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: one-use OS scope/control tests failed' }
          cargo check --manifest-path ide/supervisor/Cargo.toml --features $features --lib
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: protected Windows scope bridge compiler failed' }
          # Tauri build.rs requires icons/icon.ico on Windows. Generate a
          # deterministic temporary diagnostic image ONLY in headless CI,
          # after the clean exact-source check. Never package or promote it.
          python ide/app/fixtures/make_g04d_ci_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: temporary CI resource unavailable' }
          cargo check --manifest-path ide/app/src-tauri/Cargo.toml --features dev046d-native-dialog
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: dev native human modal desktop compiler failed' }
          echo 'IDE_G04D_WINDOWS_SOURCE=PASS_NOT_PHYSICAL_APPROVAL_OR_INSTALLED'
