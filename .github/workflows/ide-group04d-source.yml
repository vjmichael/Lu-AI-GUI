            Invoke-LuIdePreflightGroup 'Linux regular release compiler' { Invoke-CargoCheck @('check','--release','--manifest-path','ide/supervisor/Cargo.toml','--features','linux-worker,dap-transport') }
          }
          Invoke-LuIdePreflightGroup 'Exact tracked candidate unchanged' {
            if ((git rev-parse HEAD).Trim() -cne $env:REVIEWED_SOURCE_SHA -or $LASTEXITCODE -ne 0) { throw 'HEAD changed' }
            Invoke-Checked 'git' @('diff','--exit-code','HEAD','--')
          }
          Write-Host 'LLVM18_BUILD=NOT_RUN; NATIVE_OS_ACCEPTANCE=NOT_RUN'
          if ($failures.Count -gt 0) { throw ('SOURCE_PREFLIGHT_FAILED: ' + ($failures -join '; ')) }
          Write-Host 'SOURCE_PREFLIGHT=PASS_NOT_NATIVE_ACCEPTANCE'
