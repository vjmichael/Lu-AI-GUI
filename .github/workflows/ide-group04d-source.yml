          foreach ($name in @('Invoke-LuIdePreflightGroup','Invoke-Checked','Invoke-CargoCheck')) {
            if ((Get-Command -Name $name -ErrorAction Stop).CommandType -ne [System.Management.Automation.CommandTypes]::Function) {
              throw "DENIED: verification helper shadowed: $name"
            }
          }
          # Verify native argument passing and failure detection without
          # counting a synthetic result as an actual source gate.
          Invoke-Checked 'python' @('-c','import sys; assert sys.argv[1:] == ["arg with spaces", "--test"]','arg with spaces','--test')
          $observedFailure=$false
          try { Invoke-Checked 'python' @('-c','import sys; sys.exit(17)') }
