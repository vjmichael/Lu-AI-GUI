          @{"schema"="lu-plan06-exact-head-install-v1";"sourceSha"=$env:SOURCE_SHA;"os"="windows-2025";"fixtureGguf"=$false}|
            ConvertTo-Json|Set-Content -LiteralPath (Join-Path $dir 'source.json') -Encoding UTF8
      - name: Require pinned NSIS 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $compiler=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'NSIS\makensis.exe'
          if(-not(Test-Path -LiteralPath $compiler -PathType Leaf)){
            choco install nsis --version=3.11.0 --yes --no-progress --limit-output
            if($LASTEXITCODE -ne 0){throw 'Pinned NSIS install failed'}
          }
          & $compiler /VERSION
          if($LASTEXITCODE -ne 0){throw 'Reviewed NSIS compiler refused'}
      - name: Build real exact-head x64 NSIS with pinned genuine CPU engine
        shell: pwsh
        timeout-minutes: 150
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'plan06-genuine-installer'
          & scripts/build-agent01g-physical-windows-nsis.ps1 -SourceSha $env:SOURCE_SHA -OutputDirectory $folder
          if($LASTEXITCODE -ne 0){throw 'Exact source genuine NSIS build failed'}
          $check=Get-Content -LiteralPath (Join-Path $folder 'installer-checksums.json') -Raw | ConvertFrom-Json
          if($check.sourceSha -cne $env:SOURCE_SHA -or -not $check.genuineInstallerProduced){
            throw 'Plan06 installer source not authentic'
          }
          $installer=Join-Path $folder $check.installerName
          if((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $check.installerSha256){
            throw 'PLAN06 actual installer byte digest mismatch'
          }
          Copy-Item -LiteralPath (Join-Path $folder 'installer-checksums.json') -Destination (Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\installer-checksums.json')
      - name: Install true NSIS package into disposable Windows directory
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'plan06-genuine-installer'
          $check=Get-Content -LiteralPath (Join-Path $folder 'installer-checksums.json') -Raw | ConvertFrom-Json
          $installer=Join-Path $folder $check.installerName
          $target=Join-Path $env:RUNNER_TEMP 'plan06-installed-Lu'
          if(Test-Path -LiteralPath $target){throw 'Refuse pre-existing installation'}
          $process=Start-Process -FilePath $installer -ArgumentList @('/S',("/D="+$target)) -PassThru
          if(-not $process.WaitForExit(600000)){ $process.Kill($true); throw 'Installer timed out' }
          $process.Refresh()
          if($process.ExitCode -ne 0){throw "Actual NSIS installer exited $($process.ExitCode)"}
          $app=Join-Path $target 'lu-desktop.exe'
          if(-not(Test-Path -LiteralPath $app -PathType Leaf)){throw 'Installed native Lu.exe missing'}
          if((Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant() -cne $check.appSha256){
            throw 'Installed native executable differs from original build'
          }
          $engine=Join-Path $target 'lu-inference\llama-server.exe'
          if((Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant() -cne $check.engineSha256){
            throw 'Original pinned genuine engine absent from installed app'
          }
          "LU_PLAN06_INSTALLED_EXE=$app" >> $env:GITHUB_ENV
          "LU_PLAN06_INSTALLED_SHA=$($check.appSha256)" >> $env:GITHUB_ENV
          "LU_PLAN06_INSTALL_FOLDER=$target" >> $env:GITHUB_ENV
          $data=@{sourceSha=$check.sourceSha;appSha256=$check.appSha256;engineSha256=$check.engineSha256;installedExe=$app;installerSha256=$check.installerSha256}
          $data|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\real-install.json') -Encoding UTF8
      - name: Materialize two audited original source projects in disposable ANSF
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference='Stop'
          $env:LU_PLAN06_INSTALLED_PROFILE=Join-Path $env:APPDATA 'org.lu.agent01g.devtest'
          $env:LU_PLAN06_INSTALLED_PROJECTS=Join-Path $env:RUNNER_TEMP 'plan06-original-projects'
          $env:LU_PLAN06_INSTALLED_SEED_RECEIPT=Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\original-seed.json'
          if(Test-Path -LiteralPath $env:LU_PLAN06_INSTALLED_PROFILE){throw 'PLAN06 refuses an existing operator profile'}
          $inference=Join-Path (Get-Location) 'lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $inference | Out-Null
          foreach($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            $target=Join-Path $inference $dll
            if(Test-Path -LiteralPath $target){throw "Refuse replacing a real runtime: $dll"}
            Set-Content -LiteralPath $target -Value 'NOT_AN_ENGINE_PLAN06_TEST_FIXTURE' -NoNewline
          }
          & cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib project_task_board_desktop::tests::export_dual_project_installed_ui_fixture -- --ignored --exact --nocapture
          if($LASTEXITCODE -ne 0){throw 'PLAN06 original project fixture construction failed'}
          if(-not(Test-Path -LiteralPath $env:LU_PLAN06_INSTALLED_SEED_RECEIPT)){throw 'PLAN06 seed fixture receipt missing'}
          & python scripts/plan06-readonly-ansf-witness.py --profile $env:LU_PLAN06_INSTALLED_PROFILE --seed $env:LU_PLAN06_INSTALLED_SEED_RECEIPT --output (Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\independent-original-source.json')
          if($LASTEXITCODE -ne 0){throw 'PLAN06 two original ANSF projects not independently audited'}
          "LU_PLAN06_INSTALLED_PROFILE=$env:LU_PLAN06_INSTALLED_PROFILE" >> $env:GITHUB_ENV
          "LU_PLAN06_INSTALLED_SEED_RECEIPT=$env:LU_PLAN06_INSTALLED_SEED_RECEIPT" >> $env:GITHUB_ENV
      - name: Actual installed native task-list UIA OS refusal approval project switch restart
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference='Stop'
          $ui=Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\human-acceptance'
          & scripts/plan06-windows-installed-acceptance.ps1 -InstalledExe $env:LU_PLAN06_INSTALLED_EXE -ExpectedSha256 $env:LU_PLAN06_INSTALLED_SHA -ProfileDir $env:LU_PLAN06_INSTALLED_PROFILE -SeedReceipt $env:LU_PLAN06_INSTALLED_SEED_RECEIPT -EvidenceDir $ui -DisposableWindowsConfirmed
          if($LASTEXITCODE -ne 0){throw 'PLAN06 installed OS dialogs and restart are NOT accepted'}
          $out=Get-Content -LiteralPath (Join-Path $ui 'plan06-installed-uia.json') -Raw|ConvertFrom-Json
          if($out.acceptance -cne 'PASS_PLAN06_INSTALLED_INTERACTIONS_AND_RESTART' -or $out.fixtureNotRealGguf -cne $true){
            throw 'PLAN06 independent installed UIA oracle failed'
          }
          echo 'PLAN06 true NSIS Windows UIA task list, source, refusal/approval, project switching and restart PASS; test-only fixture explicitly not GGUF.' >> $env:GITHUB_STEP_SUMMARY
      - name: Real NSIS uninstall and preserve both independent original task histories
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          $target=$env:LU_PLAN06_INSTALL_FOLDER
          $uninstaller=Join-Path $target 'UninstallLuAGENT01GPhysicalTest.exe'
          if(-not(Test-Path -LiteralPath $uninstaller)){throw 'Real NSIS uninstaller missing'}
          $before=Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\human-acceptance\ansf-after-installed-app-restart.json'
          if(-not(Test-Path -LiteralPath $before)){throw 'No original independent restart receipt'}
          $old=Get-Content -LiteralPath $before -Raw | ConvertFrom-Json
          $proc=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru
          if(-not $proc.WaitForExit(180000)){$proc.Kill($true);throw 'Real NSIS uninstall timed out'}
          $proc.Refresh()
          if($proc.ExitCode -ne 0){throw 'Real NSIS uninstall exited nonzero'}
          $deadline=[DateTime]::UtcNow.AddSeconds(30)
          do{
            if(-not(Test-Path $target)){break}
            Start-Sleep -Milliseconds 300
          }while([DateTime]::UtcNow -lt $deadline)
          if(Test-Path $target){throw 'Native application files remained after uninstall'}
          & python scripts/plan06-readonly-ansf-witness.py --profile $env:LU_PLAN06_INSTALLED_PROFILE --seed $env:LU_PLAN06_INSTALLED_SEED_RECEIPT --output (Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\after-nsis-uninstall.json')
          if($LASTEXITCODE -ne 0){throw 'Original ANSF lost after installed uninstall'}
          $after=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'plan06-installed-evidence\after-nsis-uninstall.json') -Raw | ConvertFrom-Json
          foreach($r in $old.projects){
            $x=$after.projects|Where-Object {$_.registerId -ceq $r.registerId}
            if(-not $x -or $x.boardSha256 -cne $r.boardSha256 -or $x.currentRegisterSha256 -cne $r.currentRegisterSha256){
              throw 'PLAN06 uninstall changed original ANSF source or human review'
            }
          }
          echo 'PLAN06 real NSIS uninstaller removed app while preserving both original ANSF projects.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-plan06-installed-original-windows-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/plan06-installed-evidence/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-plan06-exact-head-nsis-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/plan06-genuine-installer/
