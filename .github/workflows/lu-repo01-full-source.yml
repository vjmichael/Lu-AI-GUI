name: Lu REPO-01 frozen source verification
on:
  push:
    branches:
      - 'lu/win-load-01-host-trace-*'
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact tracked-source snapshot
        run: node scripts/verify-source-tree.mjs
      - name: Audit grouped-CI trigger policy and queue cleanup safety
        if: hashFiles('scripts/lu-ci-group-policy.mjs') != ''
        run: |
          node --test scripts/lu-ci-group-policy.test.mjs scripts/lu-ci-superseded-queue.test.mjs
          node scripts/lu-ci-group-policy.mjs
      - name: Run REPO-01 malicious-edit fixtures
        run: node --test tests/source-identity.test.mjs
      - name: Record immutable build identity
        run: |
          git rev-parse HEAD
          git status --porcelain
# This gate proves integrity of the repository checkout relative to its
# committed manifest. It does not prove an external unpublished local copy.
