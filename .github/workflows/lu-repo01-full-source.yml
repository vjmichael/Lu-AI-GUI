      - name: Build approved SHA-pinned real llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake
          git clone --depth 1 --branch b12143 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/plan04-llama"
          actual="$(git -C "$RUNNER_TEMP/plan04-llama" rev-parse HEAD)"
          test "$actual" = 2bc46baa9207d098d03741ac394e7faaf1a955b6
          cmake -S "$RUNNER_TEMP/plan04-llama" -B "$RUNNER_TEMP/plan04-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/plan04-build" --target llama-server --parallel 3
          sha256sum "$RUNNER_TEMP/plan04-build/bin/llama-server" > plan04-real-evidence/engine-sha256.txt
          echo "ENGINE_SOURCE=$actual" >> plan04-real-evidence/native-source.txt
      - name: Retrieve checksum-pinned original genuine Qwen3 GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 \
            https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf \
            -o "$RUNNER_TEMP/plan04-Qwen3-0.6B.gguf"
          printf '%s  %s\n' "$MODEL_SHA256" "$RUNNER_TEMP/plan04-Qwen3-0.6B.gguf" | sha256sum -c -
          echo "MODEL_SHA=$MODEL_SHA256" >> plan04-real-evidence/native-source.txt
      - name: Actual local GGUF generation and strict original Lu Core review
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/plan04-build/bin/llama-server" \
            -m "$RUNNER_TEMP/plan04-Qwen3-0.6B.gguf" \
            --host 127.0.0.1 --port "$PLAN04_PORT" -c 8192 -ngl 0 \
            > plan04-real-evidence/llama-server.log 2>&1 &
          pid="$!"
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 150); do
            kill -0 "$pid"
            if curl -fsS --max-time 2 "http://127.0.0.1:$PLAN04_PORT/health" \
              > plan04-real-evidence/health.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          python3 benchmarks/e1/plan04_real_gguf_synthesis.py \
            --fixture "$LU_PLAN04_PROMPT_OUT" \
            --output "$LU_PLAN04_REAL_REPLY_FILE" --port "$PLAN04_PORT" \
            2>&1 | tee plan04-real-evidence/model-response-log.txt
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
            --lib project_task_synthesis::tests::independently_validate_original_real_gguf_task_output \
            -- --ignored --nocapture 2>&1 | tee plan04-real-evidence/strict-host-review.log
          grep -Fq 'PLAN04_REAL_GGUF_TASK_SOURCE_VERIFIED_TASKS=1' \
            plan04-real-evidence/strict-host-review.log
          echo 'Real original Qwen3-0.6B GGUF model response independently checked against source graph and requirement references; does NOT verify installed Windows, Radeon 27B, or human approval.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-plan04-real-gguf-${{ github.event.pull_request.head.sha }}
          path: plan04-real-evidence/
          retention-days: 14
