          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Exact head, native-generated original graph/prompt
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          mkdir -p plan04-real-evidence
          test "$(git rev-parse HEAD)" = "$SHA"
          python - <<'PY'
          import os,re
          assert re.findall(r'(?m)^LU_PLAN04_MODEL_SHA=([0-9a-f]{40})$',os.environ['BODY'])==[os.environ['SHA']]
          PY
