  p0-gate-installed-windows:
    name: P0-GATE genuine hosted Windows NSIS, UIA, restart, uninstall
    needs: p0-gate-native
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and pinned NSIS toolchain
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA){throw 'P0 wrong source'}
          node scripts/verify-source-tree.mjs
          $nsis=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'NSIS\makensis.exe'
          if(-not(Test-Path $nsis)){
            choco install nsis --version=3.11.0 --yes --no-progress --limit-output
            if($LASTEXITCODE -ne 0){throw 'NSIS install failed'}
          }
      - name: Build current Lu with genuinely pinned CPU engine and original NSIS
        shell: pwsh
        timeout-minutes: 150
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'p0-current-nsis'
          & scripts/build-agent01g-physical-windows-nsis.ps1 -SourceSha $env:SOURCE_SHA -OutputDirectory $dir
          if($LASTEXITCODE -ne 0){throw 'P0 NSIS build failed'}
          $p=Get-Content (Join-Path $dir 'installer-checksums.json') -Raw|ConvertFrom-Json
          if($p.sourceSha -cne $env:SOURCE_SHA -or -not $p.genuineInstallerProduced){throw 'Installer provenance failed'}
          $file=Join-Path $dir $p.installerName
          if((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $p.installerSha256){throw 'Installer bytes changed'}
          $target=Join-Path $env:RUNNER_TEMP 'p0-current-installed-Lu'
          if(Test-Path $target){throw 'Not a disposable install directory'}
          $proc=Start-Process $file -ArgumentList @('/S',('/D='+$target)) -PassThru
          if(-not $proc.WaitForExit(600000)){$proc.Kill($true);throw 'Installer timed out'}
          if($proc.ExitCode -ne 0){throw 'Installer error'}
          $exe=Join-Path $target 'lu-desktop.exe'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $p.appSha256){throw 'Installed original app changed'}
          "P0_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV
          "P0_INSTALLED_SHA=$($p.appSha256)" >> $env:GITHUB_ENV
          "P0_INSTALL_DIR=$target" >> $env:GITHUB_ENV
          "P0_PROOF_DIR=$dir" >> $env:GITHUB_ENV
      - name: Genuine original ANSF disposable fixture and installed Win32 UI Automation
        shell: pwsh
        timeout-minutes: 40
        run: |
          $ErrorActionPreference='Stop'
          $env:LU_PLAN06_INSTALLED_PROFILE=Join-Path $env:APPDATA 'org.lu.agent01g.devtest'
          $env:LU_PLAN06_INSTALLED_PROJECTS=Join-Path $env:RUNNER_TEMP 'p0-projects'
          $ev=Join-Path $env:P0_PROOF_DIR 'p0-installed-evidence'
          New-Item -ItemType Directory -Force -Path $ev|Out-Null
          $env:LU_PLAN06_INSTALLED_SEED_RECEIPT=Join-Path $ev 'seed.json'
          if(Test-Path $env:LU_PLAN06_INSTALLED_PROFILE){throw 'Refuse existing owner ANSF profile'}
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          foreach($n in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            if(-not(Test-Path (Join-Path $root $n))){Set-Content (Join-Path $root $n) -Value 'CI_ONLY_NOT_AN_ENGINE' -NoNewline}
          }
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib project_task_board_desktop::tests::export_dual_project_installed_ui_fixture -- --ignored --exact --nocapture
          if($LASTEXITCODE -ne 0){throw 'ANSF fixture creation failed'}
          python scripts/plan07d-readonly-ansf-witness.py --profile $env:LU_PLAN06_INSTALLED_PROFILE --seed $env:LU_PLAN06_INSTALLED_SEED_RECEIPT --output (Join-Path $ev 'before-ui.json')
          if($LASTEXITCODE -ne 0){throw 'Native original ANSF witness failed'}
          & scripts/plan07d-windows-installed-acceptance.ps1 -InstalledExe $env:P0_INSTALLED_EXE -ExpectedSha256 $env:P0_INSTALLED_SHA -ProfileDir $env:LU_PLAN06_INSTALLED_PROFILE -SeedReceipt $env:LU_PLAN06_INSTALLED_SEED_RECEIPT -ProjectsDir $env:LU_PLAN06_INSTALLED_PROJECTS -EvidenceDir (Join-Path $ev 'uia') -DisposableWindowsConfirmed
          if($LASTEXITCODE -ne 0){throw 'Win32 original UIA review/restart not accepted'}
          "P0_ANSF_PROFILE=$env:LU_PLAN06_INSTALLED_PROFILE" >> $env:GITHUB_ENV
          "P0_ANSF_SEED=$env:LU_PLAN06_INSTALLED_SEED_RECEIPT" >> $env:GITHUB_ENV
          "P0_INSTALLED_EVIDENCE=$ev" >> $env:GITHUB_ENV
      - name: Real NSIS removal and independent ANSF preservation witness
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference='Stop'
          python scripts/plan07d-readonly-ansf-witness.py --profile $env:P0_ANSF_PROFILE --seed $env:P0_ANSF_SEED --output (Join-Path $env:P0_INSTALLED_EVIDENCE 'before-uninstall.json') --require-phase refused --require-phase cancelled --require-phase approved_for_review --require-phase interrupted
          if($LASTEXITCODE -ne 0){throw 'Prior original ANSF evidence incomplete'}
          $uninstaller=Join-Path $env:P0_INSTALL_DIR 'UninstallLuAGENT01GPhysicalTest.exe'
          if(-not(Test-Path $uninstaller)){throw 'Real uninstaller missing'}
          $p=Start-Process $uninstaller -ArgumentList '/S' -PassThru
          if(-not $p.WaitForExit(180000)){$p.Kill($true);throw 'Uninstaller timeout'}
          if($p.ExitCode -ne 0){throw 'Uninstaller failed'}
          $end=[DateTime]::UtcNow.AddSeconds(30)
          while((Test-Path $env:P0_INSTALL_DIR) -and [DateTime]::UtcNow -lt $end){Start-Sleep -Milliseconds 300}
          if(Test-Path $env:P0_INSTALL_DIR){throw 'Installed binary remains'}
          python scripts/plan07d-readonly-ansf-witness.py --profile $env:P0_ANSF_PROFILE --seed $env:P0_ANSF_SEED --output (Join-Path $env:P0_INSTALLED_EVIDENCE 'after-uninstall.json') --require-phase refused --require-phase cancelled --require-phase approved_for_review --require-phase interrupted
          if($LASTEXITCODE -ne 0){throw 'ANSF missing after uninstall'}
          $a=Get-Content (Join-Path $env:P0_INSTALLED_EVIDENCE 'before-uninstall.json') -Raw
