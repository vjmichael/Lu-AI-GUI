          printf '%s\n' 'Package: lu-p0' 'Version: 0.1.0~alpha1' 'Architecture: amd64' 'Maintainer: Lu Acceptance <test@localhost>' 'Description: disposable Lu P0 source-bound Debian acceptance test' > "$stage/DEBIAN/control"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Lu P0 Test' 'Exec=/usr/bin/lu-desktop-p0' 'Terminal=false' 'Categories=Utility;' > "$stage/usr/share/applications/lu-p0.desktop"
          dpkg-deb --build --root-owner-group "$stage" "$RUNNER_TEMP/lu-p0_0.1.0~alpha1_amd64.deb"
          sha256sum "$candidate" "$RUNNER_TEMP/lu-p0_0.1.0~alpha1_amd64.deb" | tee p0-debian-evidence/build-sha256.txt
          sudo dpkg -i "$RUNNER_TEMP/lu-p0_0.1.0~alpha1_amd64.deb"
          test "$(sha256sum "$candidate" | cut -d' ' -f1)" = "$(sha256sum /usr/lib/lu-p0/lu-desktop | cut -d' ' -f1)"
      - name: Installed original ANSF fixture, real AT-SPI operator decisions and restart
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/p0-linux-xdg"
          export LU_PLAN06_INSTALLED_PROFILE="$XDG_DATA_HOME/org.lu.desktop"
          export LU_PLAN06_INSTALLED_PROJECTS="$RUNNER_TEMP/p0-linux-original-projects"
          export LU_PLAN06_INSTALLED_SEED_RECEIPT="$GITHUB_WORKSPACE/p0-debian-evidence/seed.json"
          test ! -e "$LU_PLAN06_INSTALLED_PROFILE"
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib project_task_board_desktop::tests::export_dual_project_installed_ui_fixture -- --ignored --exact --nocapture
          python3 scripts/plan07d-readonly-ansf-witness.py --profile "$LU_PLAN06_INSTALLED_PROFILE" --seed "$LU_PLAN06_INSTALLED_SEED_RECEIPT" --output p0-debian-evidence/before-ui.json
          export NO_AT_BRIDGE=0 GDK_BACKEND=x11 GTK_MODULES=gail:atk-bridge
          xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/plan07d-debian-installed-smoke.py --installed-exe /usr/lib/lu-p0/lu-desktop --profile "$LU_PLAN06_INSTALLED_PROFILE" --seed "$LU_PLAN06_INSTALLED_SEED_RECEIPT" --evidence-dir "$GITHUB_WORKSPACE/p0-debian-evidence/atspi"
          xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/plan07d-debian-installed-human.py --installed-exe /usr/lib/lu-p0/lu-desktop --profile "$LU_PLAN06_INSTALLED_PROFILE" --seed "$LU_PLAN06_INSTALLED_SEED_RECEIPT" --projects-dir "$LU_PLAN06_INSTALLED_PROJECTS" --evidence-dir "$GITHUB_WORKSPACE/p0-debian-evidence/human-matrix"
          python3 scripts/plan07d-readonly-ansf-witness.py --profile "$LU_PLAN06_INSTALLED_PROFILE" --seed "$LU_PLAN06_INSTALLED_SEED_RECEIPT" --output p0-debian-evidence/before-removal.json --require-phase refused --require-phase cancelled --require-phase approved_for_review --require-phase interrupted
          sudo dpkg -r lu-p0
          test ! -e /usr/lib/lu-p0/lu-desktop
          python3 scripts/plan07d-readonly-ansf-witness.py --profile "$LU_PLAN06_INSTALLED_PROFILE" --seed "$LU_PLAN06_INSTALLED_SEED_RECEIPT" --output p0-debian-evidence/after-removal.json --require-phase refused --require-phase cancelled --require-phase approved_for_review --require-phase interrupted
          cmp -s p0-debian-evidence/before-removal.json p0-debian-evidence/after-removal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-p0-installed-debian-${{ github.event.pull_request.head.sha }}
          path: p0-debian-evidence/
          if-no-files-found: warn
          retention-days: 14

