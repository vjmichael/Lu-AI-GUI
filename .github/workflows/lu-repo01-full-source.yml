      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-plan05-exact-head-nsis-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/plan05-genuine-installer/
          retention-days: 14
