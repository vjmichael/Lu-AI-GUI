              printf 'CI_COMPILER_PLACEHOLDER_NOT_MODEL' > "lu-desktop/src-tauri/resources/lu-inference/$name"
            done
          fi
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib agent_memory_reasoning::tests -- --nocapture 2>&1 | tee phase3-evidence/agent-memory.log
      - name: Reject malformed PowerShell installer sources before SDK/build work
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('scripts/build-current-windows-nsis.ps1','scripts/m3-windows-nsis-cycle.ps1','scripts/stage-research-windows.ps1','scripts/p0-windows-installed-gui-smoke.ps1','scripts/p0-qwen38-radeon-physical.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){
              foreach($error in $errors){Write-Host ($error.ToString())}
              throw "NSIS_POWERSHELL_PARSER_ERROR: $file"
            }
          }
      - name: Provision real Windows NSIS 3.11
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'NSIS\makensis.exe'
          if(-not(Test-Path $exe)){choco install nsis --version=3.11.0 --yes --no-progress --limit-output; if($LASTEXITCODE -ne 0){throw 'NSIS install failed'}}
          & $exe /VERSION
          if($LASTEXITCODE -ne 0){throw 'NSIS unusable'}
      - name: Pin native Windows Vulkan SDK for dual llama.cpp backend compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install vulkan-sdk --version=1.4.350 --yes --no-progress --limit-output
          if($LASTEXITCODE -ne 0){throw 'Pinned Vulkan SDK 1.4.350 install failed'}
          $candidates=@(Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction Stop |
            Where-Object { Test-Path (Join-Path $_.FullName 'Bin\glslc.exe') })
          if($candidates.Count -ne 1){throw 'Ambiguous or missing pinned Vulkan shader compiler'}
          $sdk=$candidates[0].FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          (Join-Path $sdk 'Bin') >> $env:GITHUB_PATH
          & (Join-Path $sdk 'Bin\glslc.exe') --version
          if($LASTEXITCODE -ne 0){throw 'Pinned glslc unavailable'}
      - name: Build CURRENT Lu Preview with source-pinned CPU AND Vulkan llama.cpp backends
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 145
        env:
          SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'lu-current-preview-nsis'
          & scripts/build-current-windows-nsis.ps1 -SourceSha $env:SOURCE -OutputDirectory $out
          if($LASTEXITCODE -ne 0){throw 'Native NSIS builder failed'}
          $f=Get-Content (Join-Path $out 'installer-checksums.json') -Raw|ConvertFrom-Json
          $exe=Join-Path $out $f.installerName
          if(-not(Test-Path $exe)){throw 'Real installer absent'}
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -cne $f.installerSha256 -or $f.sourceSha -cne $env:SOURCE){throw 'Installer/source hash mismatch'}
          "CURRENT_LU_PREVIEW_SHA=$env:SOURCE" >> $env:GITHUB_STEP_SUMMARY
          "CURRENT_LU_PREVIEW_INSTALLER_SHA256=$sha" >> $env:GITHUB_STEP_SUMMARY
          "CPU and Vulkan engines built from e0f142d5ddc1461ce721644d92af33db23545105; actual AMD offload/GGUF NOT TESTED." >> $env:GITHUB_STEP_SUMMARY
      - name: Windows installed NSIS lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 14
        env:
          LU_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'lu-current-preview-nsis'
          $f=Get-Content (Join-Path $out 'installer-checksums.json') -Raw|ConvertFrom-Json
          $verifyUi=($env:LU_PR_NUMBER -eq '205')
          & scripts/m3-windows-nsis-cycle.ps1 -ExerciseInstalledGui:$verifyUi -InstallerPath (Join-Path $out $f.installerName) -InstallerSha256 $f.installerSha256 -ExpectedLuSha256 $f.appSha256 -ExpectedEngineSha256 $f.engineSha256 -ExpectedVulkanSha256 $f.vulkanEngineSha256 -ProfileIdentifier 'org.lu.current.devpreview' -UninstallerName 'UninstallLuCurrentPreview.exe' -ExpectedResearchSha256 ([string]$f.researchClientSha256) -DisposableWindowsConfirmed -EvidenceDir (Join-Path $out 'native-nsis-cycle-evidence')
          if($LASTEXITCODE -ne 0){throw 'Native installed-preview cycle failed'}
      - name: Preserve exact-current-source artifact and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-Current-Phase3-Preview-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: |
            phase3-evidence/
            ${{ runner.temp }}/lu-current-preview-nsis/
          if-no-files-found: warn
          retention-days: 14

  p0-native:
    needs: verify-source
    if: ${{ github.event.pull_request.number == 205 && github.event.pull_request.draft && github.event.pull_request.head.ref == 'lu/p0-installed-ux-agent-acceptance-20261110' && contains(github.event.pull_request.body, format('LU_P0_UX_NATIVE_SHA={0}', github.event.pull_request.head.sha)) && !contains(github.event.changes.body.from, format('LU_P0_UX_NATIVE_SHA={0}', github.event.pull_request.head.sha)) }}
