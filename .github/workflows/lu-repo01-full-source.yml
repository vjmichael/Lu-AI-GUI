name: Lu REPO-01 frozen source verification
on:
  push:
    branches:
      - 'lu/win-load-01-host-trace-*'
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
# The separately admitted, exact-SHA P0 native job must not be reaped
# by a later source-only PR edit. No other heavy job runs without its
# explicit grouped authorization marker.
concurrency:
  group: repo01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge refs change whenever main's metadata-only ledger advances.
          # Verify the immutable reviewed branch head, not a moving merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact reviewed source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact tracked-source snapshot
        run: node scripts/verify-source-tree.mjs
      - name: Audit grouped-CI trigger policy and queue cleanup safety
        if: hashFiles('scripts/lu-ci-group-policy.mjs') != ''
        run: |
          node --test scripts/lu-ci-group-policy.test.mjs scripts/lu-ci-superseded-queue.test.mjs
          node scripts/lu-ci-group-policy.mjs
      - name: Audit Core branch convergence and retained canonical ledger
        if: hashFiles('scripts/lu-core-stack-graph.test.mjs') != ''
        run: |
          node --test scripts/lu-core-stack-graph.test.mjs scripts/lu-core-convergence-22.test.mjs scripts/lu-ledger.test.mjs
          node scripts/lu-core-stack-graph.mjs --check --fixture docs/LU_CORE_OPEN_PR_STACK_20261109.json --relations docs/LU_CORE_SIDE_BRANCH_COMPARISONS_20261109.json
      - name: Run REPO-01 malicious-edit fixtures
        run: node --test tests/source-identity.test.mjs
      - name: Record immutable build identity
        run: |
          git rev-parse HEAD
          git status --porcelain
# This gate proves integrity of the repository checkout relative to its
# committed manifest. It does not prove an external unpublished local copy.

  native-r00-consolidated:
    # One opt-in event after a completed task group, not on every PR push.
    # The trigger must be a transition from no exact-head marker to an
    # exact-head marker in the user-reviewable draft PR #200 description.
    needs: verify-source
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.pull_request.number == 200 && github.event.pull_request.head.ref == 'lu/r00-core-convergence-20261109' && contains(github.event.pull_request.body, format('LU_R00_NATIVE_GATE_SHA={0}', github.event.pull_request.head.sha)) && !contains(github.event.changes.body.from, format('LU_R00_NATIVE_GATE_SHA={0}', github.event.pull_request.head.sha)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Authenticate one-time PR200 head handoff for this grouped gate
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha }}
          REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os,re
          body=os.environ["REQUEST_BODY"]
          matches=re.findall(r"(?m)^LU_R00_NATIVE_GATE_SHA=([0-9a-f]{40})$",body)
          if matches != [os.environ["EXACT_SHA"]]:
              raise SystemExit("R00_GATE_REFUSED: no exact one-time source SHA")
          print("R00_GROUPED_NATIVE_ADMITTED_SOURCE="+matches[0])
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head and frozen full Git source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p memory-loop03b-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/verify-source-tree.mjs 2>&1 | tee memory-loop03b-evidence/source-lock.log
          printf 'SOURCE_SHA=%s\nOS=%s\n' "$EXPECTED_SHA" "$RUNNER_OS" > memory-loop03b-evidence/source.txt
      - name: Pure standalone host state classification (not Tauri acceptance)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lu-memory-loop03b-host"
          if test "$RUNNER_OS" = "Windows"; then bin="$bin.exe"; fi
          rustc --edition=2021 --test lu-desktop/src-tauri/src/memory_loop03b_policy.rs -o "$bin" 2>&1 | tee memory-loop03b-evidence/policy-compile.log
          "$bin" --nocapture 2>&1 | tee memory-loop03b-evidence/policy-tests.log
          grep -Fq 'test result: ok. 7 passed; 0 failed;' memory-loop03b-evidence/policy-tests.log
      - name: Historical-source contracts (not installed proof)
        shell: bash
        run: |
          set -euo pipefail
          node --test lu-desktop/tests/memory-loop03e-crash-recovery.test.mjs 2>&1 | tee memory-loop03b-evidence/memory03e-source-contracts.log
          node --test lu-desktop/tests/memory-loop03b-source.test.mjs 2>&1 | tee memory-loop03b-evidence/source-contracts.log
          grep -Fq '# pass 11' memory-loop03b-evidence/source-contracts.log
          grep -Fq '# fail 0' memory-loop03b-evidence/source-contracts.log
      - name: Real Linux Tauri dependency libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf ffmpeg
      - name: Windows test-only nonengine runtime fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='lu-desktop/src-tauri/resources/lu-inference'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach($name in @('llama-server.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')){
            Set-Content -LiteralPath (Join-Path $root $name) -Value 'NOT_AN_ENGINE_CI_PLACEHOLDER' -NoNewline
          }
      - name: Linux real reviewed Git and FFprobe OS binary admission
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git_bin="$(command -v git)"
          probe_bin="$(command -v ffprobe)"
          test -x "$git_bin" && test -x "$probe_bin"
          printf 'LU_MEMORY_LOOP03C_GIT=%s\nLU_MEMORY_LOOP03C_FFPROBE=%s\n' "$git_bin" "$probe_bin" >> "$GITHUB_ENV"
          git --version
          ffprobe -version | sed -n '1p'
      - name: Windows real reviewed Git and FFprobe OS binary admission
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $git=(Get-Command git.exe -ErrorAction Stop).Source
          $ff=(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)
          if (-not $ff) {
            choco install ffmpeg --yes --no-progress
            $pathCandidate=Join-Path $env:ChocolateyInstall 'bin\ffprobe.exe'
            if (Test-Path -LiteralPath $pathCandidate) { $ff=Get-Item $pathCandidate }
          }
          if (-not $ff) { throw 'Real FFprobe executable unavailable' }
          $probe=$ff.FullName
          if (-not $probe) { $probe=$ff.Source }
          if (-not (Test-Path -LiteralPath $git) -or -not (Test-Path -LiteralPath $probe)) {
            throw 'Real OS executable missing'
          }
          "LU_MEMORY_LOOP03C_GIT=$git" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LU_MEMORY_LOOP03C_FFPROBE=$probe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $git --version
          & $probe -version | Select-Object -First 1
      - name: Real React bundle and static interaction checks
        shell: bash
        run: |
          set -euo pipefail
          pushd lu-desktop
          npm ci --no-audit --no-fund
          npm run build
          npm run check
          popd
      - name: Genuine lu-core independent receipt tampering tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib journal::independent_outcome_tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/core-oracle-tests.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_verified_procedures::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/core-procedures.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_belief_revision::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/core-beliefs.log
      - name: Real Tauri source-bound GGUF ingress, beliefs and CCM integration
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib memory_loop03b_policy::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/desktop-policy.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib memory_loop03b_context::tests -- --nocapture 2>&1 | tee memory-loop03b-evidence/desktop-context.log
          grep -Fq 'test result: ok. 7 passed; 0 failed;' memory-loop03b-evidence/desktop-context.log
          cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml 2>&1 | tee memory-loop03b-evidence/desktop-compile.log
      - name: MEMORY-LOOP-03C actual native ANSF fixture and grader regressions
        shell: bash
        run: |
          set -euo pipefail
          export LU_MEMORY_LOOP03C_NATIVE_FIXTURE_PATH="$GITHUB_WORKSPACE/memory-loop03b-evidence/memory03c-native-corpus.json"
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib memory_loop03c_actual_original_ansf_host_capsule_corpus -- --nocapture \
            2>&1 | tee memory-loop03b-evidence/memory03c-native-corpus-test.log
          test -s memory-loop03b-evidence/memory03c-native-corpus.json
          # G4: Native Git observation is a test-only OS subprocess, not a Lu
          # approved worker; the actual ANSF, continuity and journal paths run.
          export LU_MEMORY_LOOP03C_POSITIVE_FIXTURE_PATH="$GITHUB_WORKSPACE/memory-loop03b-evidence/memory03c-positive-git-corpus.json"
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib \
            memory_loop03c_positive_direct_git_ansf_journal_and_correction_corpus -- --nocapture \
            2>&1 | tee memory-loop03b-evidence/memory03c-positive-native-git-test.log
          test -s memory-loop03b-evidence/memory03c-positive-git-corpus.json
          # 03D: historical worker index and normal Send lookup are tested
          # from real ChatStore/ANSF, SQLite and journal records. These unit
          # fixtures do not independently attest OS child execution; G5 below
          # does that on the same exact revision.
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib \
            reviewed_memory_evidence::tests -- --nocapture \
            2>&1 | tee memory-loop03b-evidence/memory03d-index-source-recovery.log
          export LU_MEMORY_LOOP03C_REVIEWED_FIXTURE_PATH="$GITHUB_WORKSPACE/memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json"
          # G5: the EXISTING protected reviewed-app model->native registry
          # launches real OS Git+FFprobe, independently checks source bytes,
          # enforces fresh human consent on changed HEAD and reconciles SQLite.
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib \
            memory_loop03c_reviewed_git_ffprobe_changed_source_and_exclusive_restart \
            -- --ignored --nocapture \
            2>&1 | tee memory-loop03b-evidence/memory03c-reviewed-worker-native.log
          test -s memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json
          python3 -m unittest discover -s benchmarks/e1 -p test_memory_loop03c_reviewed_workers.py -v \
            2>&1 | tee memory-loop03b-evidence/memory03c-reviewed-worker-parser-tests.log
          python3 -m unittest discover -s benchmarks/e1 -p test_memory_loop03c_real_qwen_comprehension.py -v \
            2>&1 | tee memory-loop03b-evidence/memory03c-grader-tests.log
          python3 -m unittest discover -s benchmarks/e1 -p test_memory_loop03c_positive_git.py -v \
            2>&1 | tee memory-loop03b-evidence/memory03c-positive-grader-tests.log
          python3 benchmarks/e1/memory_loop03c_real_qwen_comprehension.py \
            --fixture memory-loop03b-evidence/memory03c-native-corpus.json \
            --positive-fixture memory-loop03b-evidence/memory03c-positive-git-corpus.json \
            --reviewed-fixture memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json \
            --output memory-loop03b-evidence/memory03c-fixture-validation-only.json \
            --validate-fixture-only
          echo '03C G5 uses real protected reviewed native Git/FFprobe workers, new human authority, changed-source CCM and journal recovery; the test-generated model calls are SCRIPTED, not GGUF, and escape-capable kernel custody remains unproven.' >> "$GITHUB_STEP_SUMMARY"
      - name: MEMORY-LOOP-03C optional pinned real Qwen source-only vs host-classified benchmark
        if: runner.os == 'Linux' && inputs.run_real_qwen
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b12143 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/memory03c-llama-cpp"
          actual="$(git -C "$RUNNER_TEMP/memory03c-llama-cpp" rev-parse HEAD)"
          test "$actual" = 2bc46baa9207d098d03741ac394e7faaf1a955b6
          cmake -S "$RUNNER_TEMP/memory03c-llama-cpp" -B "$RUNNER_TEMP/memory03c-llama-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/memory03c-llama-build" --target llama-server --parallel 3
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 \
            https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf \
            -o "$RUNNER_TEMP/memory03c-qwen.gguf"
          printf '%s  %s\n' 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d "$RUNNER_TEMP/memory03c-qwen.gguf" | sha256sum -c -
          python3 benchmarks/e1/memory_loop03c_real_qwen_comprehension.py \
            --engine "$RUNNER_TEMP/memory03c-llama-build/bin/llama-server" \
            --model "$RUNNER_TEMP/memory03c-qwen.gguf" \
            --fixture memory-loop03b-evidence/memory03c-native-corpus.json \
            --positive-fixture memory-loop03b-evidence/memory03c-positive-git-corpus.json \
            --reviewed-fixture memory-loop03b-evidence/memory03c-reviewed-worker-corpus.json \
            --output memory-loop03b-evidence/memory03c-real-qwen-comparison.json \
            --repetitions 2 \
            2>&1 | tee memory-loop03b-evidence/memory03c-real-qwen-comparison.log
          echo '03C Qwen comparison uses a genuine pinned sub-1B GGUF, not target Qwen3.8 27B, and includes native reviewed Lu Git/FFprobe source observations; installed Lu and escape-capable kernel custody remain OPEN.' >> "$GITHUB_STEP_SUMMARY"
      - name: R00 consolidated full native Core and desktop regression suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib \
            2>&1 | tee memory-loop03b-evidence/r00-core-full-native.log
          cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib \
            2>&1 | tee memory-loop03b-evidence/r00-desktop-full-native.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test desktop_owner_recovery \
            2>&1 | tee memory-loop03b-evidence/r00-owner-native.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test continuity \
            2>&1 | tee memory-loop03b-evidence/r00-continuity-native.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test continuity_conversation_scope \
            2>&1 | tee memory-loop03b-evidence/r00-continuity-scope-native.log
      - name: R00 Windows fixture and exact-check contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/lu-core-convergence-22.test.mjs \
            2>&1 | tee memory-loop03b-evidence/r00-divergent-tip-decisions.log
          node --test lu-desktop/tests/browser-ci-candidate.test.mjs lu-desktop/tests/browser-ci-executable.test.mjs \
            2>&1 | tee memory-loop03b-evidence/r00-browser-candidate-availability.log
          node --test lu-desktop/tests/agent01l-linux-cgroup-v2.test.mjs \
            2>&1 | tee memory-loop03b-evidence/r00-cgroup-source-contracts.log
      - name: Linux nested cgroup host and custodian native compilation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path src-tauri/lu-win-worker-job/Cargo.toml \
            --features e1-p08-crash-fixture \
            --bin lu-linux-cgroup-guard --bin lu-e1-p08-linux-cgroup-crash-parent \
            2>&1 | tee memory-loop03b-evidence/r00-cgroup-native-build.log
          python3 -m py_compile benchmarks/e1/agent01l_cgroup_escape_crash_acceptance.py
          echo 'Delegated positive escaped-descendant and migration-proof gates remain independently OPEN unless real kernel evidence is produced.' >> "$GITHUB_STEP_SUMMARY"
      - name: Unaccepted operational requirements
        if: always()
        shell: bash
        run: |
          echo '03B source and native checks do NOT demonstrate installed Lu, real loaded Qwen3.8 27B behavior, current Git/media source freshness, positive Win32 Job/Linux cgroup-v2 custody, automated replay or per-step effect authorization. Those are separate OPEN gates.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-r00-consolidated-native-${{ matrix.os }}
          path: memory-loop03b-evidence/
          if-no-files-found: warn
          retention-days: 14


  native-r00-custody:
    needs: verify-source
    # One manual, SHA-bound transition on PR #200 only. Not a push/sync build.
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.pull_request.number == 200 && github.event.pull_request.draft && github.event.pull_request.head.ref == 'lu/r00-core-convergence-20261109' && contains(github.event.pull_request.body, format('LU_R00_CUSTODY_GATE_SHA={0}', github.event.pull_request.head.sha)) && !contains(github.event.changes.body.from, format('LU_R00_CUSTODY_GATE_SHA={0}', github.event.pull_request.head.sha)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head and single custody gate admission
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          mkdir -p custody-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import os,re
          matches=re.findall(r"(?m)^LU_R00_CUSTODY_GATE_SHA=([0-9a-f]{40})$",os.environ["REQUEST_BODY"])
          if matches!=[os.environ["EXPECTED_SHA"]]: raise SystemExit("CUSTODY_GATE_REFUSED")
          PY
          node scripts/verify-source-tree.mjs | tee custody-evidence/source-lock.log
          printf 'HEAD=%s\nOS=%s\n' "$EXPECTED_SHA" "$RUNNER_OS" > custody-evidence/source.txt
      - name: First-party custody source security contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test lu-desktop/tests/agent01l-os-custody.test.mjs lu-desktop/tests/agent01l-linux-cgroup-v2.test.mjs 2>&1 | tee custody-evidence/source-contracts.log
          grep -Fq '# fail 0' custody-evidence/source-contracts.log
      - name: Linux native helper and real delegated-kernel crash plus Git restart
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -d /run/systemd/system
          cargo build --locked --manifest-path src-tauri/lu-win-worker-job/Cargo.toml --features e1-p08-crash-fixture --bin lu-linux-cgroup-guard --bin lu-e1-p08-linux-cgroup-crash-parent 2>&1 | tee custody-evidence/linux-helper-build.log
          python3 benchmarks/e1/e1_p08_setsid_escape_probe.py 2>&1 | tee custody-evidence/linux-negative.log
          grep -Fq 'E1_P08_GROUP_ESCAPE_PROVEN=1' custody-evidence/linux-negative.log
          # sudo provisions a CI-only delegated unit. All test processes run as the ordinary runner UID.
          sudo systemd-run --wait --pipe --collect \
            --unit="lu-r00-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --property=Type=exec --property=Delegate=yes \
            --property="User=$(id -un)" \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" \
            --setenv="LU_AGENT01L_TEST_CGROUP_GUARD=$GITHUB_WORKSPACE/src-tauri/lu-win-worker-job/target/debug/lu-linux-cgroup-guard" \
            --setenv="PATH=$PATH" \
            --setenv="CARGO_HOME=$CARGO_HOME" \
            /bin/bash -c '
              set -euo pipefail
              python3 benchmarks/e1/agent01l_cgroup_escape_crash_acceptance.py \
                --guard "$LU_AGENT01L_TEST_CGROUP_GUARD" \
                --parent "$PWD/src-tauri/lu-win-worker-job/target/debug/lu-e1-p08-linux-cgroup-crash-parent"
              cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml \
                --lib native_background_process::tests::agent01l_linux_real_git_cgroup_custody_after_restart -- --ignored --nocapture
            ' 2>&1 | tee custody-evidence/linux-delegated-kernel-git.log
          grep -Fq 'AGENT01L_NATIVE_CGROUP_ESCAPED_DESCENDANT_PASS=1' custody-evidence/linux-delegated-kernel-git.log
          grep -Fq 'agent01l_linux_real_git_cgroup_custody_after_restart ... ok' custody-evidence/linux-delegated-kernel-git.log
          ! grep -Fq 'AGENT01L_CGROUP_DELEGATION_NOT_AVAILABLE=1' custody-evidence/linux-delegated-kernel-git.log
      - name: Windows genuine Job object nested-process and reviewed Git restart
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-win-worker-job/Cargo.toml --lib agent01l_kernel_job_tests -- --nocapture 2>&1 | tee custody-evidence/windows-job.log
          grep -Fq 'native_job_terminates_descendant_cmd_tree_and_queries_kernel_empty ... ok' custody-evidence/windows-job.log
          grep -Fq 'test result: ok. 2 passed; 0 failed;' custody-evidence/windows-job.log
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib native_background_process::tests::agent01l_real_git_job_attests_original_turn_and_reopens_without_replay -- --nocapture 2>&1 | tee custody-evidence/windows-reviewed-git-restart.log
          grep -Fq 'agent01l_real_git_job_attests_original_turn_and_reopens_without_replay ... ok' custody-evidence/windows-reviewed-git-restart.log
          grep -Fq 'test result: ok. 1 passed; 0 failed;' custody-evidence/windows-reviewed-git-restart.log
      - name: Preserve explicit independent exclusions
