          node --test lu-desktop/tests/p0-physical-ux-contract.test.mjs lu-desktop/tests/p0-native-window-separation.test.mjs lu-desktop/tests/p0-native-intent.test.mjs lu-desktop/tests/p0-memory-telemetry.test.mjs lu-desktop/tests/p0-browser-bundle.test.mjs lu-desktop/tests/p0-research-provider-bundle.test.mjs lu-desktop/tests/p0-installed-gui-smoke.test.mjs lu-desktop/tests/p0-hf-transfer-transaction.test.mjs lu-desktop/tests/p0-qwen38-radeon-handoff.test.mjs lu-desktop/tests/ux-chat01-message-interactions.test.mjs lu-desktop/tests/preview-dual-backend.test.mjs 2>&1 | tee p0-native-evidence/p0-source-tests.log
      - name: Native Linux desktop WebView dependencies
