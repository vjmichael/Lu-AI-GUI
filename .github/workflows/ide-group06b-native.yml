# G06B-04 exact-head native closeout: six reviewed commit/amend/restart tests green, twelve exact rustfmt repairs, Tauri compile.
# Preserve real frontend-built icon; no CI-only icon may overwrite a valid app resource.
# No Git write authority or operator acceptance.
name: IDE Group 6B reviewed batch source (not release)
on:
  push:
    branches: [ide/group06b-advanced-staging-20261110]
    paths:
      - '.github/workflows/ide-group06b-native.yml'
      - 'ide/host/src/git_reviewed_commit.rs'
      - 'ide/app/fixtures/g06b05_git_oracle.py'
      - 'ide/app/fixtures/test_g06b05_git_oracle.py'
      - 'ide/app/fixtures/Test-G06B05InstalledDebSmoke.sh'
      - 'ide/app/src-tauri/tauri.g06b05.windows.conf.json'
      - 'ide/app/src-tauri/tauri.g06b05.linux.conf.json'
      - 'ide/docs/IDE_GROUP06B05_INSTALLED_COMMIT_RECOVERY_20261110.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ide-g06b-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-preview:
    name: Exact-source bounded Git batch preview / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source and independent Group 6B lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 119830a167c335a76a3ae7389ca4be47985c88eb HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Linux native Tauri build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev patchelf libssl-dev
      - name: G06B05 independent real-Git integrity and hostile state oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ide/app/fixtures -p 'test_g06b05_git_oracle.py' -v
          python -m py_compile ide/app/fixtures/g06b05_git_oracle.py
          bash -n ide/app/fixtures/Test-G06B05InstalledDebSmoke.sh
          echo G06B05_ORACLE=REAL_GIT_TESTS_NOT_INSTALLED_CONSENT
      - name: Human batch review UI boundary and web bundle
        shell: bash
        run: |
          set -euo pipefail
          cd ide/app
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/g06b_reviewed_batch_preview.test.mjs tests/g06b_reviewed_hunk_selection.test.mjs tests/g06b_protected_partial_stage.test.mjs tests/g06b_reviewed_commits_amend.test.mjs
          npm run build
      - name: Native reviewed-batch bounded validation and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/host/Cargo.toml --lib git_batch_review
          cargo test --manifest-path ide/host/Cargo.toml --lib git_hunk_review
          cargo test --manifest-path ide/host/Cargo.toml --lib git_partial_stage
          cargo test --manifest-path ide/host/Cargo.toml --lib git_reviewed_commit
          rustfmt --edition 2021 --check ide/host/src/git_batch_review.rs ide/host/src/git_hunk_review.rs ide/host/src/reviewed_git.rs ide/host/src/git_partial_stage.rs ide/host/src/git_reviewed_commit.rs
          echo IDE_G06B_REVIEWED_COMMIT_AMEND=TESTED_SOURCE_NOT_PHYSICAL_HUMAN_APPROVAL
      - name: Tauri read-only route compilation
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the existing frontend-built icon; the CI-only helper
          # must never overwrite it. Generate only when genuinely absent.
          if [ "$RUNNER_OS" = Windows ] && [ ! -f ide/app/src-tauri/icons/icon.ico ]; then
            python ide/app/fixtures/make_g04d_ci_icon.py
          fi
          cargo check --locked --manifest-path ide/app/src-tauri/Cargo.toml --all-targets
          echo IDE_G06B_TAURI=COMPILED_NOT_INSTALLED
      - name: Bound source receipt, not operator approval
        if: always()
        shell: bash
        run: |
          mkdir -p .ide-g06b-receipts
          printf 'source_sha=%s\nos=%s\nmulti_file_batch_stage=DENIED\npartial_hunk_stage=REQUIRES_ONE_USE_NATIVE_OS_DIALOG\ngit_commit=REQUIRES_SEPARATE_ONE_USE_OS_DIALOG\namend=REQUIRES_EXPLICIT_ADDITIONAL_HISTORY_REWRITE_OS_DIALOG\nphysical_operator=NOT_EXECUTED_IN_CI\n' \
            "$GITHUB_SHA" "$RUNNER_OS" > .ide-g06b-receipts/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-g06b-${{ matrix.os }}-${{ github.sha }}
          path: .ide-g06b-receipts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  installed-debian-smoke:
    name: G06B05 real Debian install, process restart, uninstall (not physical consent)
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact selected source and native graphical dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf libssl-dev xvfb xauth xdotool dbus-x11 openbox
      - name: Resolve source licenses and build actual unsigned Debian package
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha "$GITHUB_SHA" --output ide/app/src-tauri/upstream-notice-receipt.json
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha "$GITHUB_SHA" --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          cd ide/app
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.g06b05.linux.conf.json --bundles deb
      - name: Verify license payload and exercise real Debian installation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          [[ "${#packages[@]}" -eq 1 ]] || { echo G06B05_DEB_DENIED:package_count >&2; exit 2; }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha "$GITHUB_SHA" --require-upstream --artifact "${packages[0]}" --receipt ide/app/src-tauri/verification-package-receipt.json
          bash ide/app/fixtures/Test-G06B05InstalledDebSmoke.sh "${packages[0]}" "$GITHUB_SHA"
          sha256sum "${packages[0]}"
          echo G06B05_LINUX_INSTALLED_SMOKE=NOT_HUMAN_CONSENT
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ide-g06b05-deb-${{ github.sha }}
          path: |
            ide/app/src-tauri/target/release/bundle/deb/*.deb
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7

  installed-windows-smoke:
    name: G06B05 real NSIS install, process restart, uninstall (not physical consent)
    runs-on: windows-2022
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build exact source and independently bound Windows license inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --prefix ide/app --ignore-scripts --no-audit --no-fund
          cargo fetch --locked --manifest-path ide/app/src-tauri/Cargo.toml
          python ide/packaging/upstream_notice_receipt.py --repo-root . --source-sha "$GITHUB_SHA" --output ide/app/src-tauri/upstream-notice-receipt.json
          python ide/packaging/collect_verification_licenses.py --repo-root . --output ide/app/src-tauri/verification-notices --source-sha "$GITHUB_SHA" --upstream-receipt ide/app/src-tauri/upstream-notice-receipt.json
          if [ ! -f ide/app/src-tauri/icons/icon.ico ]; then python ide/app/fixtures/make_g04d_ci_icon.py; fi
          cd ide/app
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.g06b05.windows.conf.json --bundles nsis
      - name: Verify installer, install and restart real NSIS application, independent Git integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=@(Get-ChildItem 'ide/app/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'G06B05_NSIS_DENIED:installer_count' }
          python ide/packaging/verify_p04_license_bundle.py --license-root ide/app/src-tauri/verification-notices --source-sha $env:GITHUB_SHA --require-upstream --artifact $setup[0].FullName --receipt ide/app/src-tauri/verification-package-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'G06B05_NSIS_DENIED:unverified_licenses' }
          $fixture=Join-Path $env:RUNNER_TEMP 'g06b05-disposable-git'
          $manifest=Join-Path $env:RUNNER_TEMP 'g06b05-git-before.json'
          python ide/app/fixtures/g06b05_git_oracle.py fixture --directory $fixture --mode create
          if ($LASTEXITCODE -ne 0) { throw 'G06B05_NSIS_DENIED:fixture' }
          python ide/app/fixtures/g06b05_git_oracle.py snapshot --repo $fixture --manifest $manifest --mode create --expect-index initial
          if ($LASTEXITCODE -ne 0) { throw 'G06B05_NSIS_DENIED:independent_snapshot' }
          & ide/app/fixtures/Test-InstalledAlphaNsis.ps1 -InstallerPath $setup[0].FullName -InstallRoot (Join-Path $env:RUNNER_TEMP 'g06b05-nsis-test-install')
          python ide/app/fixtures/g06b05_git_oracle.py check --manifest $manifest --outcome unchanged
          if ($LASTEXITCODE -ne 0) { throw 'G06B05_NSIS_DENIED:unrelated_git_modified' }
          Write-Host 'G06B05_WINDOWS_INSTALLED_SMOKE=NOT_HUMAN_CONSENT'
          Write-Host ('G06B05_NSIS_SHA256='+(Get-FileHash -Algorithm SHA256 $setup[0].FullName).Hash)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ide-g06b05-nsis-${{ github.sha }}
          path: |
            ide/app/src-tauri/target/release/bundle/nsis/*setup.exe
            ide/app/src-tauri/verification-notices/**
            ide/app/src-tauri/verification-package-receipt.json
          if-no-files-found: error
          retention-days: 7
