name: IDE WO6 real protected LLDB-DAP OS acceptance
on:
  pull_request:
    paths:
      - 'ide/supervisor/**'
      - 'ide/sandbox/**'
      - '.github/workflows/ide-wo6-native-os-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-windows-fixed-debugger:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Compile protected service, bootstrap and genuine LLDB-DAP fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo build --manifest-path ide/supervisor/Cargo.toml --features 'dap-transport,protected-recovery-service' --bin windows_recovery_service --bin windows_null_service_bootstrap --example wo6_native_dap_acceptance
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native debugger test compilation failed' }
      - name: Stage test-only self-measured LLDB-DAP and fixed debuggee
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Get-Command lldb-dap.exe -ErrorAction SilentlyContinue
          $lldb=if ($candidate) { $candidate.Source } else { 'C:\Program Files\LLVM\bin\lldb-dap.exe' }
          if (!(Test-Path -LiteralPath $lldb)) { throw 'DENIED: no real LLDB-DAP installed; no fake adapter allowed' }
          $origin=Split-Path $lldb -Parent
          $clang=Join-Path $origin 'clang.exe'
          if (!(Test-Path -LiteralPath $clang)) { throw 'DENIED: matching Clang unavailable' }
          $bundle=Join-Path $env:RUNNER_TEMP 'wo6-dap-bundle'
          New-Item -Force -ItemType Directory (Join-Path $bundle 'bin') | Out-Null
          New-Item -Force -ItemType Directory (Join-Path $bundle 'debuggee') | Out-Null
          Copy-Item -LiteralPath $lldb -Destination (Join-Path $bundle 'bin\lldb-dap.exe')
          Get-ChildItem -LiteralPath $origin -Filter '*.dll' -File | Copy-Item -Destination (Join-Path $bundle 'bin')
          & $clang -g -O0 -o (Join-Path $bundle 'debuggee\wo6-selftest.exe') 'ide/supervisor/fixtures/debug/wo6_selftest.c'
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: first-party debuggee build failed' }
          $adapter=Join-Path $bundle 'bin\lldb-dap.exe'
          if (!(Test-Path -LiteralPath $adapter)) { throw 'DENIED: fixed native adapter missing' }
          # LLDB-DAP --help and --version flags are NOT standardized DAP
          # operations and may return nonzero for a healthy adapter. Real
          # protected initialize/launch and OS cleanup below are mandatory;
          # never substitute this file-existence check for executable proof.
          Add-Content $env:GITHUB_ENV "LU_IDE_WO6_DAP_BUNDLE=$bundle"
      - name: Verify actual AppContainer debuggee normal/cancel with independent SCM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $service=(Resolve-Path 'ide/supervisor/target/debug/windows_recovery_service.exe').Path
          $hostExe=(Resolve-Path 'ide/supervisor/target/debug/examples/wo6_native_dap_acceptance.exe').Path
          $bootstrap=(Resolve-Path 'ide/supervisor/target/debug/windows_null_service_bootstrap.exe').Path
          $installed=$false
          $nulTouched=$false
          try {
            & 'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1' -ServiceExecutable $service -ExpectedServiceSha256 (Get-FileHash $service -Algorithm SHA256).Hash -ApprovedHostExecutable $hostExe -ExpectedHostSha256 (Get-FileHash $hostExe -Algorithm SHA256).Hash -CiAcceptanceUnsigned -Start
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: restricted service installation failed' }
            $installed=$true
            $nulTouched=$true
            & $bootstrap --grant-fixed-service
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: NUL bootstrap grant failed' }
            & $bootstrap --verify-fixed-service
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: exact service NUL readback failed' }
            $env:LU_IDE_WO6_DAP_TRUSTED_SERVICE=$service
            $env:LU_IDE_E2_NATIVE_TRACE='1'
            & $hostExe
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: protected native debugger normal acceptance failed' }
            & $hostExe --cancel
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: protected native debugger cancellation/restart failed' }
          } finally {
            if ($nulTouched) {
              & $bootstrap --revoke-fixed-service
              if ($LASTEXITCODE -ne 0) { throw 'DENIED: exact service NUL revoke failed' }
            }
            if ($installed) {
              & sc.exe delete LuIdeRecoveryBroker 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'DENIED: protected SCM service delete failed' }
            }
            $global:LASTEXITCODE=0
          }
      - name: Label evidence
        if: always()
        run: echo "Test-only independently measured binaries; NOT license/signing/installed debugger release approval."
  native-linux-delegated-fixed-debugger:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install actual LLDB-DAP, Clang and Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap clang-18 lldb-18 apparmor-profiles apparmor-utils
          # Ubuntu 24.04 AppArmor may reject unprivileged bwrap userns with
          # EPERM. Provision ONLY the distribution-reviewed bwrap-userns-
          # restrict profile; never disable AppArmor or global userns policy.
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -r "$profile" || { echo 'DENIED: reviewed distro bwrap profile unavailable'; exit 1; }
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          /usr/bin/bwrap --unshare-all --ro-bind /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true ||
            { echo 'DENIED: unprivileged Bubblewrap namespace still forbidden under scoped AppArmor profile'; exit 1; }
          test -x /usr/bin/systemd-run
          test -f /sys/fs/cgroup/cgroup.controllers
      - name: Root-own immutable test-only adapter and fixed debuggee
        shell: bash
        run: |
          set -euo pipefail
          adapter=''
          for exe in /usr/bin/lldb-dap-18 /usr/bin/lldb-dap; do
            if test -x "$exe"; then adapter="$exe"; break; fi
          done
          test -n "$adapter" || { echo 'DENIED: genuine packaged LLDB-DAP not available'; exit 1; }
          clang-18 -g -O0 -o "$RUNNER_TEMP/wo6-selftest" ide/supervisor/fixtures/debug/wo6_selftest.c
          sudo install -d -o root -g root -m 755 /opt/lu-ide-wo6-dap-test/bin
          sudo install -d -o root -g root -m 755 /opt/lu-ide-wo6-dap-test/debuggee
          sudo install -o root -g root -m 755 "$adapter" /opt/lu-ide-wo6-dap-test/bin/lldb-dap
          sudo install -o root -g root -m 755 "$RUNNER_TEMP/wo6-selftest" /opt/lu-ide-wo6-dap-test/debuggee/wo6-selftest
          test "$(stat -c %u /opt/lu-ide-wo6-dap-test/bin/lldb-dap)" = 0
      - name: Classify native LLDB adapter distribution and copied-bundle initialization
        shell: bash
        run: |
          set -euo pipefail
          # Fixed protocol request, no project execution. Distinguishes broken
          # distro resource lookup from genuine kernel/stdio/DAP failures.
          # Only fixed categories are shown; raw stderr and paths are hidden.
          python3 ide/supervisor/fixtures/debug/probe_lldb_dap_initialize.py
      - name: Compile trusted fixed delegated OS host and native DAP fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path ide/sandbox/Cargo.toml --bin linux_cgroup_prepare --bin linux_delegated_ci_wo6_dap_host
          cargo build --manifest-path ide/supervisor/Cargo.toml --features 'dap-transport,linux-worker' --example wo6_native_dap_acceptance
      - name: Verify real delegated cgroup normal and cancellation
        shell: bash
        run: |
          set -euo pipefail
          host="$(realpath ide/sandbox/target/debug/linux_delegated_ci_wo6_dap_host)"
          for mode in normal cancel; do
            args=()
            if [[ "$mode" == cancel ]]; then args+=(--cancel); fi
            rc=0
            sudo /usr/bin/systemd-run --wait --collect --pipe \
              --unit=lu-ide-delegated \
              --property=Type=exec \
              --property=User=runner \
              --property=Group=runner \
              --property='Delegate=cpu memory pids' \
              --property=DelegateSubgroup=lu-ide-host \
              "$host" "${args[@]}" || rc=$?
            if [[ "$rc" != 0 ]]; then
              echo 'DENIED: native delegated LLDB-DAP did not meet OS acceptance'
              sudo systemctl show lu-ide-delegated.service --no-pager --property=Result,ExecMainCode,ExecMainStatus,Delegate,DelegateSubgroup || true
              sudo journalctl -u lu-ide-delegated.service --no-pager -n 40 --output=cat || true
              exit "$rc"
            fi
            echo "PASS: genuine Linux delegated LLDB-DAP $mode"
          done
      - name: Label evidence
        run: echo "Native test-only kernel acceptance, not release signed debugger/installed app."

  native-linux-protected-cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install root-owned fixed offline Cargo and Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap rustc cargo apparmor-profiles apparmor-utils
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -r "$profile" || { echo 'DENIED: reviewed distribution Bubblewrap profile unavailable'; exit 1; }
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          /usr/bin/bwrap --unshare-all --ro-bind /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true ||
            { echo 'DENIED: real unprivileged bwrap namespace creation denied; global restrictions unchanged'; exit 1; }
          for file in /usr/bin/bwrap /usr/bin/cargo /usr/bin/rustc; do
            test -f "$file"
            test "$(stat -c %u "$file")" = 0
          done
          test -x /usr/bin/systemd-run
      - name: Compile actual delegated cgroup helper and Cargo acceptance fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path ide/sandbox/Cargo.toml --bin linux_cgroup_prepare --bin linux_delegated_ci_wo6_build_host
          cargo build --manifest-path ide/supervisor/Cargo.toml --features linux-worker --example wo6_linux_native_build_acceptance
      - name: Real isolated Cargo check, test and cancellation with kernel receipts
        shell: bash
        run: |
          set -euo pipefail
          host="$(realpath ide/sandbox/target/debug/linux_delegated_ci_wo6_build_host)"
          for mode in --check --test --cancel; do
            rc=0
            sudo /usr/bin/systemd-run --wait --collect --pipe \
              --unit=lu-ide-delegated \
              --property=Type=exec \
              --property=User=runner \
              --property=Group=runner \
              --property='Delegate=cpu memory pids' \
              --property=DelegateSubgroup=lu-ide-host \
              "$host" "$mode" || rc=$?
            if [[ "$rc" -ne 0 ]]; then
              echo 'DENIED: actual delegated Linux Cargo OS evidence failed'
              sudo systemctl show lu-ide-delegated.service --no-pager --property=Result,ExecMainStatus,Delegate,DelegateSubgroup || true
              sudo journalctl -u lu-ide-delegated.service --no-pager -n 40 --output=cat || true
              exit "$rc"
            fi
            echo "PASS: genuine delegated Linux Cargo $mode, journal restart"
          done
      - name: Scope
        run: echo "Native OS check/test/cancel fixture only; installed desktop and release toolchain acceptance remain independent."
