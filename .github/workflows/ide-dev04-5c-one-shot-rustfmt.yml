# Temporary DEV-04.5C exact-head native formatting; remove after inspecting successful result.
name: IDE DEV04.5C one-shot native rustfmt
on:
  push:
    branches: [ide/dev04-5c-reviewed-installed-debugger-20261108]
    paths:
      - 'ide/supervisor/examples/wo6_native_dap_acceptance.rs'
      - 'ide/supervisor/examples/wo6_linux_native_build_acceptance.rs'
      - 'ide/sandbox/src/bin/linux_delegated_ci_wo6_build_host.rs'
      - 'ide/host/src/dap_session.rs'
      - '.github/workflows/ide-dev04-5c-one-shot-rustfmt.yml'
permissions:
  contents: write
concurrency:
  group: dev045c-format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formatting-only:
    if: github.ref == 'refs/heads/ide/dev04-5c-reviewed-installed-debugger-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Format only reviewed native project-DAP acceptance sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          cargo fmt --manifest-path ide/host/Cargo.toml --all
          cargo fmt --manifest-path ide/supervisor/Cargo.toml --all
          cargo fmt --manifest-path ide/sandbox/Cargo.toml --all
          git diff --name-only > "$RUNNER_TEMP/dev045c-native-rustfmt"
          if ! test -s "$RUNNER_TEMP/dev045c-native-rustfmt"; then
            echo 'DEV045C_RUSTFMT=already_clean'
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              ide/supervisor/examples/wo6_native_dap_acceptance.rs|ide/supervisor/examples/wo6_linux_native_build_acceptance.rs|ide/sandbox/src/bin/linux_delegated_ci_wo6_build_host.rs|ide/host/src/dap_session.rs) ;;
              *) echo "DENIED: formatter changed unreviewed source: $file"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/dev045c-native-rustfmt"
          git add -- ide/supervisor/examples/wo6_native_dap_acceptance.rs ide/supervisor/examples/wo6_linux_native_build_acceptance.rs ide/sandbox/src/bin/linux_delegated_ci_wo6_build_host.rs ide/host/src/dap_session.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(ide): exact DEV04.5C native debugger source formatting [rustfmt]'
          git push origin HEAD:refs/heads/ide/dev04-5c-reviewed-installed-debugger-20261108
      - name: Source-only format verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ide/host/Cargo.toml --all -- --check
          cargo fmt --manifest-path ide/supervisor/Cargo.toml --all -- --check
          cargo fmt --manifest-path ide/sandbox/Cargo.toml --all -- --check
          echo 'DEV045C_NATIVE_FORMAT=VERIFIED_SOURCE_ONLY_NOT_OS_EXECUTION'
