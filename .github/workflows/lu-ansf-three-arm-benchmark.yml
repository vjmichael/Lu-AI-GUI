name: Lu ANSF Three-Arm Real-Model Baseline
on:
  push:
    branches:
      - lu/ansf-three-arm-real-model-baselines-20261107
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/memory/**'
      - 'src-tauri/lu-core/examples/ansf_memory_baseline.rs'
      - 'src-tauri/lu-core/src/ansf*.rs'
      - '.github/workflows/lu-ansf-three-arm-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: lu-ansf-memory-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Verify frozen exact committed source
        run: node scripts/verify-source-tree.mjs
      - name: Check baseline grading and fairness
        run: python3 -m unittest discover -s benchmarks/memory -p 'test_*.py' -v
      - name: Compile real Lu Core ANSF adapter
        run: cargo build --locked --manifest-path src-tauri/lu-core/Cargo.toml --example ansf_memory_baseline
      - name: Verify actual SQLite ANSF and direct-ID tests
        run: |
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib ansf_source_ids::tests -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test ansf -- --nocapture
  real-gguf-baseline:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      MODEL_SHA256: 7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d
      MODEL_URL: https://huggingface.co/QuantFactory/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf
      ENGINE_TAG: b12143
      ENGINE_SHA_PREFIX: 2bc46ba
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Build real Lu ANSF adapter
        run: cargo build --locked --release --manifest-path src-tauri/lu-core/Cargo.toml --example ansf_memory_baseline
      - name: Compile pinned llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ENGINE_TAG" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-cpp"
          actual="$(git -C "$RUNNER_TEMP/llama-cpp" rev-parse HEAD)"
          short="$(printf '%s' "$actual" | cut -c 1-7)"
          if [[ "$short" != "$ENGINE_SHA_PREFIX" ]]; then
            echo "llama.cpp tag moved or incorrect: $actual" >&2; exit 1
          fi
          cmake -S "$RUNNER_TEMP/llama-cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --config Release --target llama-server --parallel 3
          test -x "$RUNNER_TEMP/llama-build/bin/llama-server"
          sha256sum "$RUNNER_TEMP/llama-build/bin/llama-server"
          echo "ENGINE_COMMIT=$actual" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qwen3-0.6b-q4km.gguf
          key: lu-ansf-qwen3-0.6b-q4km-7af3fdf842f87b24672f8a7f1dd50404043f0bfb71093ff91c31d2b49df4631d
      - name: Download and checksum verify GGUF
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/qwen3-0.6b-q4km.gguf" ]; then
            curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 \
              "$MODEL_URL" -o "$RUNNER_TEMP/qwen3-0.6b-q4km.gguf"
          fi
          printf '%s  %s\n' "$MODEL_SHA256" "$RUNNER_TEMP/qwen3-0.6b-q4km.gguf" | sha256sum -c -
      - name: Compare 14 tasks, three memory modes, two paired real-model repeats
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/memory/three_arm_real_model.py \
            --native "$GITHUB_WORKSPACE/src-tauri/lu-core/target/release/examples/ansf_memory_baseline" \
            --engine "$RUNNER_TEMP/llama-build/bin/llama-server" \
            --engine-version "$ENGINE_TAG:$ENGINE_COMMIT" \
            --model "$RUNNER_TEMP/qwen3-0.6b-q4km.gguf" \
            --model-sha256 "$MODEL_SHA256" \
            --output-dir "$RUNNER_TEMP/lu-ansf-baseline" \
            --repeats 2
      - name: Preserve finding even if ANSF loses to ordinary history
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/lu-ansf-baseline/summary.md"; then
            cat "$RUNNER_TEMP/lu-ansf-baseline/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No valid result summary. Missing real engine/model is NOT a benchmark." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-ansf-three-arm-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lu-ansf-baseline/summary.md
            ${{ runner.temp }}/lu-ansf-baseline/results.json
            ${{ runner.temp }}/lu-ansf-baseline/partial_rows.json
            ${{ runner.temp }}/lu-ansf-baseline/llama-server.log
          if-no-files-found: warn
          retention-days: 14
