name: IDE P04 default-deny release and native migration source checks
on:
  pull_request:
    paths:
      - 'ide/packaging/**'
      - 'ide/app/fixtures/Test-P04SignedReinstall.ps1'
      - 'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1'
      - '.github/workflows/ide-p04-*'
      - '.github/workflows/ide-wo7-installed-acceptance.yml'
      - 'ide/docs/IDE_P04_INSTALLED_RELEASE_CLOSEOUT_20261107.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-and-hostile-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require exact PR source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate P04 hostile native state and rollback evidence
        run: python -m unittest discover -s ide/packaging -p 'test_verify_p04_transition_evidence.py' -v
      - name: Verify signed WO7 source and candidate refusal tests
        run: python -m unittest discover -s ide/packaging -p 'test_verify_wo7_*.py' -v
      - name: Verify installed WO8 evidence default-deny
        run: python -m unittest discover -s ide/packaging -p 'test_verify_wo8_installed_evidence.py' -v
      - name: Verify installed WO9 release evidence default-deny
        run: python -m unittest discover -s ide/packaging -p 'test_verify_wo9_release.py' -v
      - name: Parse genuine Windows signed installer and UI witness code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($path in @('ide/app/fixtures/Test-P04SignedReinstall.ps1',
              'ide/app/fixtures/Test-Wo8NativeDesktopUI.ps1',
              'ide/app/fixtures/Test-Wo7SignedInstalledNsis.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "DENIED: P04 native PowerShell syntax: $($errors[0])" }
          }
      - name: Scope
        run: echo "P04_SOURCE_CHECK_ONLY_SIGNED_NATIVE_REINSTALL_AND_TWO_VERSION_ROLLBACK_STILL_UNPROVEN"
