name: Lu TOOLS 01–05 unified native integration
on:
  push:
    branches:
      - 'lu/tools-01-05-*'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'lu-desktop/**'
      - '.github/workflows/lu-tools-01-05-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lu-tools-01-05-native
  cancel-in-progress: true
jobs:
  lock-audit:
    name: Confirm reproducible Cargo.lock (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Core and desktop graphs, fail if lockfiles need changes
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --manifest-path src-tauri/lu-core/Cargo.toml > /dev/null
          cargo metadata --format-version 1 --manifest-path lu-desktop/src-tauri/Cargo.toml > /dev/null
          if ! git diff --quiet -- src-tauri/lu-core/Cargo.lock lu-desktop/src-tauri/Cargo.lock; then
            echo 'LU_LOCKFILE_DRIFT: commit the exact Cargo-resolved diff, never accept a mutated checkout'
            git diff -- src-tauri/lu-core/Cargo.lock lu-desktop/src-tauri/Cargo.lock
            exit 1
          fi
          echo 'LU_LOCKFILES_MATCH'
  native:
    name: Native tool/authorization suite (${{ matrix.os }})
    needs: lock-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Rust Core tests
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --lib --tests -- --nocapture
      - name: Checked hostile archive/member tests
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test native_archive_inspect -- --nocapture
  desktop:
    name: Native Windows desktop host compile
    needs: lock-audit
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check full Tauri desktop compile
        run: cargo check --locked --manifest-path lu-desktop/src-tauri/Cargo.toml
      - name: Compile Windows desktop Rust tests
        run: cargo test --locked --no-run --manifest-path lu-desktop/src-tauri/Cargo.toml
  frontend:
    name: Frontend and dual-feature UX regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned UI dependencies
        run: npm ci
        working-directory: lu-desktop
      - name: Bundle both file edits and Reader/background UI
        run: npm run build
        working-directory: lu-desktop
      - name: Run UI regressions
        run: npm run test:ui
        working-directory: lu-desktop
  source-tree:
    name: Verify exact repository content lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only source hash inventory check
        run: node scripts/verify-source-tree.mjs
