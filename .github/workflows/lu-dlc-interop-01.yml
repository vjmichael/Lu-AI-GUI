name: Lu DLC-IPC-01 portable workspace inference contract
on:
  push:
    branches:
      - lu/dlc-interop-01-cross-platform-contract-20261103
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-contract:
    name: Linux Protobuf workspace/capability denial contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Git-tracked Lu source
        run: node scripts/verify-source-tree.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Run actual Lu Core DLC Protobuf admission tests
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml dlc_interop::tests -- --nocapture
      - name: Run existing workspace ownership and inference wire regression
        run: |
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml workspace::tests -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml inference_wire::tests -- --nocapture
  windows-contract:
    name: Windows Protobuf workspace/capability denial contracts
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Git-tracked Lu source
        run: node scripts/verify-source-tree.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Run actual Lu Core DLC Protobuf admission tests
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml dlc_interop::tests -- --nocapture
      - name: Run existing workspace ownership and inference wire regression
        run: |
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml workspace::tests -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml inference_wire::tests -- --nocapture
# This is source-level Rust contract acceptance, not external socket admission,
# installed-alpha invocation, user-approval integration, or real GGUF proof.
