# Group 3 final source-format corrected native AppContainer/SCM/Linux admission group.
# Group 3 exact-head combined rerun after test-only ACL fixture owner sealing.
# Group 3 native standalone supervisor/sandbox crates are source-tested without
# --locked: neither has a committed standalone Cargo.lock. Group 2 installed
# dependency locking remains unchanged; these are NOT production packages.
name: IDE Group 3 Windows AppContainer SCM and Linux authorization negatives (NOT release)
on:
  push:
    branches: [ide/group03-security-authorization-20261110]
    paths:
      - '.github/workflows/ide-group03-security-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ide-group03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-native-appcontainer:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Exact source, physical human-denial contract, script syntax
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.sha }}") { throw 'DENIED: SHA drift' }
          python ide/app/fixtures/test_group03_security_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: authority contract' }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ide/app/fixtures/Test-DEV046D-PhysicalHumanConsent.ps1').Path,
            [ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw 'DENIED: physical witness syntax' }
          Write-Host 'IDE_G03_PHYSICAL_HUMAN_APPROVAL=NOT_ACCEPTED'
      - name: Native Windows supervisor security and journal tests
        shell: pwsh
        run: |
          cargo test --manifest-path ide/supervisor/Cargo.toml --features package-uv-worker,protected-recovery-service --lib
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: supervisor tests failed' }
          cargo fmt --manifest-path ide/supervisor/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: supervisor formatting' }
      - name: Actual Windows AppContainer low IL, owner-rights denial and private output
        shell: pwsh
        run: |
          cargo run --manifest-path ide/supervisor/Cargo.toml --features ide056-ci-acl-positive --example ide056_windows_acl_positive
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: real AppContainer ACL probe failed' }
          Write-Host 'IDE_G03_WINDOWS_NATIVE_APPCONTAINER_ACL=PASS'
          Write-Host 'IDE_G03_PRODUCTION_PACKAGE_WORKER=NOT_AUTHORIZED'
  windows-native-scm:
    strategy:
      fail-fast: false
      matrix:
        scenario: [Crash, Loss]
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      LU_IDE_NATIVE_ACCEPTANCE_TRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact source and native SCM fixture syntax
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.sha }}") { throw 'DENIED: SHA drift' }
          foreach ($path in @(
            'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1',
            'ide/supervisor/fixtures/Test-D7DProtectedServiceCrash.ps1',
            'ide/supervisor/fixtures/Test-D7DProtectedServiceLoss.ps1'
          )) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -ne 0) { throw "DENIED: malformed native SCM script: $path" }
          }
      - name: Compile restricted native SCM service and hostile observer
        shell: pwsh
        run: |
          cargo build --manifest-path ide/supervisor/Cargo.toml --features protected-recovery-service --bin windows_recovery_service --bin d7d_service_crash_fixture
          if ($LASTEXITCODE -ne 0) { throw 'DENIED: native SCM compile failed' }
      - name: Actual service-owner/job custody, crash loss and cleanup
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          $ErrorActionPreference='Stop'
          if (Get-Service LuIdeRecoveryBroker -ErrorAction SilentlyContinue) { throw 'DENIED: existing protected service' }
          $service=(Resolve-Path 'ide/supervisor/target/debug/windows_recovery_service.exe').Path
          $fixture=(Resolve-Path 'ide/supervisor/target/debug/d7d_service_crash_fixture.exe').Path
          $serviceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $service).Hash
          $hostHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $fixture).Hash
          try {
            & 'ide/supervisor/fixtures/Install-ProtectedRecoveryService.ps1' -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash -ApprovedHostExecutable $fixture -ExpectedHostSha256 $hostHash -CiAcceptanceUnsigned -Start
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: restricted SCM install failed' }
            if ($env:SCENARIO -eq 'Crash') {
              & 'ide/supervisor/fixtures/Test-D7DProtectedServiceCrash.ps1' -FixtureExecutable $fixture -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash
            } elseif ($env:SCENARIO -eq 'Loss') {
              & 'ide/supervisor/fixtures/Test-D7DProtectedServiceLoss.ps1' -FixtureExecutable $fixture -ServiceExecutable $service -ExpectedServiceSha256 $serviceHash
            } else { throw 'DENIED: unknown scenario' }
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: real SCM hostile fixture failed' }
            Write-Host "IDE_G03_WINDOWS_NATIVE_SCM_$($env:SCENARIO)=PASS"
          } finally {
            & sc.exe delete LuIdeRecoveryBroker 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'DENIED: SCM teardown failed' }
            $global:LASTEXITCODE=0
          }
  linux-security-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Exact source and negative authority contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 ide/app/fixtures/test_group03_security_contract.py
          echo IDE_G03_LINUX_AUTHORIZATION_NEGATIVE_TESTS=PASS
      - name: Run native Linux supervisor and sandbox safety tests
        run: |
          set -euo pipefail
          cargo test --manifest-path ide/supervisor/Cargo.toml --features package-uv-worker,linux-worker --lib
          cargo test --manifest-path ide/sandbox/Cargo.toml --lib
          cargo fmt --manifest-path ide/supervisor/Cargo.toml -- --check
          echo IDE_G03_LINUX_NATIVE_SOURCE_SECURITY=PASS
      - name: Inspect real kernel cgroup quota admission, separate limited/denied outcome
        run: |
          set -euo pipefail
          cargo run --manifest-path ide/sandbox/Cargo.toml --bin linux_cgroup_probe | tee "$RUNNER_TEMP/g03-cgroup.txt"
          if grep -F 'PASS: dedicated empty Lu IDE cgroup-v2 parent delegated' "$RUNNER_TEMP/g03-cgroup.txt"; then
            echo IDE_G03_LINUX_NATIVE_CGROUP=LIMITED_QUOTA_PROBE_PASS
          elif grep -F 'CONTROLLED DENIAL: production worker admission remains disabled' "$RUNNER_TEMP/g03-cgroup.txt"; then
            echo IDE_G03_LINUX_NATIVE_CGROUP=DENIED_NOT_ACCEPTED
          else
            echo IDE_G03_LINUX_NATIVE_CGROUP=UNKNOWN_FAIL
            exit 1
          fi
          echo IDE_G03_LINUX_FULL_CGROUP_BWRAP_WORKER=NOT_ACCEPTED
          echo IDE_G03_PHYSICAL_HUMAN_APPROVAL=NOT_ACCEPTED
