name: IDE WO8 genuine Linux installed Debian and native GTK window
on:
  pull_request:
    paths:
      - 'ide/app/**'
      - 'ide/docs/IDE_WORK_ORDER_08_INSTALLED_E2E_20261107.md'
      - '.github/workflows/ide-wo8-installed-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-installed-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install native Linux Tauri and graphical acceptance prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            xvfb xauth xdotool dbus-x11 x11-utils
      - name: Build frontend and real native Linux Debian package
        working-directory: ide/app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npx --yes @tauri-apps/cli@2.11.5 build --config src-tauri/tauri.wo8.linux.conf.json --bundles deb
      - name: Real Debian installation GTK/X11 window and package removal
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ide/app/src-tauri/target/release/bundle/deb/*.deb)
          [[ "${#packages[@]}" -eq 1 ]] || { echo 'DENIED: unexpected Linux .deb count'; exit 2; }
          bash ide/app/fixtures/Test-Wo8InstalledDeb.sh "${packages[0]}" "$(git rev-parse HEAD)"
      - name: Evidence meaning
        run: |
          echo "Native Linux installed Debian GUI window and uninstall only."
          echo "Not a protected Cargo/debugger, saved editing or release acceptance."
