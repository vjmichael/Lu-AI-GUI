name: LU-IPC-01D-R2 native Windows and Linux Protobuf transport qualification
# Manual or reusable task-group only. No automatic PR/push fanout.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: lu-ipc01d-r2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original committed source verification
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          node scripts/verify-source-tree.mjs
  native:
    needs: exact-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA and original source-lock verification
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          node scripts/verify-source-tree.mjs
      - name: Original Protobuf v0 envelope and R1/R2 transport suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test workspace_ipc_v0 -- --nocapture
          cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test workspace_ipc_transport_r1 -- --nocapture
      - name: Native FFI custody module and original worker crate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/lu-win-worker-job/Cargo.toml --lib -- --nocapture
      - name: Windows protected installed Lu IDE enrollment refuses unapproved executable
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fake=Join-Path $env:RUNNER_TEMP 'unapproved-lu-ide.exe'
          [IO.File]::WriteAllBytes($fake,[byte[]](1,2,3,4,5,6,7,8))
          $args=@{
            InstalledExe=$fake
            ExpectedInstallRoot=$env:RUNNER_TEMP
            ApprovedImageSha256=('1'*64)
            ApprovedSignerCertificateSha256=('2'*64)
            ApprovedPackageSha256=('7'*64)
          }
          $refused=$false
          try{
            & scripts/lu-ipc-r3-stage-installed-ide.ps1 @args
          }catch{
            if($_.Exception.Message -match 'LU_IPC_R3_REFUSED:'){
              $refused=$true
            }else{throw}
          }
          if(-not $refused){throw 'Unapproved and unsigned executable was accepted'}
          if(Test-Path (Join-Path $env:ProgramData 'Lu\IPC\enrollments\lu.ide.json')){
            throw 'Unsigned test unexpectedly created an enrollment'
          }
          Write-Host 'LU_IPC_R3_UNSIGNED_UNAPPROVED_ADMISSION_REFUSED'

