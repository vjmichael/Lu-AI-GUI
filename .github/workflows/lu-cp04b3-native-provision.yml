name: Lu CP-04B3R3 provider refusal classification and strict live gate
on:
  workflow_dispatch:
    inputs:
      google_live:
        description: "Run strict Google live gate (known script-required interstitial)"
        type: boolean
        default: false
      rebuild_engine:
        description: "Rebuild already verified pinned engine and model"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lu-cp04b3-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser-candidate:
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source and protected worker contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-source-tree.mjs
          node --test lu-desktop/tests/browser-staging.test.mjs lu-desktop/tests/browser-native-authorization.test.mjs tests/lu-browser-worker.test.mjs tests/lu-public-search.test.mjs
      - name: Provision pinned Playwright and genuine headed Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --prefix src-tauri/lu-core/workers --no-save --no-package-lock --no-audit --no-fund playwright@1.64.1
          if($LASTEXITCODE -ne 0){throw 'Pinned Playwright unavailable'}
          node src-tauri/lu-core/workers/node_modules/playwright/cli.js install --no-shell chromium
          if($LASTEXITCODE -ne 0){throw 'Pinned Chromium unavailable'}
          node lu-desktop/scripts/assemble-browser-ci-candidate.mjs
          if($LASTEXITCODE -ne 0){throw 'Candidate assembly failed'}
      - name: Verify exact browser candidate and execute unapproved native browser fixture
        shell: pwsh
        env:
          LU_BROWSER_REQUIRE_CANDIDATE: '1'
        run: |
          $ErrorActionPreference='Stop'
          node --test lu-desktop/tests/browser-ci-candidate.test.mjs lu-desktop/tests/browser-ci-executable.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Candidate fixture acceptance failed'}
          $m=Get-Content 'out/lu-browser-candidate/manifest.json' -Raw|ConvertFrom-Json
          $worker=Get-FileHash 'src-tauri/lu-core/workers/lu_browser_worker.mjs' -Algorithm SHA256
          $entry=@($m.files|Where-Object path -ceq 'lu_browser_worker.mjs')
          if($m.status -cne 'candidate' -or $m.playwrightVersion -cne '1.64.1' -or $entry.Count -ne 1 -or $entry[0].sha256 -cne $worker.Hash.ToLowerInvariant()){throw 'Candidate identity or review boundary mismatch'}
          $manifest=(Get-FileHash 'out/lu-browser-candidate/manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($manifest -cne (Get-Content 'out/lu-browser-candidate/manifest.sha256' -Raw).Trim()){throw 'Manifest digest mismatch'}
          "CP04B3_CANDIDATE_UNAPPROVED manifest=$manifest worker=$($entry[0].sha256)" >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve original unapproved browser bytes for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-C62A-UNAPPROVED-Windows-Browser-${{ github.sha }}
          path: out/lu-browser-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Actual DuckDuckGo HTML provider compatibility (not protected production custody)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force cp04b3-provider-evidence|Out-Null
          $env:LU_CP04B_PLAYWRIGHT_MODULE=([uri](Resolve-Path 'out/lu-browser-candidate/node_modules/playwright/index.mjs').Path).AbsoluteUri
          $env:LU_CP04B_CHROMIUM=(Resolve-Path 'out/lu-browser-candidate/chrome.exe').Path
          $env:LU_CP04B_LIVE_HTML_SEARCH='1'
          node --test tests/lu-public-search.test.mjs 2>&1 | Tee-Object -FilePath cp04b3-provider-evidence/live-provider.log
          $result=$LASTEXITCODE
          if($result -ne 0){
            # Preserve bounded status/structure diagnostics in the log. No automatic
            # retry, alternate-provider submission or claim of live acceptance.
            throw 'Live provider or controlled browser gate failed; inspect typed search refusal in evidence, no live acceptance'
          }
          if(-not(Select-String -Path cp04b3-provider-evidence/live-provider.log -Pattern '^ok [0-9]+ - live DuckDuckGo HTML provider must return genuine bounded results$')){throw 'No non-skipped live provider pass'}
      - name: Strict Google compatibility probe (separate, opt-in; not cleared by HTML provider)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.google_live }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:LU_CP04B_PLAYWRIGHT_MODULE=([uri](Resolve-Path 'out/lu-browser-candidate/node_modules/playwright/index.mjs').Path).AbsoluteUri
          $env:LU_CP04B_CHROMIUM=(Resolve-Path 'out/lu-browser-candidate/chrome.exe').Path
          $env:LU_CP04B_LIVE_PUBLIC_SEARCH='1'
          node --test --test-name-pattern='^live Google provider must return genuine bounded results$' tests/lu-public-search.test.mjs 2>&1 | Tee-Object -FilePath cp04b3-provider-evidence/live-google.log
          if($LASTEXITCODE -ne 0){throw 'Google remains unavailable; no Google acceptance'}
          if(-not(Select-String -Path cp04b3-provider-evidence/live-google.log -Pattern '^ok [0-9]+ - live Google provider must return genuine bounded results$')){throw 'No non-skipped Google pass'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-cp04b3-provider-evidence-${{ github.sha }}
          path: cp04b3-provider-evidence/
          if-no-files-found: warn
          retention-days: 14
  native-provider-routing:
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Verify exact source, build genuine frontend and stage compile-only engine placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp04-native-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-source-tree.mjs | tee cp04-native-evidence/source-lock.log
          npm --prefix lu-desktop ci
          npm --prefix lu-desktop run build
          npm --prefix lu-desktop run check
          root=lu-desktop/src-tauri/resources/lu-inference
          for name in llama-server.exe msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            test ! -e "$root/$name"
            printf 'NOT_AN_ENGINE_CP04_SOURCE_TEST_PLACEHOLDER' > "$root/$name"
          done
      - name: Execute native routing and browser authority regressions (live reviewed gate separate)
        shell: bash
        run: |
          set -euo pipefail
          for suite in browser_model_desktop::tests native_browser_host::tests; do
            cargo test --locked --manifest-path lu-desktop/src-tauri/Cargo.toml --lib "$suite" 2>&1 | tee "cp04-native-evidence/${suite%%::*}.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "cp04-native-evidence/${suite%%::*}.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-cp04-native-routing-${{ github.sha }}
          path: cp04-native-evidence/
          if-no-files-found: warn
          retention-days: 14
  # Exact engine/model provisioner unchanged. Reuse the prior native generation
  # receipt and artifact from #44261533230; no redundant rebuild.
  engine-and-model:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_engine }}
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and provision genuine CPU engine and Qwen model
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'Wrong source SHA'}
          node scripts/verify-source-tree.mjs
          if($LASTEXITCODE -ne 0){throw 'Source inventory mismatch'}
          & scripts/lu-cp04b3-provision-llama.ps1 -OutputDir (Join-Path $PWD 'out/cp04b3-engine')
          if(-not $?){throw 'Engine provisioning failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lu-cp04b3-windows-llama-runtime-${{ github.sha }}
          path: out/cp04b3-engine/
          if-no-files-found: warn
          retention-days: 14
