[package]
name = "lu-win-worker-job"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Isolated Windows Job Object FFI for Lu-owned inference workers"
license = "Apache-2.0"
publish = false

[dependencies]

# The destructive SIGKILL test host is deliberately excluded from normal
# builds and all release packaging unless CI opts in explicitly.
[features]
e1-p08-crash-fixture = []

[[bin]]
name = "lu-e1-p08-linux-crash-parent"
path = "src/bin/lu-e1-p08-linux-crash-parent.rs"
required-features = ["e1-p08-crash-fixture"]

[[bin]]
name = "lu-e1-p08-linux-cgroup-crash-parent"
path = "src/bin/lu-e1-p08-linux-cgroup-crash-parent.rs"
required-features = ["e1-p08-crash-fixture"]

[[bin]]
name = "lu-p0-sec02-linux-negative"
path = "src/bin/lu-p0-sec02-linux-negative.rs"
required-features = ["e1-p08-crash-fixture"]

# Former guardians remain buildable for the original unchanged destructive
# CI adversarial matrix, but are neither normal production binaries nor a
# runtime fallback when the SEC-06C systemd supervisor is unavailable.
[[bin]]
name = "lu-linux-cgroup-guard"
path = "src/bin/lu-linux-cgroup-guard.rs"
required-features = ["e1-p08-crash-fixture"]

[[bin]]
name = "lu-linux-group-guard"
path = "src/bin/lu-linux-group-guard.rs"
required-features = ["e1-p08-crash-fixture"]
