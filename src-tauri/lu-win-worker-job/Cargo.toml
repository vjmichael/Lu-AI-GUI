[package]
name = "lu-win-worker-job"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Isolated Windows Job Object FFI for Lu-owned inference workers"
license = "Apache-2.0"
publish = false

[dependencies]

# The destructive SIGKILL test host is deliberately excluded from normal
# builds and all release packaging unless CI opts in explicitly.
[features]
e1-p08-crash-fixture = []

[[bin]]
name = "lu-e1-p08-linux-crash-parent"
path = "src/bin/lu-e1-p08-linux-crash-parent.rs"
required-features = ["e1-p08-crash-fixture"]

[[bin]]
name = "lu-e1-p08-linux-cgroup-crash-parent"
path = "src/bin/lu-e1-p08-linux-cgroup-crash-parent.rs"
required-features = ["e1-p08-crash-fixture"]
