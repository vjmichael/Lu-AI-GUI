[package]
name = "lu-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tauri-independent module contracts and native tool registry for Lu"
license = "Apache-2.0"
publish = false

# Intentionally dependency-free at this stage. This is a separate Rust crate,
# not wired into Jan/Cowork until its boundaries have been reviewed.
[dependencies]
cap-std = "4.0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
prost = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1.1.9"
crc32fast = "1.5.0"
quick-xml = "0.41.0"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ed25519-dalek = "2.1"
lu-win-worker-job = { path = "../lu-win-worker-job" }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"


[features]
# Explicit opt-in native fake HTTP process test. Not in normal/release Lu.
p7l-native-fixture = []

[[bin]]
name = "lu-p7l-kobold-http-fixture"
path = "src/bin/lu_p7l_kobold_http_fixture.rs"
required-features = ["p7l-native-fixture"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
