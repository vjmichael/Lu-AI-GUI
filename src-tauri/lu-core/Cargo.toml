[package]
name = "lu-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tauri-independent module contracts and native tool registry for Lu"
license = "Apache-2.0"
publish = false

# Intentionally dependency-free at this stage. This is a separate Rust crate,
# not wired into Jan/Cowork until its boundaries have been reviewed.
[dependencies]
cap-std = "4.0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Workspace IPC adapters need local sockets/pipes, bounded IO and deadlines.
# No new crate/dependency is introduced; existing Cargo.lock remains usable.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time"] }
prost = "0.14"
jsonschema = { version = "=0.55.0", default-features = false }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1.1.9"
crc32fast = "1.5.0"
quick-xml = "0.41.0"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ed25519-dalek = "2.1"
lu-win-worker-job = { path = "../lu-win-worker-job" }

# Nondefault CI-only compatibility proof for original P06 Python process
# timeouts, cancellation and bounded output, within SEC-06C kernel custody.
[features]
p06-protected-acceptance = ["lu-win-worker-job/p06-protected-acceptance"]

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
