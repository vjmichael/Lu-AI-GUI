[package]
name = "lu-observe-capture-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Host-supervised one-shot Windows.Graphics.Capture picker worker for Lu"

# Built as a separately version-pinned native tool and launched by Lu's
# existing digest-verified BackgroundProcessSupervisor. No autonomous agent.
[dependencies]
windows-capture = "=2.0.1"
sha2 = "=0.10.9"
# Same pinned Windows API package already used by windows-capture 2.0.1.
# Limited query-only process timestamps; no UI privileges or injection.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_RemoteDesktop"] }

[profile.release]
lto = "thin"
strip = true
