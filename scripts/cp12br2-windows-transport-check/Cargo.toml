[package]
name = "lu-dx-transport-windows-check"
version = "0.1.0"
edition = "2021"
[dependencies]
prost = "=0.14.6"
serde = {version="=1.0.229",features=["derive"]}
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_NetManagement", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }
[features]
windows_dx_eval = []
