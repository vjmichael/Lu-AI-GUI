[package]
name = "lu-desktop"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Independent Lu-native Windows desktop, without Jan runtime dependencies"

# Explicit non-release development evaluation of one source-pinned Windows CPU
# llama.cpp build. Compile-time engine SHA-256 + byte size are mandatory; never
# enable this feature for normal alpha, v1.0, or Vulkan production packaging.
[features]
physical_win_cpu_eval = []
# Explicit separate CPU+Vulkan dual-engine current-preview package.
# Requires physical_win_cpu_eval for independently pinned CPU SHA.
dual_win_preview = ["physical_win_cpu_eval"]
# Explicit Windows-only diagnostic transport evaluation; not a release feature.
windows_dx_eval = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
lu-core = { path = "../../src-tauri/lu-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
prost = "0.14"
cap-std = "4.0.3"
rand = "0.8"
base64 = "0.22"
subtle = "2.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
socket2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { version = "1", features = ["macros", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[profile.dev]
debug = 0
[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_NetManagement"] }
