[package]
name = "lu-auth-portable-tests"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
lu-core = { path = "../../../src-tauri/lu-core" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

prost = "0.14"

sha2 = "0.10"
