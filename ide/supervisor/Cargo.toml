[package]
name = "lu-ide-execution-supervisor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Fail-closed durable execution control plane and feature-gated Linux native worker for Lu IDE"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
# Existing locked versions; static uv.lock parsing / PEP 376 RECORD digest checks.
toml = { version = "=0.8.2", optional = true }
base64 = { version = "=0.22.1", optional = true }
lu-ide-workspace = { path = "../host", optional = true }

[features]
default = []
# E2 pipe/protocol gateway only; actual OS LSP launch remains gated.
lsp-transport = ["dep:lu-ide-workspace"]
# DAP reads only OS-attested stdio owned by a protected native supervisor.
# This does not enable arbitrary adapter launch or debugger-run terminal.
dap-transport = ["lsp-transport"]
# Both OS workers are opt-in and not linked into the installed IDE.
# Neither feature registers a Tauri command or an unrestricted execution API.
linux-worker = []
windows-worker = []
# Explicit production opt-in; never use same-user D7C child as release authority.
protected-recovery-service = ["windows-worker"]
# Reviewed multi-language fixed runtime recipes. This is opt-in and can only
# launch after a native installer supplies exact root-owned, hash-pinned
# offline bundles plus the original OS containment and fresh authorization.
multilang-worker = []
# Narrow, opt-in package worker: offline locked uv Sync only. Reuses
# multilang immutable bundle, existing SCM/cgroup admission and journal.
# No generic manager command, networked resolver or Add/Remove.
package-uv-worker = ["multilang-worker", "dep:toml", "dep:base64"]
# FIN05 opt-in Linux-only isolated vcpkg executor, never enabled by default.
# Requires an independently staged exact runtime pin and delegated cgroup/Bwrap.
package-vcpkg-worker = ["multilang-worker", "linux-worker"]
# Disposable CI-only exact wheelhouse fixture. Never linked into installed Tauri.
ide055-ci-wheelhouse = ["package-uv-worker"]
# Explicit compile-time opt-in for disposable native CI ONLY. This is not a
# production worker feature and must not be inherited by Tauri/NSIS builds.
ci-native-null-lease = ["windows-worker"]
# Disposable Windows kernel AppContainer ACL hostile-child test only.
# Never linked into the installed IDE or native-package-uv production path.
ide056-ci-acl-positive = ["windows-worker"]
# CI-only ELF oracle outside the child cgroup, never packaged into a desktop.
# Without this precise opt-in the native method fails closed at runtime.
dev045d3-ci-oracle = ["dap-transport", "linux-worker", "lu-ide-workspace/dev045d3-ci-source-trap"]
# FIN-04R: the first-party LLDB event sideband under native Windows
# AppContainer / Job Object and SCM custody is observation-only.
# No DAP control, CI symbolizer, action grant, or replay authority.
fin04-release-owner-evidence = ["dap-transport", "protected-recovery-service"]
# D4C runs a pinned, native first-party LLVM PE/PDB reader only in
# disposable debug CI; not a Lu release, Tauri command or general tool.
dev045d4c-ci-oracle = ["dap-transport", "protected-recovery-service"]
# Experimental FIN-04W native Windows restricted-token debugger *only* in
# disposable CI debug builds. Never a production or installed application
# capability; review original SCM/Job + stopped-PC evidence before promotion.
fin04w-ci-bridge = ["dev045d4c-ci-oracle"]
# FIN-04W2 fixed message grammar only; no service, worker or runnable IPC.
# Can be tested on both Windows and Linux without kernel privileges.
fin04w2-protocol = ["dap-transport"]
# Distinct debugger SCM service: kernel token proof only; no IPC, Job worker,
# WFP, LLDB or generic process launch. Native CI feature, default OFF.
fin04w2-scm = ["fin04w2-protocol", "windows-worker"]
# A reviewed, patched LLVM 18 debugger owner-event sideband under one-use
# Job/SCM custody, NEVER a default Windows release capability.
dev045d5-ci-event-owner = ["dev045d4c-ci-oracle"]
# Real protected D6C step/breakpoint CI acceptance is never compiled into
# release/installed Lu; requires the original D5 Job/LLDB owner gate.
dev046c-ci-control = ["dev045d5-ci-event-owner", "lu-ide-workspace/dev046c-ci-control"]
# D6D DEV-ONLY Windows Tauri dialog integration, never a signed release path.
# Uses the genuine pinned D5 kernel owner and existing bounded D6C dispatcher.
dev046d-native-dialog = ["dev046c-ci-control"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Version-pinned capability filesystem: Windows handle-rooted child opens.
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Isolation", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_System_Pipes", "Win32_System_Services",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug"
] }
