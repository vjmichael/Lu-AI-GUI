[package]
name = "lu-ide-linux-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Fail-closed Linux sandbox admission and adversarial probes for Lu IDE"

[dependencies]

# Windows Job Object native diagnostic lives in a separate binary crate target.
# No Tauri or workspace dependency; experimental fixture only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
