[package]
name = "lu-ide-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Standalone Lu IDE workspace project registry"

[dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
cap-std = "3.4.6"
sha2 = "0.10"
zip = { version = "2.2.2", default-features = false }
similar = "2.7.0"
git2 = { version = "0.20", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
