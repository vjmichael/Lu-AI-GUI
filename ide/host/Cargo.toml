[package]
name = "lu-ide-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Standalone Lu IDE workspace project registry"

[features]
default = []
# Source-only, disposable protected Windows native acceptance. No Tauri
# control route or released debugger execution rights.
dev046c-ci-control = []
# Disposable Linux original-source trap only. Not an installed/debugger
# control: the source must be fixed, compiler built and externally sealed.
dev045d3-ci-source-trap = []
# Native-only Windows FIN-04W2 split debug protocol, not a desktop action.
# The supervised service must create/attest an AppContainer target before
# this DAP attach grammar may be used. No arbitrary PID or launch fallback.
fin04w2-split-protocol = []

[dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
cap-std = "3.4.6"
sha2 = "0.10"
zip = { version = "2.2.2", default-features = false }
similar = "2.7.0"
git2 = { version = "0.20", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
